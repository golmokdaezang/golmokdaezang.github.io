
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Captain Login | Grand Security Line</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at center,
          #49331d 0%,
          #25180f 45%,
          #140e09 100%
        );

      color: #f1d8a6;
      font-family: Georgia, "Malgun Gothic", serif;
    }

    .login-card {
      width: min(90%, 420px);
      padding: 42px 34px;

      border: 2px solid #a67a3b;
      border-radius: 12px;

      background: rgba(29, 19, 12, 0.94);

      box-shadow:
        0 15px 55px rgba(0, 0, 0, 0.6),
        inset 0 0 20px rgba(189, 137, 64, 0.08);

      text-align: center;
    }

    .symbol {
      font-size: 46px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      color: #e7c07d;
    }

    .subtitle {
      margin-bottom: 32px;
      color: #ad936e;
      font-size: 13px;
      letter-spacing: 2px;
    }

    .field {
      text-align: left;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #d6b783;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;

      border: 1px solid #775b35;
      border-radius: 6px;

      background: #21180f;
      color: #fff0d4;

      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #e4bd79;
      box-shadow: 0 0 0 2px rgba(228, 189, 121, 0.12);
    }

    input::placeholder {
      color: #87735b;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;

      border: 1px solid #e3bd7c;
      border-radius: 6px;

      background:
        linear-gradient(135deg, #b88b49, #795024);

      color: #fff4dc;
      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.15);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .message {
      min-height: 24px;
      margin-top: 20px;

      color: #e7b1a0;
      font-size: 14px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .message.success {
      color: #cce4b2;
    }

    .back {
      display: inline-block;
      margin-top: 20px;

      color: #c5a574;
      font-size: 13px;
      text-decoration: none;
    }

    .back:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 32px 22px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <main class="login-card">

    <div class="symbol">⚓</div>

    <h1>CAPTAIN LOGIN</h1>

    <p class="subtitle">
      GRAND SECURITY LINE
    </p>

    <form id="loginForm">

      <div class="field">
        <label for="email">이메일</label>

        <input
          type="email"
          id="email"
          autocomplete="username"
          placeholder="관리자 이메일"
          required
        >
      </div>

      <div class="field">
        <label for="password">비밀번호</label>

        <input
          type="password"
          id="password"
          autocomplete="current-password"
          placeholder="비밀번호"
          required
        >
      </div>

      <button type="submit" id="loginButton">
        로그인
      </button>

    </form>

    <p
      class="message"
      id="message"
      role="status"
      aria-live="polite"
    ></p>

    <a href="/cabin/" class="back">
      ← 선장실로 돌아가기
    </a>

  </main>

  <!-- Supabase 프로젝트 설정 -->
  <script src="/assets/js/supabase-config.js"></script>

  <!-- Supabase JavaScript 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <script>
    "use strict";

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    let client = null;

    function showMessage(text, success = false) {
      message.textContent = text;
      message.classList.toggle("success", success);
    }

    function setLoading(loading) {
      button.disabled = loading;
      button.textContent = loading
        ? "로그인 확인 중..."
        : "로그인";
    }

    function explainError(error) {
      const text = error?.message || "알 수 없는 오류";

      console.error("Supabase 로그인 오류:", error);

      if (text.includes("Invalid login credentials")) {
        return "이메일 또는 비밀번호가 올바르지 않아.";
      }

      if (text.includes("Email not confirmed")) {
        return "이메일 인증이 완료되지 않았어.";
      }

      if (text.includes("Invalid API key")) {
        return "Supabase Publishable key를 확인해 줘.";
      }

      if (
        text.includes("Failed to fetch") ||
        text.includes("NetworkError")
      ) {
        return "Supabase 서버에 연결하지 못했어. 네트워크나 브라우저 설정을 확인해 줘.";
      }

      return "로그인 실패: " + text;
    }

    function initializeSupabase() {
      const url = window.SUPABASE_URL;
      const key = window.SUPABASE_PUBLISHABLE_KEY;

      if (!url || !key) {
        showMessage(
          "Supabase 연결 정보가 없어. supabase-config.js를 확인해 줘."
        );

        button.disabled = true;
        return false;
      }

      if (
        !window.supabase ||
        typeof window.supabase.createClient !== "function"
      ) {
        showMessage(
          "Supabase 라이브러리를 불러오지 못했어."
        );

        button.disabled = true;
        return false;
      }

      try {
        client = window.supabase.createClient(url, key);

        console.info("Supabase 클라이언트 초기화 완료");
        return true;

      } catch (error) {
        console.error("Supabase 초기화 오류:", error);

        showMessage(
          "Supabase 초기화 실패: " + error.message
        );

        button.disabled = true;
        return false;
      }
    }

    async function checkExistingSession() {
      if (!client) return;

      try {
        const { data, error } =
          await client.auth.getUser();

        if (error) {
          console.info("기존 로그인 확인:", error.message);
          return;
        }

        if (data?.user) {
          showMessage(
            "이미 로그인되어 있어. 이동 중...",
            true
          );

          window.location.replace("/profile/settings/");
        }

      } catch (error) {
        console.error("세션 확인 오류:", error);
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!client) {
        showMessage("Supabase 연결이 준비되지 않았어.");
        return;
      }

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      setLoading(true);
      showMessage("관리자 계정 확인 중...");

      try {
        const { data, error } =
          await client.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {
          throw error;
        }

        if (!data?.user) {
          throw new Error(
            "로그인 응답에 사용자 정보가 없어."
          );
        }

        console.info("Supabase 로그인 성공");

        showMessage(
          "로그인 성공! 프로필 설정으로 이동할게.",
          true
        );

        window.location.replace("/profile/settings/");

      } catch (error) {
        showMessage(explainError(error));

      } finally {
        setLoading(false);
      }
    });

    if (initializeSupabase()) {
      checkExistingSession();
    }
  </script>

</body>
</html>
