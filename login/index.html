
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Captain Login | Grand Security Line</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at center, #49331d, #140e09 75%);
      color: #f1d8a6;
      font-family: Georgia, "Malgun Gothic", serif;
    }

    .login-card {
      width: min(90%, 420px);
      padding: 42px 34px;
      border: 2px solid #a67a3b;
      border-radius: 12px;
      background: rgba(29, 19, 12, 0.94);
      box-shadow: 0 15px 55px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    .symbol {
      font-size: 46px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 28px;
      margin: 0 0 8px;
      color: #e7c07d;
    }

    .subtitle {
      color: #ad936e;
      font-size: 13px;
      margin-bottom: 32px;
      letter-spacing: 2px;
    }

    .field {
      text-align: left;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #d6b783;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #775b35;
      border-radius: 6px;
      background: #21180f;
      color: #fff0d4;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #e4bd79;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 1px solid #e3bd7c;
      border-radius: 6px;
      background: linear-gradient(135deg, #b88b49, #795024);
      color: #fff4dc;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.15);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .message {
      min-height: 24px;
      margin-top: 20px;
      font-size: 14px;
      color: #e7b1a0;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: #c5a574;
      font-size: 13px;
      text-decoration: none;
    }

    .back:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <main class="login-card">
    <div class="symbol">⚓</div>

    <h1>CAPTAIN LOGIN</h1>
    <p class="subtitle">GRAND SECURITY LINE</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">이메일</label>
        <input
          type="email"
          id="email"
          autocomplete="username"
          required
          placeholder="이메일 입력"
        >
      </div>

      <div class="field">
        <label for="password">비밀번호</label>
        <input
          type="password"
          id="password"
          autocomplete="current-password"
          required
          placeholder="비밀번호 입력"
        >
      </div>

      <button type="submit" id="loginButton">
        로그인
      </button>
    </form>

    <p class="message" id="message" role="status"></p>

    <a href="/cabin/" class="back">
      ← 선장실로 돌아가기
    </a>
  </main>

  <script src="/assets/js/supabase-config.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <script>
    "use strict";

    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");
    const form = document.getElementById("loginForm");

    const url = window.SUPABASE_URL;
    const key = window.SUPABASE_PUBLISHABLE_KEY;

    let client;

    if (!url || !key || !window.supabase) {
      message.textContent =
        "Supabase 연결 설정을 확인해 주세요.";
      button.disabled = true;
    } else {
      client = window.supabase.createClient(url, key);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!client) return;

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      button.disabled = true;
      message.textContent = "로그인 확인 중...";

      try {
        const { error } =
          await client.auth.signInWithPassword({
            email,
            password
          });

        if (error) throw error;

        message.style.color = "#cce4b2";
        message.textContent = "로그인 성공! 이동 중...";

        window.location.replace("/profile/settings/");
      } catch (error) {
        message.style.color = "#e7b1a0";
        message.textContent =
          "로그인에 실패했어. 이메일과 비밀번호를 확인해 줘.";
      } finally {
        button.disabled = false;
      }
    });
  </script>

</body>
</html>
