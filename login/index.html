
<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" type="image/png" href="/assets/images/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Captain Login | Grand Security Line</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at center,
          #49331d 0%,
          #25180f 45%,
          #140e09 100%
        );

      color: #f1d8a6;
      font-family: Georgia, "Malgun Gothic", serif;
    }

    .login-card {
      width: min(90%, 420px);
      padding: 42px 34px;

      border: 2px solid #a67a3b;
      border-radius: 12px;

      background: rgba(29, 19, 12, 0.94);

      box-shadow:
        0 15px 55px rgba(0, 0, 0, 0.6),
        inset 0 0 20px rgba(189, 137, 64, 0.08);

      text-align: center;
    }

    .symbol {
      font-size: 46px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      color: #e7c07d;
    }

    .subtitle {
      margin-bottom: 32px;
      color: #ad936e;
      font-size: 13px;
      letter-spacing: 2px;
    }

    .field {
      text-align: left;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #d6b783;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;

      border: 1px solid #775b35;
      border-radius: 6px;

      background: #21180f;
      color: #fff0d4;

      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #e4bd79;
      box-shadow: 0 0 0 2px rgba(228, 189, 121, 0.12);
    }

    input::placeholder {
      color: #87735b;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;

      border: 1px solid #e3bd7c;
      border-radius: 6px;

      background:
        linear-gradient(135deg, #b88b49, #795024);

      color: #fff4dc;
      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.15);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .message {
      min-height: 24px;
      margin-top: 20px;

      color: #e7b1a0;
      font-size: 14px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .message.success {
      color: #cce4b2;
    }

    .back {
      display: inline-block;
      margin-top: 20px;

      color: #c5a574;
      font-size: 13px;
      text-decoration: none;
    }

    .back:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 32px 22px;
      }

      h1 {
        font-size: 24px;
      }
    }
  
:root{--gold:#b99c61;--light-gold:#dec68f;--dark-gold:#80683f;--text:#d5c19a}
body{background:radial-gradient(ellipse at center,#302518,#14100b 70%,#110e09);color:var(--text);font-family:'Nanum Myeongjo',serif;text-shadow:none}
body::before{display:none}
.vault-background{position:fixed;left:50%;top:50%;width:max(100vw,100vh);height:max(100vw,100vh);transform:translate(-50%,-50%);color:#aa8b55;opacity:.22;pointer-events:none;z-index:0}
.login-card,.record{position:relative;background:#1c170f;border:1px solid #b99c61;border-radius:5px;box-shadow:0 16px 48px #0005;isolation:isolate}
.login-card::before,.record::before{content:'';position:absolute;inset:8px;border:1px solid #776039;border-radius:3px;pointer-events:none}
.corner{position:absolute;width:29px;height:29px;color:#b99c61;pointer-events:none}
.tl{top:16px;left:16px}.tr{top:16px;right:16px;transform:rotate(90deg)}.br{bottom:16px;right:16px;transform:rotate(180deg)}.bl{bottom:16px;left:16px;transform:rotate(270deg)}
.crest{display:block;width:88px;height:88px;margin:0 auto;color:#b99c61}
h1{font-size:26px;line-height:1.35;margin:20px 0 8px;color:#dec68f;text-shadow:none}
.subtitle,.heading p{font-size:11px;letter-spacing:3px;color:#ad9260;margin:0}
.ornament{display:flex;align-items:center;gap:12px;color:#b49a64;margin:24px 0}
.ornament::before,.ornament::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,#80683f)}
.ornament::after{transform:rotate(180deg)}
.mini-icon{width:19px;height:19px;flex:none;vertical-align:middle;color:inherit}
.field input,.field textarea{background:#120f0a;color:#e2cda6;border:1px solid #79613b;border-radius:4px;font:inherit;font-size:15px}
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 1000px #120f0a inset;-webkit-text-fill-color:#e2cda6;caret-color:#e2cda6}
#loginButton,.save-button{background:linear-gradient(155deg,#c9b17c,#967a46 55%,#bda36e);border:1px solid #b99c61;border-radius:3px;color:#241a0e;font-family:'Nanum Myeongjo',serif;font-size:16px;font-weight:400;letter-spacing:3px;text-shadow:none;box-shadow:none}
.footer-mark{margin:16px 0 0;color:#9a845d;font-size:9px;letter-spacing:2px;text-align:center}
.back{color:#b49a64}
@media(prefers-reduced-motion:reduce){.container{animation:none}}

body{padding:24px 12px}.login-card{width:min(100%,420px);padding:38px 34px;z-index:1}.symbol{margin:0}.login-card h1{font-size:26px;margin-top:20px}.input-wrap{position:relative}.input-wrap .mini-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#b49a64;pointer-events:none}.input-wrap input{padding-left:42px}.message{margin:12px 0 0;min-height:20px}.back{margin-top:12px}.subtitle{margin-bottom:0}
@media(max-width:480px){.login-card{padding:34px 25px}.login-card h1{font-size:clamp(20px,6vw,26px)}}
</style>

  <!-- Supabase 프로젝트 설정 -->
  <script src="/assets/js/supabase-config.js"></script>

  <!-- Supabase JavaScript 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <script>
    "use strict";

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    let client = null;

    function showMessage(text, success = false) {
      message.textContent = text;
      message.classList.toggle("success", success);
    }

    function setLoading(loading) {
      button.disabled = loading;
      button.textContent = loading
        ? "로그인 확인 중..."
        : "봉인 해제";
    }

    function explainError(error) {
      const text = error?.message || "알 수 없는 오류";

      console.error("Supabase 로그인 오류:", error);

      if (text.includes("Invalid login credentials")) {
        return "이메일 또는 비밀번호가 올바르지 않아.";
      }

      if (text.includes("Email not confirmed")) {
        return "이메일 인증이 완료되지 않았어.";
      }

      if (text.includes("Invalid API key")) {
        return "Supabase Publishable key를 확인해 줘.";
      }

      if (
        text.includes("Failed to fetch") ||
        text.includes("NetworkError")
      ) {
        return "Supabase 서버에 연결하지 못했어. 네트워크나 브라우저 설정을 확인해 줘.";
      }

      return "로그인 실패: " + text;
    }

    function initializeSupabase() {
      const url = window.SUPABASE_URL;
      const key = window.SUPABASE_PUBLISHABLE_KEY;

      if (!url || !key) {
        showMessage(
          "Supabase 연결 정보가 없어. supabase-config.js를 확인해 줘."
        );

        button.disabled = true;
        return false;
      }

      if (
        !window.supabase ||
        typeof window.supabase.createClient !== "function"
      ) {
        showMessage(
          "Supabase 라이브러리를 불러오지 못했어."
        );

        button.disabled = true;
        return false;
      }

      try {
        client = window.supabase.createClient(url, key);

        console.info("Supabase 클라이언트 초기화 완료");
        return true;

      } catch (error) {
        console.error("Supabase 초기화 오류:", error);

        showMessage(
          "Supabase 초기화 실패: " + error.message
        );

        button.disabled = true;
        return false;
      }
    }

    async function checkExistingSession() {
      if (!client) return;

      try {
        const { data, error } =
          await client.auth.getUser();

        if (error) {
          console.info("기존 로그인 확인:", error.message);
          return;
        }

        if (data?.user) {
          showMessage(
            "이미 로그인되어 있어. 이동 중...",
            true
          );

          window.location.replace("/profile/settings/");
        }

      } catch (error) {
        console.error("세션 확인 오류:", error);
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!client) {
        showMessage("Supabase 연결이 준비되지 않았어.");
        return;
      }

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      setLoading(true);
      showMessage("관리자 계정 확인 중...");

      try {
        const { data, error } =
          await client.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {
          throw error;
        }

        if (!data?.user) {
          throw new Error(
            "로그인 응답에 사용자 정보가 없어."
          );
        }

        console.info("Supabase 로그인 성공");

        showMessage(
          "로그인 성공! 프로필 설정으로 이동할게.",
          true
        );

        window.location.replace("/profile/settings/");

      } catch (error) {
        showMessage(explainError(error));

      } finally {
        setLoading(false);
      }
    });

    if (initializeSupabase()) {
      checkExistingSession();
    }
  </script>
