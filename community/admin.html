<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>선장 통제실</title><link rel="stylesheet" href="/community/deck.css"><script src="/assets/js/supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script defer src="/community/admin.js"></script><body><main><header><a href="/blog/admin/">관리자 홈</a><h1>선장 통제실</h1></header><p id="status" role="status"></p><section id="panel" hidden><h2>운영 설정</h2><form id="settings"><label><input type="checkbox" id="radio">무전</label> <label><input type="checkbox" id="guestbook">방명록</label> <label><input type="checkbox" id="news">NEWS COO</label><button>저장</button></form><h2>선장 공지</h2><form id="notice"><input id="title" maxlength="80" required placeholder="제목"><textarea id="content" maxlength="1000" required></textarea><button>공지 작성</button></form><div id="notices"></div><h2>방명록 및 무전 관리</h2><div id="posts"></div><div id="messages"></div><h2>방문 기록 관리</h2><input id="visitor-search" maxlength="20" placeholder="닉네임 검색"><button id="visitor-find">검색</button><button id="visitor-prev">이전</button><button id="visitor-next">다음</button><div id="visitor-list"></div><button id="visitor-delete">선택 삭제</button><button id="visitor-clear">전체 초기화</button><h2>데이터 보존 및 정리</h2><p id="cleanup-preview"></p><form id="cleanup-form"><label><input type="checkbox" id="visitor_enabled">방문 기록 자동 정리</label><label><input type="checkbox" id="community_enabled">커뮤니티 자동 정리</label><p><label>방문 기록 <input type="number" id="retention_days" min="1" max="3650" required>일</label></p><p><label>무전 <input type="number" id="radio_retention_days" min="1" max="365" required>일</label></p><p><label>방송 <input type="number" id="news_retention_days" min="1" max="30" required>일</label></p><p><label>도배 방지 <input type="number" id="rate_limit_retention_days" min="1" max="30" required>일</label></p><p><label>처리된 신고 <input type="number" id="report_retention_days" min="7" max="365" required>일</label></p><button>설정 저장</button></form><button id="cleanup-refresh">미리보기 갱신</button><button id="cleanup-execute">현재 저장된 정책으로 정리</button><p id="cleanup-result" role="status"></p><p>미처리 신고가 있는 무전은 제외됩니다. 미리보기는 비활성 정책의 대상도 포함할 수 있습니다.</p><h2>신고 관리</h2><div id="reports"></div><button id="refresh">새로고침</button></section></main></body></html>
