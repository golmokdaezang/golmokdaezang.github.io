<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>⚓ 기존 기록 관리</title>
    <link rel="stylesheet" href="/assets/css/marine-scenarios.css">
    <style>
* { box-sizing: border-box; }
body { margin: 0; background: #181611; color: #e1cda4; font: 16px/1.6 Georgia, "Malgun Gothic", serif; }
main { max-width: 1200px; margin: auto; padding: 30px 20px; }
a { color: #d5b77c; }
header, .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
header a:first-child { margin-right: auto; }
section, article { border: 1px solid #67543b; background: #241e17; padding: 20px; border-radius: 8px; margin: 16px 0; }
label { display: block; margin: 12px 0 4px; }
input, select, textarea, button { font: inherit; color: inherit; background: #31271d; border: 1px solid #786044; border-radius: 5px; padding: 9px; }
input, select, textarea { width: 100%; }
input[type=checkbox] { width: auto; }
textarea { min-height: 360px; resize: vertical; }
button { cursor: pointer; }
button:disabled { opacity: .5; cursor: wait; }
button:hover { background: #51402b; }
[hidden] { display: none !important; }
.columns { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.preview { overflow-wrap: anywhere; min-width: 0; background: #181611; padding: 15px; border: 1px solid #67543b; }
img { max-width: 100%; }
pre { overflow: auto; background: #15110d; padding: 12px; }
td, th { border: 1px solid #67543b; padding: 6px; }
table { border-collapse: collapse; }
@media(max-width: 700px) { .columns { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<main>
    <header><a href="/blog/">← 중앙 기록실</a><a id="login" href="/login/">로그인</a><button id="logout" hidden>로그아웃</button></header>
    <h1>⚓ 기존 기록 관리</h1>
    <p id="status" role="status">로그인 확인 중...</p>
    <section id="workspace" hidden>
        <div class="actions">
            <a href="/blog/write/">+ 새 기록 작성</a>
            <button id="open-marine-scenarios" type="button">⚓ 해군 통신 시나리오 관리</button>
        </div>
        <label for="search">제목 검색</label><input id="search" placeholder="검색할 제목">
        <div class="columns">
            <div><label for="book">책 분류</label><select id="book"><option value="">전체 책</option></select></div>
            <div><label for="visibility">공개 여부</label><select id="visibility"><option value="">전체 기록</option><option value="public">공개 기록</option><option value="private">봉인 기록</option></select></div>
        </div>
        <div id="records"></div>
    </section>
</main>
<script src="/assets/js/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.3.1/dist/purify.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const ADMIN_UID = '6e6288e5-3612-4d2f-8d8b-fb08007d86a9';
const client = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_PUBLISHABLE_KEY);
const status = message => $('status').textContent = message;
function check(result) {
    if (result.error) throw result.error;
    return result.data;
}
function element(tag, text) {
    const node = document.createElement(tag);
    node.textContent = text;
    return node;
}
let books = [];
let busy = false;
async function act(fn) {
    if (busy) return;
    busy = true;
    const buttons = [...document.querySelectorAll('#workspace button')];
    buttons.forEach(b => b.disabled = true);
    try { await fn(); } catch (e) { status('오류: ' + e.message); }
    finally { busy = false; buttons.forEach(b => b.disabled = false); }
}
async function init() {
    const { data } = await client.auth.getUser();
    if (data.user?.id !== ADMIN_UID) {
        status('관리자 로그인이 필요합니다.');
        return;
    }
    $('login').hidden = true;
    $('logout').hidden = false;
    books = check(await client.from('books').select('*').order('sort_order'));
    await setup();
    $('workspace').hidden = false;
    status('관리자 인증 완료');
    client.auth.onAuthStateChange((event, session) => {
        if (session?.user.id !== ADMIN_UID) location.replace('/blog/');
    });
}
$('logout').onclick = async () => {
    try { check(await client.auth.signOut()); location.href = '/blog/'; }
    catch (e) { status(e.message); }
};

let posts = [];
async function setup() {
    for (const book of books) {
        const option = element('option', book.name);
        option.value = book.slug;
        $('book').append(option);
    }
    await load();
}
async function load() {
    posts = check(await client.from('posts').select('*').order('created_at', {ascending: false}));
    render();
}
function button(label, fn) {
    const b = element('button', label);
    b.onclick = () => act(fn);
    return b;
}
function render() {
    const root = $('records');
    root.replaceChildren();
    const q = $('search').value.trim().toLowerCase();
    const book = $('book').value;
    const visibility = $('visibility').value;
    const rows = posts.filter(p => p.title.toLowerCase().includes(q) && (!book || p.book_key === book) && (!visibility || p.is_public === (visibility === 'public')));
    if (!rows.length) root.textContent = '해당 기록이 없습니다.';
    for (const p of rows) {
        const card = element('article', '');
        const name = books.find(b => b.slug === p.book_key)?.name || p.book_key;
        const actions = element('div', '');
        actions.className = 'actions';
        actions.append(
            button('수정', () => { location.href = '/blog/write/?id=' + encodeURIComponent(p.id); }),
            button(p.is_public ? '봉인' : '공개', async () => {
                if (!p.is_public) {
                    check(await client.from('post_contents').select('post_id').eq('post_id', p.id).single());
                    if (!confirm('모든 방문자에게 본문을 공개할까요?')) return;
                }
                check(await client.from('posts').update({is_public: !p.is_public, updated_at: new Date().toISOString()}).eq('id', p.id).select('id').single());
                await load(); status('공개 설정 변경 완료');
            }),
            button('삭제', async () => {
                if (!confirm('이 기록을 삭제할까요?')) return;
                check(await client.from('posts').delete().eq('id', p.id).select('id').single());
                await load(); status('삭제 완료');
            })
        );
        card.append(element('h3', p.title), element('p', name + ' · ' + (p.is_public ? '공개' : '봉인') + ' · ' + new Date(p.created_at).toLocaleDateString('ko-KR')), actions);
        root.append(card);
    }
}
$('search').oninput = render;
$('book').onchange = render;
$('visibility').onchange = render;
init().catch(e => status('오류: ' + e.message));
</script>
<script src="/assets/js/marine-scenarios.js"></script>
<script>
document.getElementById('open-marine-scenarios').onclick = async () => {
    try {
        const { data, error } = await client.auth.getUser();
        if (error) throw error;
        if (data.user?.id !== ADMIN_UID) {
            alert('관리자만 접근할 수 있습니다.');
            return;
        }
        await window.MarineScenarios.open(client);
    } catch (error) {
        alert('시나리오 관리 창 오류: ' + error.message);
        console.error(error);
    }
};
</script>
</body>
</html>
