<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>MARINE OS v2.0 | 해군 본부</title>

    <style>

        :root {

            --accent: #B64D42;
            --window-bg: #17212B;
            --window-text: #E3E8ED;
            --titlebar-bg: #652F2D;

        }

        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        body {

            margin: 0;
            background: #101820;
            color: #E3E8ED;

            font: 14px/1.6
                "Malgun Gothic",
                "Noto Sans KR",
                sans-serif;

        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button {

            cursor: pointer;
            padding: 7px 12px;
            border: 1px solid #687887;
            border-radius: 2px;
            background: #E8EDF2;
            color: #233140;

        }

        button:hover {
            filter: brightness(.92);
        }

        button:disabled {
            opacity: .5;
            cursor: default;
        }

        a {
            color: inherit;
        }

        #gate {

            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 24px;

        }

        .gate-box {

            width: min(650px, 100%);
            background: #0C131B;
            border: 1px solid #435466;
            padding: 35px;

        }

        #gateLogo {

            width: 180px;
            margin: 0 auto 20px;

        }

        #gateLogo svg {
            width: 100%;
            height: auto;
        }

        .brand {

            text-align: center;
            font-size: 29px;
            letter-spacing: 5px;
            font-weight: bold;

        }

        .subtitle {

            text-align: center;
            color: #A5B5C5;
            font-size: 13px;

        }

        .gate-divider {

            border: 0;
            border-top: 1px solid #344657;
            margin: 25px 0;

        }

        #code {

            display: block;
            width: 100%;
            margin: 9px 0 15px;
            padding: 12px;
            background: #19232E;
            color: white;
            border: 1px solid #657687;

        }

        #status {

            margin-top: 15px;
            color: #E1B2A7;

        }

        #logs {

            margin-top: 20px;

            font: 13px/1.9
                D2Coding,
                Consolas,
                monospace;

        }

        .boot-line {

            display: flex;
            justify-content: space-between;
            gap: 12px;

        }

        .done {
            color: #95C8A6;
        }

        #identity {

            display: flex;
            gap: 18px;
            align-items: center;
            border: 1px solid var(--accent);
            margin-top: 20px;
            padding: 15px;

        }

        #profileAvatar {

            width: 80px;
            height: 100px;
            object-fit: cover;

        }

        #desktop {

            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;

        }

        #systemHeader {

            display: flex;
            align-items: center;
            gap: 14px;
            min-height: 62px;
            padding: 10px 18px;
            background: var(--titlebar-bg);
            color: white;
            border-bottom: 2px solid var(--accent);

        }

        #systemLogo {

            width: 65px;
            flex-shrink: 0;

        }

        #systemLogo svg {
            width: 100%;
        }

        .system-title {

            font-size: 17px;
            font-weight: bold;
            letter-spacing: 2px;

        }

        .small {
            font-size: 12px;
            opacity: .8;
        }

        .spacer {
            flex: 1;
        }

        #systemIdentity {
            text-align: right;
        }

        #work {

            position: relative;
            flex: 1;
            min-height: 0;
            overflow: hidden;

        }

        #taskbar {

            display: flex;
            gap: 8px;
            align-items: center;
            min-height: 46px;
            padding: 6px 10px;
            background: #19232D;
            color: white;
            border-top: 2px solid var(--accent);

        }

        #taskbar button {

            background: #304252;
            border-color: #617487;
            color: white;
            white-space: nowrap;

        }

        #tasks {

            display: flex;
            flex: 1;
            gap: 5px;
            overflow-x: auto;

        }

        #unreadBadge {

            display: inline-block;
            background: #A8443F;
            color: white;
            min-width: 20px;
            padding: 0 5px;
            margin-left: 4px;
            text-align: center;
            font-size: 11px;

        }

        .record-card {

            padding: 15px;
            margin: 12px 0;
            border: 1px solid #79889755;

        }

        .record-content {

            margin-top: 16px;
            overflow-wrap: anywhere;

        }

        .record-content img {
            max-width: 100%;
        }

        .record-content pre {

            overflow: auto;
            padding: 12px;
            background: #111820;
            color: #E4EAF0;

        }

        .record-content table {
            border-collapse: collapse;
        }

        .record-content td,
        .record-content th {

            padding: 7px;
            border: 1px solid #778899;

        }

        .record-tools {

            display: flex;
            flex-wrap: wrap;
            gap: 10px;

        }

        .record-tools input,
        .record-tools select {

            padding: 8px;
            max-width: 100%;

        }

        @media (max-width: 650px) {

            .gate-box {
                padding: 20px;
            }

            #systemHeader {

                gap: 8px;
                padding: 8px;

            }

            #systemLogo {
                width: 42px;
            }

            .system-title {
                font-size: 14px;
            }

            #taskbar {
                flex-wrap: wrap;
            }

            #tasks {
                min-width: 90px;
            }

        }

    </style>

    <!-- =====================================
         05. 통합 시스템
         ===================================== -->

    <script>

        "use strict";


        const ADMIN_UID =
            "6e6288e5-3612-4d2f-8d8b-fb08007d86a9";

        // 세계관용 식별 코드
        // 실제 인증은 Supabase Auth에서 수행

        const ACCESS_CODE = "M-CAR-24-1004";


        const $ = id =>
            document.getElementById(id);


        let client = null;

        let authorized = false;

        let profile = null;

        let personnel = null;


        const commanderNames = {

            akainu: "아카이누",

            kizaru: "키자루",

            aokiji: "아오키지"

        };


        // =====================================
        // 06. 프로그램 등록
        // =====================================

        const apps = [

            ["write", "보고서 작성"],

            ["folder", "기록물 관리"],

            ["books", "분류 체계"],

            ["order", "문서 편철"],

            ["read", "기록 열람"],

            ["chat", "내부 메신저"],

            ["personnel", "인사 기록부"],

            ["promotion", "진급 관리"],

            ["calendar", "업무 일정표"],

            ["notes", "메모장"],

            ["wanted", "수배 관리"],

            ["organization", "해군 조직도"],

            ["terminal", "명령 프롬프트"],

            ["settings", "환경 설정"]

        ];


        const frameApps = {

            write: "/blog/write/",

            folder: "/blog/admin/",

            books: "/blog/design/",

            order: "/blog/order/"

        };


        const requiredModules = [

            "MarineWindows",

            "MarinePersonnel",

            "MarineSimulation",

            "MarineReplies",

            "MarineCalendar",

            "MarineNotes",

            "MarineWanted",

            "MarineOrganization",

            "MarineChat",

            "MarineTerminal",

            "MarineDesktop",

            "MarineNotifications"

        ];


        // =====================================
        // 07. 공통 함수
        // =====================================

        function node(tag, text, cls) {

            const element =
                document.createElement(tag);

            if (text != null) {

                element.textContent = text;

            }

            if (cls) {

                element.className = cls;

            }

            return element;

        }


        function check(result) {

            if (result.error) {

                throw result.error;

            }

            return result.data;

        }


        function delay(ms) {

            return new Promise(resolve => {

                setTimeout(resolve, ms);

            });

        }


        async function authenticate() {

            if (!client) {

                throw new Error(
                    "전산망 연결 정보가 없습니다."
                );

            }


            const result =
                await client.auth.getUser();


            if (

                result.error

                || result.data.user?.id !== ADMIN_UID

            ) {

                throw new Error(
                    "관리자 계정으로 먼저 로그인하십시오."
                );

            }

            return result.data.user;

        }


        // =====================================
        // 08. 모듈 및 데이터베이스 연결 확인
        // =====================================

        function initialize() {

            const missing = requiredModules.filter(

                name => !window[name]

            );


            if (missing.length) {

                $("status").textContent =

                    "모듈 로딩 실패: "

                    + missing.join(", ");


                $("connect").disabled = true;

                return;

            }


            try {

                client = window.supabase.createClient(

                    window.SUPABASE_URL,

                    window.SUPABASE_PUBLISHABLE_KEY

                );


                window.MarineClient = client;


                // marine-desktop.js의 SVG 로고 사용

                const logo =
                    MarineDesktop.marineLogo("#A9C6DE");


                for (const id of [

                    "gateLogo",

                    "systemLogo"

                ]) {

                    if (typeof logo === "string") {

                        $(id).innerHTML = logo;

                    } else if (logo instanceof Node) {

                        $(id).append(

                            logo.cloneNode(true)

                        );

                    }

                }


                client.auth.onAuthStateChange(

                    (event, session) => {

                        if (

                            authorized

                            && session?.user?.id !== ADMIN_UID

                        ) {

                            authorized = false;

                            MarineNotifications.stop();

                            MarineSimulation.stop();

                            location.reload();

                        }

                    }

                );


            } catch (error) {

                $("status").textContent =

                    "시스템 초기화 실패: "

                    + error.message;

                $("connect").disabled = true;

            }

        }


        // =====================================
        // 09. 인사 정보 불러오기
        // =====================================

        async function loadIdentity() {

            const user = await authenticate();


            // 다른 사용자가 아닌 현재 로그인 계정 조회

            const profileResult = await client

                .from("profiles")

                .select("nickname,avatar_url")

                .eq("id", user.id)

                .maybeSingle();


            profile = profileResult.data || {};


            if (profileResult.error) {

                console.warn(profileResult.error);

            }


            personnel = check(

                await client

                    .from("marine_personnel")

                    .select("*")

                    .eq("user_id", user.id)

                    .single()

            );


            refreshIdentity();

        }


        function refreshIdentity() {

            if (!personnel) return;


            const leader =

                commanderNames[personnel.commander]

                || "아카이누";


            $("person").textContent =

                profile?.nickname || "기록관리관";


            $("personnelCode").textContent =

                personnel.personnel_code || ACCESS_CODE;


            $("personnelBranch").textContent =

                personnel.branch

                + " · "

                + personnel.department;


            $("personnelCommander").textContent =

                leader + " 대장 소속";


            $("personnelRank").textContent =

                "계급 : " + personnel.rank;


            $("departmentTop").textContent =

                personnel.branch

                + " · "

                + personnel.department;


            $("commanderTop").textContent =

                leader + " 대장 소속";


            $("rankTop").textContent =

                "계급 : " + personnel.rank;


            const avatar = $("profileAvatar");

            const avatarUrl = profile?.avatar_url;


            avatar.hidden = true;


            if (

                avatarUrl

                && /^https:\/\//i.test(avatarUrl)

            ) {

                avatar.src = avatarUrl;

                avatar.hidden = false;

                avatar.onerror = () => {

                    avatar.hidden = true;

                };

            }

        }


        // =====================================
        // 10. 전산망 부팅 로그
        // =====================================

async function bootLog(text, progress) {

    const line = node(

        "div",

        null,

        "boot-line"

    );


    const state = node(

        "span",

        "[ 처리 중 ]"

    );


    line.append(

        node("span", text + " ........"),

        state

    );


    $("logs").append(line);


    await delay(850);


    state.textContent = "[ 완료 ]";

    state.className = "done";


    MarineUI.setProgress(

        progress,

        text + " 완료"

    );

}

        // =====================================
        // 11. 전산망 접속
        // =====================================

$("access").addEventListener(

    "submit",

    async event => {

        event.preventDefault();


        if (!client || authorized) return;


        if ($("connect").disabled) return;


        if (

            $("code").value.trim().toUpperCase()

            !== ACCESS_CODE

        ) {

            $("status").textContent =

                "등록되지 않은 인사 식별 코드입니다.";

            return;

        }


        $("connect").disabled = true;

        $("connect").textContent = "인증 확인 중...";

        $("status").textContent =

            "접근 권한을 확인하고 있습니다.";


        try {

            // 실제 관리자 인증

            await authenticate();


            $("status").textContent = "";

            $("access").hidden = true;

            $("logs").replaceChildren();


            MarineUI.prepareBoot();


            MarineUI.setProgress(

                5,

                "접근 권한 인증 완료"

            );


            // 세계관용 부팅 연출

            await bootLog(

                "MARINE OS 초기화",

                18

            );


            await bootLog(

                "중앙 전산망 접속 준비",

                32

            );


            await loadIdentity();


            await bootLog(

                "해군 인사 기록 조회",

                48

            );


            await bootLog(

                "소속 지휘 체계 확인",

                62

            );


            await bootLog(

                "사용자 작업 환경 준비",

                77

            );


            await authenticate();


            await bootLog(

                "접근 권한 최종 확인",

                95

            );


            $("identity").hidden = false;


            $("logs").append(

                node(

                    "div",

                    "[ 승인 ] 전산망 접속을 허가합니다.",

                    "done"

                )

            );


            await MarineUI.finishBoot();


            authorized = true;


            await enterDesktop();


            MarineUI.welcome(

                profile,

                personnel

            );


            MarineUI.resetBoot();


        } catch (error) {

            authorized = false;


            MarineNotifications.stop();

            MarineSimulation.stop();

            MarineUI.resetBoot();


            $("desktop").hidden = true;

            $("gate").hidden = false;

            $("access").hidden = false;

            $("identity").hidden = true;

            $("logs").replaceChildren();


            $("status").textContent =

                error.message;


            console.error(error);


        } finally {

            $("connect").disabled = false;

            $("connect").textContent =

                "전산망 접속";

        }

    }

);

        // =====================================
        // 12. 바탕화면 초기화
        // =====================================

        async function enterDesktop() {

            $("gate").hidden = true;

            $("desktop").hidden = false;


            MarineWindows.init({

                desktop: $("work"),

                taskbar: $("tasks")

            });


            MarineDesktop.init({

                desktop: $("work"),

                themeRoot: document.documentElement,

                client,

                apps,

                openApp

            });


            // 실제 소속 지휘관과 테마 동기화

            if (commanderNames[personnel.commander]) {

                MarineDesktop.update({

                    leader: personnel.commander

                });

            }


            // 로그인 시 고정 메모 복원

            try {

                await MarineNotes.renderDesktop(

                    $("work"),

                    client,

                    true

                );

            } catch (error) {

                console.error(
                    "스티커 메모 복원 실패:",
                    error
                );

            }


            // 기밀 통신 알림 시작

            await MarineNotifications.start(

                client,

                { openApp }

            );


            // 단체 채팅 자동 시뮬레이션

            MarineSimulation.start(client);


            // 알림을 통해 접속했다면
            // 인증 완료 후 메신저 실행

            const requested =

                new URLSearchParams(

                    location.search

                ).get("app");


            if (requested === "chat") {

                openApp("chat");

                history.replaceState(

                    null,

                    "",

                    location.pathname

                );

            }

        }


        // =====================================
        // 13. 업무 프로그램 실행
        // =====================================

        function openApp(id) {

            if (!authorized) return;


            const app = apps.find(

                item => item[0] === id

            );


            if (!app) return;


            const config = {

                id,

                title: app[1],

                width: 900,

                height: 640

            };


            // 기존 업무 페이지 연결

            if (frameApps[id]) {

                config.url = frameApps[id];

                return MarineWindows.open(config);

            }


            // 내부 프로그램 연결

            config.mount = async (root, win) => {

                switch (id) {

                    case "read":

                        await records(root);

                        break;


                    case "chat":

                        await MarineChat.mount(

                            root,

                            client

                        );

                        break;


                    case "personnel":

                        await MarinePersonnel.mount(

                            root,

                            client

                        );

                        break;


                    case "promotion":

                        await MarinePersonnel.promotion(

                            root,

                            client

                        );

                        break;


                    case "calendar":

                        await MarineCalendar.mount(

                            root,

                            client

                        );

                        break;


                    case "notes":

                        await MarineNotes.mount(

                            root,

                            client

                        );

                        break;


                    case "wanted":

                        root.append(

                            node(

                                "div",

                                "수배관리국 · 담당관 브랑뉴 대령",

                                "small"

                            )

                        );

                        const wantedRoot = node("div");

                        root.append(wantedRoot);


                        const wanted =

                            await MarineWanted.mount(

                                wantedRoot,

                                client

                            );


                        if (wanted?.setProfile) {

                            wanted.setProfile(profile);

                        }

                        break;


                    case "organization":

                        await MarineOrganization.mount(

                            root,

                            client

                        );

                        break;


                    case "terminal":

                        await MarineTerminal.mount(

                            root,

                            client,

                            {

                                openApp,

                                close: () =>

                                    MarineWindows.close(id)

                            }

                        );

                        break;


                    case "settings":

                        await MarineDesktop.mountSettings(

                            root

                        );

                        break;

                }

            };


            if (id === "notes") {

                config.beforeClose = async () => {

                    await MarineNotes.flush(client);

                };

            }


            return MarineWindows.open(config);

        }


        // =====================================
        // 14. 기존 기록물 열람 기능
        // =====================================

        async function records(root) {

            await authenticate();


            root.replaceChildren(

                node("h2", "중앙 기록국 기록물 열람"),

                node("p", "기록 조회 중...")

            );


            try {

                const books = check(

                    await client

                        .from("books")

                        .select("slug,name")

                        .order("sort_order")

                );


                const posts = check(

                    await client

                        .from("posts")

                        .select(

                            "id,title,book_key,is_public,created_at,sort_order,island_key"

                        )

                        .order(

                            "created_at",

                            { ascending: false }

                        )

                );


                root.replaceChildren(

                    node("h2", "중앙 기록국 기록물 열람")

                );


                const tools = node(

                    "div",

                    null,

                    "record-tools"

                );


                const select = node("select");

                const all = node("option", "전체 기록");

                all.value = "";

                select.append(all);


                for (const book of books) {

                    const option = node(

                        "option",

                        book.name

                    );

                    option.value = book.slug;

                    select.append(option);

                }


                const search = node("input");

                search.type = "search";

                search.placeholder = "기록물 제목 검색";


                tools.append(select, search);


                const list = node("div");


                root.append(tools, list);


                function render() {

                    list.replaceChildren();


                    const keyword =

                        search.value.toLowerCase().trim();


                    const rows = posts.filter(post => {

                        return (

                            !select.value

                            || post.book_key === select.value

                        ) && (

                            !keyword

                            || post.title.toLowerCase()

                                .includes(keyword)

                        );

                    });


                    if (select.value) {

                        rows.sort((a, b) =>

                            (a.sort_order || Infinity)

                            -

                            (b.sort_order || Infinity)

                            ||

                            a.created_at.localeCompare(

                                b.created_at

                            )

                        );

                    }


                    for (const post of rows) {

                        const card = node(

                            "article",

                            null,

                            "record-card"

                        );


                        const bookName =

                            books.find(

                                book =>

                                    book.slug === post.book_key

                            )?.name || (post.island_key ? "지도 · " + post.island_key : "");


                        const classification =

                            post.is_public

                            ? "열람 허가"

                            : "기밀 문서";


                        const button = node(

                            "button",

                            "기록 열람"

                        );


                        const content = node(

                            "div",

                            null,

                            "record-content"

                        );


                        content.hidden = true;


                        card.append(

                            node(

                                "small",

                                bookName

                                + " · "

                                + classification

                            ),

                            node("h3", post.title),

                            button,

                            content

                        );


                        button.onclick = async () => {

                            content.hidden =

                                !content.hidden;


                            if (content.hidden) {

                                button.textContent =

                                    "기록 열람";

                                return;

                            }


                            button.textContent =

                                "기록 닫기";


                            content.textContent =

                                "조회 중...";


                            try {

                                await authenticate();


                                const result = check(

                                    await client

                                        .from("post_contents")

                                        .select("content")

                                        .eq("post_id", post.id)

                                        .maybeSingle()

                                );


                                if (!result) {

                                    content.textContent =

                                        "열람할 수 없습니다.";

                                    return;

                                }


                                if (

                                    window.marked

                                    && window.DOMPurify

                                ) {

                                    content.innerHTML =

                                        DOMPurify.sanitize(

                                            marked.parse(

                                                result.content || ""

                                            ),

                                            {

                                                USE_PROFILES: {

                                                    html: true

                                                }

                                            }

                                        );

                                } else {

                                    content.textContent =

                                        result.content;

                                }


                            } catch (error) {

                                content.textContent =

                                    "조회 실패: "

                                    + error.message;

                            }

                        };


                        list.append(card);

                    }


                    if (!rows.length) {

                        list.textContent =

                            "해당하는 기록물이 없습니다.";

                    }

                }


                select.onchange = render;

                search.oninput = render;

                render();


            } catch (error) {

                root.replaceChildren(

                    node(

                        "p",

                        "기록물 조회 실패: " + error.message

                    )

                );

            }

        }


        // =====================================
        // 15. 바탕화면 이벤트 연결
        // =====================================

        window.addEventListener(

            "marine:notes-changed",

            async () => {

                if (!authorized) return;


                try {

                    await MarineNotes.renderDesktop(

                        $("work"),

                        client

                    );

                } catch (error) {

                    console.error(error);

                }

            }

        );


        window.addEventListener(

            "marine:theme-changed",

            async () => {

                if (!authorized) return;


                try {

                    await loadIdentity();

                } catch (error) {

                    console.error(error);

                }

            }

        );


        window.addEventListener(

            "marine:unread-changed",

            event => {

                const count = authorized

                    ? Number(event.detail.count) || 0

                    : 0;


                $("unreadBadge").hidden = count === 0;


                $("unreadBadge").textContent =

                    count > 99

                    ? "99+"

                    : String(count);

            }

        );


        // =====================================
        // 16. 작업 표시줄
        // =====================================

        $("home").onclick = () => {

            if (!authorized) return;


            for (const [id] of apps) {

                if (MarineWindows.get(id)) {

                    MarineWindows.minimize(id);

                }

            }

        };


        $("messageButton").onclick = () => {

            openApp("chat");

        };


        $("cabinButton").onclick = async () => {

            if (!authorized) return;


            const accepted =

                await MarineWindows.confirm(

                    "저장하지 않은 작업이 있을 수 있습니다. 선실로 이동하시겠습니까?"

                );


            if (!accepted) return;


            await MarineNotes.flush(client);

            location.href = "/cabin/";

        };


        $("exit").onclick = async () => {

            if (!authorized) return;


            const accepted =

                await MarineWindows.confirm(

                    "저장하지 않은 업무를 확인하십시오. 전산망 접속을 종료하시겠습니까?"

                );


            if (!accepted) return;


            try {

                await MarineNotes.flush(client);


                MarineNotifications.stop();

                MarineSimulation.stop();


                check(

                    await window.marineSignOut(client)

                );


                location.reload();


            } catch (error) {

                console.error(error);

                $("exit").title = error.message;

                alert("업무 종료 실패: " + error.message);

            }

        };


        // =====================================
        // 17. 시스템 시계
        // =====================================

        function tick() {

            $("clock").textContent =

                new Date().toLocaleTimeString(

                    "ko-KR",

                    {

                        hour: "2-digit",

                        minute: "2-digit",

                        hour12: false

                    }

                );

        }


        tick();

        setInterval(tick, 1000);


        // =====================================
        // 18. 시스템 실행
        // =====================================

        initialize();


    </script>

</script>
