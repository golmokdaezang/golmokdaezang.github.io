function focus(w){w.style.zIndex=++z}function openApp(a){if(!authorized)return;if(windows.has(a[0])){const w=windows.get(a[0]);w.hidden=false;focus(w);return}const work=$('work'),w=el('section',undefined,'win'),bar=el('div',undefined,'titlebar'),body=el('div',undefined,'body'),task=el('button',a[1]);w.style.width=Math.min(850,work.clientWidth)+'px';w.style.height=Math.min(620,work.clientHeight)+'px';w.style.left=Math.max(0,Math.min(120+windows.size*20,work.clientWidth-parseInt(w.style.width)))+'px';w.style.top=Math.max(0,Math.min(24+windows.size*15,work.clientHeight-parseInt(w.style.height)))+'px';bar.append(el('strong',a[1]),el('span',undefined,'spacer'));const bMin=el('button','−'),bMax=el('button','□'),bClose=el('button','×');for(const [b,label] of [[bMin,'최소화'],[bMax,'최대화 또는 복원'],[bClose,'닫기']])b.setAttribute('aria-label',label);bar.append(bMin,bMax,bClose);w.append(bar,body);work.append(w);$('tasks').append(task);windows.set(a[0],w);focus(w);w.addEventListener('pointerdown',()=>focus(w));task.onclick=()=>{w.hidden=!w.hidden;if(!w.hidden)focus(w)};bMin.onclick=()=>w.hidden=true;bClose.onclick=()=>{if(a[2]&&!confirm('저장하지 않은 작업이 있을 수 있습니다. 창을 닫을까요?'))return;w.remove();task.remove();windows.delete(a[0])};let restore=null;bMax.onclick=()=>{if(restore){Object.assign(w.style,restore);restore=null}else{restore={left:w.style.left,top:w.style.top,width:w.style.width,height:w.style.height};Object.assign(w.style,{left:'0px',top:'0px',width:work.clientWidth+'px',height:work.clientHeight+'px'})}};let drag;bar.onpointerdown=e=>{if(e.target.closest('button')||restore)return;drag={x:e.clientX,y:e.clientY,l:w.offsetLeft,t:w.offsetTop};bar.setPointerCapture(e.pointerId)};bar.onpointermove=e=>{if(!drag)return;w.style.left=Math.max(0,Math.min(work.clientWidth-w.offsetWidth,drag.l+e.clientX-drag.x))+'px';w.style.top=Math.max(0,Math.min(work.clientHeight-w.offsetHeight,drag.t+e.clientY-drag.y))+'px'};bar.onpointerup=bar.onpointercancel=()=>drag=null;if(a[2]){body.classList.add('fram
