<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>선장의 중앙 기록실</title><style>
* { box-sizing: border-box; }
body { margin: 0; background: #181611; color: #e1cda4; font: 16px/1.6 Georgia, "Malgun Gothic", serif; }
main { max-width: 1200px; margin: auto; padding: 30px 20px; }
a { color: #d5b77c; }
header, .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
header a:first-child { margin-right: auto; }
section, article { border: 1px solid #67543b; background: #241e17; padding: 20px; border-radius: 8px; margin: 16px 0; }
label { display: block; margin: 12px 0 4px; }
input, select, textarea, button { font: inherit; color: inherit; background: #31271d; border: 1px solid #786044; border-radius: 5px; padding: 9px; }
input, select, textarea { width: 100%; }
input[type=checkbox] { width: auto; }
textarea { min-height: 360px; resize: vertical; }
button { cursor: pointer; }
button:disabled { opacity: .5; cursor: wait; }
button:hover { background: #51402b; }
[hidden] { display: none !important; }
.columns { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.preview { overflow-wrap: anywhere; min-width: 0; background: #181611; padding: 15px; border: 1px solid #67543b; }
img { max-width: 100%; }
pre { overflow: auto; background: #15110d; padding: 12px; }
td, th { border: 1px solid #67543b; padding: 6px; }
table { border-collapse: collapse; }
@media(max-width: 700px) { .columns { grid-template-columns: 1fr; } }

.container { display: grid; grid-template-columns: 230px minmax(0,1fr); gap: 40px; margin: 30px auto; }
aside { border-right: 1px solid #67543b; padding-right: 20px; align-self: start; position: sticky; top: 20px; }
aside button { display: flex; gap: 10px; align-items: center; width: 100%; margin: 8px 0; background: transparent; text-align: left; }
aside button.active { background: #51402b; }
.symbol { display: inline-grid; place-items: center; width: 30px; height: 36px; border: 1px solid #a48958; border-radius: 3px; overflow: hidden; }
.menus { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0; background: transparent; border: 0; }
.menus a, .menus button { text-decoration: none; text-align: center; padding: 24px 10px; border: 1px solid #75603e; background: #30251a; border-radius: 6px; color: inherit; }
.menus h2 { font-size: 20px; font-weight: normal; }
.preview { margin-top: 15px; }
@media(max-width:700px) { .container { grid-template-columns: 1fr; gap: 15px; } aside { position: static; border-right: 0; } }
</style></head>
<body><main>
<header><span>⚓ CAPTAIN'S ARCHIVE</span><a id="login" href="/login/">로그인</a><button id="logout" hidden>로그아웃</button></header>
<div class="container"><aside><h3>기록 보관소</h3><button id="allBooks">전체 기록</button><div id="bookList"></div><a href="/bookshelf/">← 책장으로 돌아가기</a></aside>
<div><h1>선장의 중앙 기록실</h1><p>여섯 권의 책에 담긴 항해 기록</p>
<section id="adminMenus" class="menus" hidden>
<a href="/blog/write/">✒<h2>새 기록 작성</h2>게시글 작성 및 공개</a>
<a href="/blog/admin/">▤<h2>기존 기록 관리</h2>게시글 수정 및 삭제</a>
<a href="/blog/design/">❖<h2>책 디자인 관리</h2>책 이름, 색상, 장식 수정</a>
<button id="orderMenu">☷<h2>목차 관리</h2>게시글 순서 변경</button>
</section><h2 id="recordTitle">전체 항해 기록</h2><div id="postList">기록을 불러오는 중...</div></div></div>
</main>
<script src="/assets/js/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.3.1/dist/purify.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const ADMIN_UID = '6e6288e5-3612-4d2f-8d8b-fb08007d86a9';
const client = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_PUBLISHABLE_KEY);
let books = [], posts = [], selected = null, isAdmin = false;
function el(tag, text) { const n = document.createElement(tag); n.textContent = text; return n; }
function check(r) { if (r.error) throw r.error; return r.data; }
function render() {
    $('bookList').replaceChildren();
    $('allBooks').classList.toggle('active', !selected);
    for (const b of books) {
        const btn = el('button', '');
        const symbol = el('span', b.symbol);
        symbol.className = 'symbol'; symbol.style.backgroundColor = b.color; symbol.style.color = b.text_color;
        btn.append(symbol, el('span', b.name)); btn.classList.toggle('active', selected === b.slug);
        btn.onclick = () => { selected = b.slug; render(); }; $('bookList').append(btn);
    }
    $('recordTitle').textContent = selected ? (books.find(b => b.slug === selected)?.name || selected) + ' · 항해 기록' : '전체 항해 기록';
    const root = $('postList'); root.replaceChildren();
    const rows = posts.filter(p => !selected || p.book_key === selected);
    if (selected) rows.sort((a, b) => (a.sort_order || Infinity) - (b.sort_order || Infinity) || a.created_at.localeCompare(b.created_at) || a.id.localeCompare(b.id));
    if (!rows.length) root.textContent = '아직 등록된 기록이 없습니다.';
    for (const p of rows) {
        const card = el('article', '');
        const meta = el('small', (books.find(b => b.slug === p.book_key)?.name || p.book_key) + ' · ' + (p.is_public ? '🔓 공개' : '🔒 봉인'));
        const read = el('button', '기록 열기'); const body = el('div', ''); body.hidden = true; body.className = 'preview';
        read.onclick = async () => {
            if (!body.hidden) { body.hidden = true; body.replaceChildren(); return; }
            body.hidden = false;
            if (!p.is_public && !isAdmin) { body.textContent = '🔒 봉인된 기록입니다.'; return; }
            body.textContent = '불러오는 중...';
            try {
                const row = check(await client.from('post_contents').select('content').eq('post_id', p.id).maybeSingle());
                if (!row) { body.textContent = '열람할 수 없는 기록입니다.'; return; }
                if (body.hidden) return;
                if (window.marked && window.DOMPurify) body.innerHTML = DOMPurify.sanitize(marked.parse(row.content), {USE_PROFILES: {html: true}});
                else body.textContent = row.content;
            } catch (e) { body.textContent = '기록을 불러오지 못했습니다.'; }
        };
        card.append(meta, el('h3', p.title), el('p', new Date(p.created_at).toLocaleDateString('ko-KR')), read, body); root.append(card);
    }
}
$('allBooks').onclick = () => { selected = null; render(); };
$('orderMenu').onclick = () => location.href = '/blog/order/';
$('logout').onclick = async () => { try { check(await client.auth.signOut()); location.reload(); } catch(e) { alert(e.message); } };
async function init() {
    const {data} = await client.auth.getUser(); isAdmin = data.user?.id === ADMIN_UID;
    $('adminMenus').hidden = !isAdmin; $('login').hidden = !!data.user; $('logout').hidden = !data.user;
    books = check(await client.from('books').select('*').order('sort_order'));
    posts = check(await client.from('posts').select('id,title,book_key,is_public,created_at,sort_order').order('created_at',{ascending:false}).order('id'));
    render();
    client.auth.onAuthStateChange((event, session) => { if (isAdmin && session?.user.id !== ADMIN_UID) location.reload(); });
}
init().catch(e => $('postList').textContent = '기록실 연결 오류: ' + e.message);
</script>
</body></html>
