<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>⚓ 새 기록 작성</title>
    <link rel="stylesheet" href="/assets/css/marine-admin.css?v=1">
<script defer src="/assets/js/marine-admin-theme.js?v=1"></script>
<link rel="stylesheet" href="/assets/css/report-files.css">
<style>
#editor .report-expanded{grid-template-columns:minmax(0,1fr)}
#editor .report-expanded #content,#editor .report-expanded #preview{min-height:max(75vh, calc((100% - 2px) * 1.414));box-sizing:border-box}
#editor .report-expanded #content,#editor .report-expanded #preview{min-height:var(--report-page-height, 75vh)}
#editor .report-expanded > [hidden]{display:none!important}
#report-view-controls{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
</style>
</head>
<body class="marine-admin" data-app="write">
<main>
    <header style="justify-content:flex-end"><a id="back-records" href="/blog/admin/" style="margin-right:auto" hidden>← 목록으로 돌아가기</a><a id="login" href="/login/">로그인</a><button id="logout" hidden>로그아웃</button></header>
    <span class="app-kicker">EDITOR · 01</span><h1>보고서 작성</h1><p class="app-subtitle">새 기록 작성</p>
    <p id="status" role="status">로그인 확인 중...</p>
    <section id="workspace" hidden>
        <form id="editor">
            <label for="book">책 선택</label><select id="book" required></select>
            <label for="island">지도 분류 (선택)</label><select id="island"><option value="">지도에 표시하지 않음</option><option value="web">웹해킹</option><option value="ad">A&D</option><option value="pwn">시스템 해킹</option><option value="forensics">디지털 포렌식</option><option value="reversing">리버싱</option><option value="embedded">임베디드</option><option value="crypto">암호학</option><option value="misc">Misc</option><option value="network">네트워크</option><option value="iot">IoT</option><option value="ctf">CTF</option></select>
            <label for="island-summary">지도 목록 요약</label><input id="island-summary" maxlength="300">
            <label for="island-tag">지도 태그</label><input id="island-tag" maxlength="100">
            <label for="title">제목</label><input id="title" required maxlength="300">
            <label>본문 작성 (Markdown)</label>
            <div class="actions" id="toolbar"></div>
            <div class="columns" id="report-editor-columns">
                <div><label for="content">작성</label><textarea id="content"></textarea></div>
                <div><label>실시간 미리보기</label><div class="preview" id="preview"></div></div>
            </div>
            <div id="report-view-controls"><button type="button" id="report-expand" aria-expanded="false">⛶ 크게 보기</button><button type="button" id="report-write-tab" hidden>작성</button><button type="button" id="report-preview-tab" hidden>실시간 미리보기</button></div>
            <label>첨부파일</label><input id="report-files" type="file" multiple hidden style="display:none"><button type="button" id="report-drop">파일을 끌어다 놓거나 선택하세요 · 최대 20MB/파일</button><div id="report-list"></div>
            <label><input type="checkbox" id="published"> 공개 (체크하지 않으면 봉인)</label>
            <button type="submit">기록 저장</button>
            <a href="/blog/admin/">기존 기록 관리</a>
        </form>
    </section>
</main>
<script src="/assets/js/supabase-config.js?v=11"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.3.1/dist/purify.min.js"></script>
<script src="/assets/js/report-files.js"></script>
<script>
const $ = id => document.getElementById(id);
const ADMIN_UID = '6e6288e5-3612-4d2f-8d8b-fb08007d86a9';
const client = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_PUBLISHABLE_KEY);
const status = message => $('status').textContent = message;
function check(result) {
    if (result.error) throw result.error;
    return result.data;
}
function element(tag, text) {
    const node = document.createElement(tag);
    node.textContent = text;
    return node;
}
let books = [];
let busy = false;
async function act(fn) {
    if (busy) return;
    busy = true;
    const buttons = [...document.querySelectorAll('#workspace button')];
    buttons.forEach(b => b.disabled = true);
    try { await fn(); } catch (e) { status('오류: ' + e.message); }
    finally { busy = false; buttons.forEach(b => b.disabled = false); }
}
async function init() {
    const { data } = await client.auth.getUser();
    if (data.user?.id !== ADMIN_UID) {
        status('관리자 로그인이 필요합니다.');
        return;
    }
    $('login').hidden = true;
    $('logout').hidden = false;
    books = check(await client.from('books').select('*').order('sort_order'));
    await setup();
    $('workspace').hidden = false;
    status('관리자 인증 완료');
    client.auth.onAuthStateChange((event, session) => {
        if (session?.user.id !== ADMIN_UID) location.replace('/blog/');
    });
}
$('logout').onclick = async () => {
    try { check(await window.marineSignOut(client)); location.href = '/blog/'; }
    catch (e) { status(e.message); }
};

let editing = new URLSearchParams(location.search).get('id');
$('back-records').hidden = !editing;
function preview() {
    const root = $('preview');
    if (!window.marked || !window.DOMPurify) { root.textContent = $('content').value; return; }
    root.innerHTML = DOMPurify.sanitize(marked.parse($('content').value), {USE_PROFILES: {html: true}});
    files.preview(root);
}
const files = ReportFiles.editor(client,$('content'),preview,()=>editing,status);
$('content').addEventListener('input', preview);
const tools = [
    ['제목', '# 제목'], ['굵게', '**내용**'], ['기울임', '*내용*'],
    ['목록', '- 항목'], ['코드', '```python\n코드\n```'],
    ['표', '| 항목 | 내용 |\n| --- | --- |\n| 값 | 값 |'],
    ['이미지 URL', '![설명](https://example.com/image.png)'], ['링크', '[링크](https://example.com)']
];
for (const [label, snippet] of tools) {
    const b = element('button', label);
    b.type = 'button';
    b.onclick = () => {
        const t = $('content');
        t.setRangeText(snippet, t.selectionStart, t.selectionEnd, 'end');
        t.focus(); preview();
    };
    $('toolbar').append(b);
}
async function setup() {
    for (const book of books) {
        const option = element('option', book.name);
        option.value = book.slug;
        $('book').append(option);
    }
    if (editing) {
        const post = check(await client.from('posts').select('*').eq('id', editing).single());
        const body = check(await client.from('post_contents').select('content').eq('post_id', editing).maybeSingle());
        $('title').value = post.title;
        $('island').value = post.island_key || '';
        $('island-summary').value = post.island_summary || '';
        $('island-tag').value = post.island_tag || '';
        $('book').value = post.book_key;
        $('content').value = body?.content ?? '';
        $('published').checked = post.is_public;
        await files.load(editing);
        document.querySelector('h1').textContent = '기록 수정';
    }
    preview();
}
$('editor').onsubmit = e => {
    e.preventDefault();
    act(async () => {
        const title = $('title').value.trim();
        if (!title) throw new Error('제목을 입력하세요.');
        const publish = $('published').checked;
        if (publish && !confirm('본문을 모든 방문자에게 공개할까요?')) return;
        const data = {title, island_key: $('island').value || null, island_summary: $('island-summary').value.trim(), island_tag: $('island-tag').value.trim(), book_key: $('book').value, is_public: false, updated_at: new Date().toISOString()};
        const content = $('content').value;
        files.lock(true);
        try {
        if (editing) {
            check(await client.from('posts').update(data).eq('id', editing).select('id').single());
        } else {
            const row = check(await client.from('posts').insert(data).select('id').single());
            editing = row.id;
            history.replaceState(null, '', '?id=' + encodeURIComponent(editing));
        }
        await files.save(editing);
        check(await client.from('post_contents').upsert({post_id: editing, content}));
        await files.cleanup(editing);
        if (publish) check(await client.from('posts').update({is_public: true}).eq('id', editing).select('id').single());
        location.href = '/blog/admin/';
        } finally { files.lock(false); }
    });
};
init().catch(e => status('오류: ' + e.message));
</script>
<script>
(() => {
 const grid=document.getElementById('report-editor-columns'), [write,preview]=grid.children;
 const toggle=document.getElementById('report-expand'), wt=document.getElementById('report-write-tab'), pt=document.getElementById('report-preview-tab');
 let expanded=false, mode='write';
 function layout(){ if(expanded) grid.style.setProperty('--report-page-height', Math.round(grid.clientWidth*297/210)+'px'); }
 function render(){grid.classList.toggle('report-expanded',expanded);write.hidden=expanded&&mode==='preview';preview.hidden=expanded&&mode==='write';wt.hidden=pt.hidden=!expanded;wt.setAttribute('aria-pressed',String(mode==='write'));pt.setAttribute('aria-pressed',String(mode==='preview'));toggle.textContent=expanded?'원래 크기로 돌아가기':'⛶ 크게 보기';toggle.setAttribute('aria-expanded',String(expanded));layout();}
 toggle.addEventListener('click',()=>{expanded=!expanded;mode='write';render();if(expanded) grid.scrollIntoView({block:'start'});});
 wt.addEventListener('click',()=>{mode='write';render();grid.scrollIntoView({block:'start'});});
 pt.addEventListener('click',()=>{mode='preview';render();grid.scrollIntoView({block:'start'});});
 if(window.ResizeObserver) new ResizeObserver(layout).observe(grid); else window.addEventListener('resize',layout);
})();
</script>
</body>
</html>
