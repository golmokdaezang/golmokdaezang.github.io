<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ page.title | escape }} | 선장의 항해 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#49331d 0,#1b130d 45%,#100c09 100%);color:#e9d4ae;font-family:'Gowun Batang',serif}a{color:#e6c58d}a:hover{color:#fff0c7}.wrap{width:min(1050px,92vw);margin:auto;padding:35px 0 90px}.nav{display:flex;gap:22px;flex-wrap:wrap;font-size:13px}.nav a{text-decoration:none}.heading{margin:75px 0 30px;text-align:center}.heading h1{font-size:clamp(30px,5vw,50px);font-weight:400;letter-spacing:.12em;margin:10px 0}.heading p{color:#c4a77e}.ornament{color:#b78b4c;letter-spacing:.4em}.books{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.bookcard,.postcard{display:block;text-decoration:none;color:inherit;border:1px solid #8d6a40aa;border-radius:4px;padding:24px;background:linear-gradient(145deg,#34251a,#21170f);transition:transform .2s,border-color .2s}.bookcard:hover,.postcard:hover{transform:translateY(-4px);border-color:#e2bd78}.bookcard .symbol{font-size:34px}.bookcard h2{font-size:23px;font-weight:400}.bookcard p,.postcard p{font-size:14px;color:#c4ad88;line-height:1.7}.posts{display:grid;gap:14px;max-width:800px;margin:0 auto}.postcard h2{font-size:20px;font-weight:400;margin:0 0 10px}.meta{font-size:12px;color:#bca17a}.empty{text-align:center;padding:40px 20px;border:1px dashed #92754d;color:#c4ad88}.footer{text-align:center;margin-top:70px;font-size:12px;color:#9e825d}
</style></head><body><div class="wrap"><nav class="nav" aria-label="페이지 이동"><a href="{{ '/cabin/' | relative_url }}">⚓ 선장실</a><a href="{{ '/bookshelf/' | relative_url }}">책장</a><a href="{{ '/blog/' | relative_url }}">전체 항해 기록</a></nav>
{{ content }}<footer class="footer">✦ 선장의 항해 기록 ✦</footer></div></body></html>
