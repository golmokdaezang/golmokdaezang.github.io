    :root { color-scheme: dark; font-family: Georgia, 'Noto Serif KR', serif; }

    * { box-sizing: border-box; }

    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#100e0b; }

    button { font:inherit; }

    .scene { position:fixed; inset:0; overflow:hidden; isolation:isolate; }

    .stage { position:absolute; width:1600px; height:960px; left:50%; top:50%; transform-origin:center; }

    .background { position:absolute; inset:0; width:100%; height:100%; object-fit:fill; pointer-events:none; user-select:none; }

    .background.night { opacity:0; transition:opacity 2.4s ease; }

    .scene.is-night .background.night { opacity:1; }

    .scene.is-night .background.day { opacity:0; }

    .background.day { opacity:1; transition:opacity 2.4s ease; }

    .book { position:absolute; border:0; background:transparent; padding:0; cursor:pointer; z-index:4; transform-origin:bottom center; transition:transform .28s ease,filter .28s ease; }

    .book img { display:block; width:100%; height:100%; object-fit:fill; filter:drop-shadow(2px 4px 4px rgba(0,0,0,.42)); pointer-events:none; }

    .book:hover { transform:translateY(-10px); filter:brightness(1.12); }

    .book.selected { transform:translateY(-26px) scale(1.035); filter:brightness(1.2) drop-shadow(0 0 12px rgba(255,205,107,.5)); z-index:6; }

    .lantern-hotspot { position:absolute; z-index:8; left:70%; top:69%; width:9%; height:24%; border:0; padding:0; background:transparent; cursor:pointer; }

    .lantern-hotspot:focus-visible, .book:focus-visible { outline:3px solid #f1d18b; outline-offset:4px; }

    .controls { position:absolute; left:50%; bottom:6%; z-index:12; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:10px; white-space:nowrap; }

    .selection-label { color:#f0dfb6; text-shadow:0 2px 9px #000; font-size:19px; letter-spacing:.08em; min-height:25px; }

    .open-button { border:1px solid rgba(248,216,145,.7); border-radius:6px; background:linear-gradient(180deg,#6a4725,#382317); box-shadow:0 4px 18px #0009, inset 0 1px #cda36d77; color:#f8e4b9; padding:14px 36px; font-size:22px; font-weight:bold; cursor:pointer; transition:filter .2s,transform .2s; }

    .open-button:hover:not(:disabled) { filter:brightness(1.2); transform:translateY(-2px); }

    .open-button:disabled { opacity:.65; cursor:default; }

    .scene { transition: filter .9s ease-in-out, opacity .9s ease-in-out; }
    .scene.book-departing { filter:blur(12px); opacity:0; pointer-events:none; }
    body { background-color:#141b25; }
    @media(prefers-reduced-motion:reduce) { .scene,.book,.background { transition:none; } }

  <!-- Jekyll은 HTML 영역에서 책 데이터를 생성합니다. JS/CSS 안에 Liquid를 넣지 않습니다. -->
  <template id="book-data-template">
    {% for book in site.data.books %}
    <span data-book
      data-name="{{ book.name | escape }}"
      data-file="{{ book.file | escape }}"
      data-x="{{ book.x }}" data-y="{{ book.y }}"
      data-w="{{ book.w }}" data-h="{{ book.h }}"
      data-color="{{ book.color | escape }}"
      data-symbol="{{ book.symbol | escape }}"
      data-url="{{ book.url | relative_url }}"></span>
    {% endfor %}
  </template>

  <script src="/assets/js/supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>

    'use strict';

    // 책 정보는 아래 HTML 템플릿에서 읽습니다. 원본은 _data/books.yml입니다.
    let bookData = Array.from(document.getElementById('book-data-template').content.querySelectorAll('[data-book]'), el => ({
      name: el.dataset.name,
      file: el.dataset.file,
      x: Number(el.dataset.x),
      y: Number(el.dataset.y),
      w: Number(el.dataset.w),
      h: Number(el.dataset.h),
      color: el.dataset.color,
      symbol: el.dataset.symbol,
      url: el.dataset.url
    }));

    // Jekyll이 처리되지 않은 정적 배포에서도 책 여섯 권은 표시합니다.
  if (bookData.length === 0) {
    bookData = [
      {name:'파란 책',file:'book-blue.png',x:29.8,y:18.7,w:3.3,h:20.9,url:'/books/blue/'},
      {name:'초록 책',file:'book-green.png',x:33.0,y:18.3,w:3.3,h:21.3,url:'/books/green/'},
      {name:'보라 책',file:'book-purple.png',x:36.2,y:19.3,w:3.3,h:20.3,url:'/books/purple/'},
      {name:'갈색 책',file:'book-brown.png',x:39.4,y:18.1,w:3.3,h:21.5,url:'/books/brown/'},
      {name:'아쿠아 책',file:'book-aqua.png',x:42.6,y:19.1,w:3.3,h:20.5,url:'/books/aqua/'},
      {name:'검정 책',file:'book-black.png',x:45.8,y:17.7,w:3.3,h:21.9,url:'/books/black/'}
    ];
  }

  const scene=document.getElementById('scene');

    const stage=document.getElementById('stage');

    const booksContainer=document.getElementById('books');

    const lantern=document.getElementById('lantern');

    const label=document.getElementById('selectionLabel');

    const openButton=document.getElementById('openButton');



    let selectedIndex=-1;

    let transitioning=false;



    function resizeStage() {

      const scale=Math.max(scene.clientWidth/1600,scene.clientHeight/960);

      stage.style.transform=`translate(-50%, -50%) scale(${scale})`;

    }

    window.addEventListener('resize',resizeStage,{passive:true});

    resizeStage();



    const defaults = bookData.map(b => ({...b}));
    const slug = b => b.url.split('/').filter(Boolean).pop();
    const $ = id => document.getElementById(id);
    let serverLayout=null, ready=false, visitorDrag=false, client, editing=false, saving=false, snapshot=null, admin=false;
    const validColor = c => /^#[0-9a-f]{6}$/i.test(c || '');
    function drawBooks() {
      booksContainer.replaceChildren();
      bookData.forEach((book,index)=>{

      const button=document.createElement('button');

      button.type='button';

      button.className='book';

      button.setAttribute('aria-label',`${book.name} 선택`);

      button.setAttribute('aria-pressed','false');

      button.style.left=book.x+'%';

      button.style.top=book.y+'%';

      button.style.width=book.w+'%';

      button.style.height=book.h+'%';

      const img=document.createElement('img');

      img.src='/assets/images/books/'+book.file;

      img.alt='';

      img.draggable=false;

      button.appendChild(img);
      if (book.designColor && validColor(book.designColor)) {
        // Preserve the original texture using the PNG as an alpha mask.
        const tint=document.createElement('div');
        Object.assign(tint.style,{position:'absolute',inset:'0',background:book.designColor,opacity:'.62',pointerEvents:'none',maskImage:`url("${img.src}")`,maskSize:'100% 100%',maskRepeat:'no-repeat',mixBlendMode:'color'});
        button.append(tint);
      }

      const handle=document.createElement('span');
      handle.className='resize-handle'; button.append(handle);
      button.addEventListener('pointerdown',e=>beginDrag(e,index,button,handle));

      button.addEventListener('click',()=>{if(!editing&&!visitorDrag)selectBook(index);visitorDrag=false;});

      booksContainer.appendChild(button);

    });



    }
    drawBooks();
    function selectBook(index) {

      if(transitioning)return;

      selectedIndex=index;

      const book=bookData[index];

      booksContainer.querySelectorAll('.book').forEach((el,i)=>{

        const active=i===index;

        el.classList.toggle('selected',active);

        el.setAttribute('aria-pressed',String(active));

      });

      label.textContent=book.name;

      openButton.textContent='책 펼치기 →';
      document.getElementById('selectionControls').hidden=false;

      openButton.disabled=false;

    }



    function resetShelfDay(){
      scene.classList.remove('is-night');
      lantern.setAttribute('aria-pressed','false');
      lantern.setAttribute('aria-label','밤으로 전환');
      try { localStorage.removeItem('shelfNight'); } catch(_) {}
    }
    resetShelfDay();
    lantern.addEventListener('click',()=>{
      const isNight=scene.classList.toggle('is-night');
      lantern.setAttribute('aria-label',isNight?'낮으로 전환':'밤으로 전환');

      lantern.setAttribute('aria-pressed',String(isNight));


    });



    function openSelectedBook() {
      if(editing || transitioning || selectedIndex<0) return;
      transitioning=true;
      openButton.disabled=true;
      lantern.disabled=true;
      const destination=bookData[selectedIndex].url||'/blog/';
      scene.classList.add('book-departing');
      setTimeout(()=>window.location.assign(destination),matchMedia('(prefers-reduced-motion: reduce)').matches?0:900);
    }
    window.addEventListener('pageshow',()=>{
      resetShelfDay();
      transitioning=false;
      scene.classList.remove('book-departing');
      lantern.disabled=false;
      openButton.disabled=selectedIndex<0;
    });

    openButton.addEventListener('click',openSelectedBook);

    function clamp(n,min,max){return Math.max(min,Math.min(max,n));}
    function layout(b){return {x:b.x,y:b.y,w:b.w,h:b.h};}
    function place(el,b){
      Object.assign(el.style,{left:b.x+'%',top:b.y+'%',width:b.w+'%',height:b.h+'%'});
    }
    // Shelf coordinates are percentages of the original 1600 × 960 stage.
    const shelves = [
      {left:28, right:79, top:15, bottom:39.6},
      {left:28, right:79, top:43, bottom:66.5}
    ];
    function nearestShelf(bottom) {
      return shelves.reduce((a,b)=>Math.abs(a.bottom-bottom)<=Math.abs(b.bottom-bottom)?a:b);
    }
    function snapBook(b, shelf=nearestShelf(b.y+b.h)) {
      b.w=clamp(b.w,1,shelf.right-shelf.left);
      b.h=clamp(b.h,4,shelf.bottom-shelf.top);
      b.x=clamp(b.x,shelf.left,shelf.right-b.w);
      b.y=shelf.bottom-b.h;
    }
    // Keep a tiny gap between book rectangles, including during dragging.
    const gap = 0.08;
    function rowOf(b) { return nearestShelf(b.y+b.h); }
    function freeSlots(shelf, width, others) {
      const slots=[];
      let left=shelf.left;
      for(const book of others.filter(b=>rowOf(b)===shelf).sort((a,b)=>a.x-b.x)) {
        const right=book.x-gap-width;
        if(right>=left) slots.push([left,right]);
        left=Math.max(left,book.x+book.w+gap);
      }
      if(shelf.right-width>=left) slots.push([left,shelf.right-width]);
      return slots;
    }
    function normalizeBooks() {
      const placed=[];
      // Repair old overlapping layouts; fall back to a compact two-row layout.
      for(const b of bookData) {
        snapBook(b);
        const row=rowOf(b);
        const options=[row,...shelves.filter(s=>s!==row)];
        let found=false;
        for(const shelf of options) {
          const slots=freeSlots(shelf,b.w,placed);
          if(!slots.length)continue;
          const x=slots.map(([l,r])=>clamp(b.x,l,r)).sort((a,c)=>Math.abs(a-b.x)-Math.abs(c-b.x))[0];
          b.x=x;snapBook(b,shelf);found=true;break;
        }
        if(!found) {
          const perRow=Math.ceil(bookData.length/2);
          bookData.forEach((v,i)=>{
            const shelf=shelves[Math.min(1,Math.floor(i/perRow))];
            const step=(shelf.right-shelf.left)/perRow;
            v.w=Math.min(v.w,step-gap);v.x=shelf.left+(i%perRow)*step;
            snapBook(v,shelf);
          });
          return;
        }
        placed.push(b);
      }
    }
    function beginDrag(e,index,el,handle){
      if(!ready || saving || transitioning || e.button!==0 || !e.isPrimary)return;
      visitorDrag=false;
      e.preventDefault();
      if(editing)selectBook(index);
      const b=bookData[index], start=layout(b), rect=stage.getBoundingClientRect();
      const resizing=e.target===handle, sx=e.clientX, sy=e.clientY;
      const originalShelf=rowOf(start);
      const others=bookData.filter(v=>v!==b);
      el.setPointerCapture(e.pointerId);
      const move=m=>{
        if(m.pointerId!==e.pointerId || saving)return;
        const dx=(m.clientX-sx)/rect.width*100,dy=(m.clientY-sy)/rect.height*100;
        if(!editing && !visitorDrag && Math.hypot(m.clientX-sx,m.clientY-sy)<6)return;
        if(!editing){visitorDrag=true;el.classList.add("visitor-moving");}
        if(resizing){
          const right=Math.min(originalShelf.right,...others.filter(v=>rowOf(v)===originalShelf && v.x>=start.x+start.w-1e-7).map(v=>v.x-gap));
          b.w=clamp(start.w+dx,1,Math.max(start.w,right-start.x));
          // The original width is valid; cap at the adjacent book.
          b.w=Math.min(b.w,right-start.x);
          b.h=clamp(start.h-dy,4,originalShelf.bottom-originalShelf.top);
          snapBook(b,originalShelf);
        }else{
          const target=nearestShelf(originalShelf.bottom+dy);
          const slots=freeSlots(target,b.w,others);
          const same=rowOf(b)===target;
          const available=same?slots.filter(([l,r])=>b.x>=l-1e-7&&b.x<=r+1e-7):slots;
          if(available.length){
            b.x=available.map(([l,r])=>clamp(start.x+dx,l,r)).sort((a,c)=>Math.abs(a-start.x-dx)-Math.abs(c-start.x-dx))[0];
            snapBook(b,target);
          }
        }
        place(el,b);
        if(editing)$('editStatus').textContent='저장하지 않은 변경 사항';
      };
      const end=()=>{el.classList.remove('visitor-moving');if(!editing&&visitorDrag){try{sessionStorage.setItem('shelf-visitor-layout',JSON.stringify(bookData.map(b=>({slug:slug(b),x:b.x,y:b.y}))))}catch{}}el.removeEventListener('pointermove',move);el.removeEventListener('lostpointercapture',end);};
      el.addEventListener('pointermove',move);
      el.addEventListener('lostpointercapture',end);
    }
    function setEditing(on){
      editing=on; scene.classList.toggle('editing',on);
      $('editorPanel').classList.toggle('is-editing',on);
      $('editShelf').setAttribute('aria-expanded',String(on));
      $('editShelf').hidden=on; $('editTools').hidden=!on;
      selectedIndex=-1;
      label.textContent='';openButton.disabled=true;document.getElementById('selectionControls').hidden=true;
      drawBooks();
    }
    $('editShelf').onclick=()=>{
      if(!admin||transitioning)return;
      if(serverLayout){bookData.forEach(b=>{const v=serverLayout.find(v=>slug(v)===slug(b));if(v)Object.assign(b,layout(v))});}snapshot=bookData.map(b=>({...b}));normalizeBooks();setEditing(true);
      $('editStatus').textContent='편집 모드';
    };
    $('cancelShelf').onclick=()=>{
      if(saving)return;bookData=snapshot.map(b=>({...b}));setEditing(false);
      $('editStatus').textContent='변경 취소';
    };
    $('resetShelf').onclick=()=>{
      if(saving)return;
      bookData.forEach(b=>Object.assign(b,layout(defaults.find(d=>slug(d)===slug(b)))));
      normalizeBooks();
      drawBooks();$('editStatus').textContent='기본 배치 복원 (저장 필요)';
    };
    $('saveShelf').onclick=async()=>{
      if(!admin||!editing||saving)return;
      // Final validation also rejects overlapping book rectangles.
      const overlaps=(a,b)=>Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x)>1e-7 && Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y)>1e-7;
      if(bookData.some((a,i)=>bookData.slice(i+1).some(b=>overlaps(a,b)))){
        $('editStatus').textContent='책이 겹쳐 있습니다. 위치를 조정해 주세요.';return;
      }
      saving=true;
      const buttons=[...$('editTools').querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);
      try{
        const {data,error}=await client.auth.getUser();
        if(error||data.user?.id!=='6e6288e5-3612-4d2f-8d8b-fb08007d86a9')throw new Error('관리자 인증이 필요합니다.');
        for(const b of bookData){
          const {error}=await client.from('books').update(layout(b)).eq('slug',slug(b)).select('slug').single();
          if(error)throw error;
        }
        serverLayout=bookData.map(b=>({...b}));sessionStorage.removeItem('shelf-visitor-layout');setEditing(false);$('editStatus').textContent='배치 저장 완료';
      }catch(e){$('editStatus').textContent='저장 실패 (일부 저장 가능): '+e.message+' — 다시 저장해 주세요.';}
      finally{saving=false;buttons.forEach(b=>b.disabled=false);}
    };
    async function syncShelf(){
      try{
        client=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY);
        const {data,error}=await client.from('books').select('slug,name,color,text_color,symbol,x,y,w,h');
        if(error)throw error;
        bookData.forEach(b=>{
          const row=data.find(r=>r.slug===slug(b));if(!row)return;
          b.name=row.name;b.symbol=row.symbol;b.designColor=row.color;b.textColor=row.text_color;
          if(['x','y','w','h'].every(k=>row[k]!==null&&Number.isFinite(Number(row[k])))){
            b.w=clamp(Number(row.w),1,100);b.h=clamp(Number(row.h),4,100);
            b.x=clamp(Number(row.x),0,100-b.w);b.y=clamp(Number(row.y),0,100-b.h);
          }
        });
        normalizeBooks();
        serverLayout=bookData.map(b=>({...b}));restoreVisitor();
        drawBooks();if(selectedIndex>=0)selectBook(selectedIndex);
        const auth=await client.auth.getUser();
        admin=auth.data?.user?.id==='6e6288e5-3612-4d2f-8d8b-fb08007d86a9';
        $('editorPanel').hidden=!admin;
        client.auth.onAuthStateChange((event,session)=>{
          if(session?.user?.id!=='6e6288e5-3612-4d2f-8d8b-fb08007d86a9'){
            admin=false;if(editing){bookData=snapshot.map(b=>({...b}));setEditing(false);}$('editorPanel').hidden=true;
          }
        });
      }catch(e){console.warn('책장 데이터 연동 실패:',e.message);if(!serverLayout){serverLayout=bookData.map(b=>({...b}));restoreVisitor();drawBooks();}}finally{ready=true;installSeal();}
    }
    const SEALS=["<svg viewBox=\"-40 -40 80 80\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle r=\"32\" stroke-width=\"1\"/><circle r=\"28\" stroke-width=\".6\"/><path d=\"M0 -37L3 -32L0 -27L-3 -32Z M0 37L3 32L0 27L-3 32Z\"/><circle cy=\"-17\" r=\"4\"/><path d=\"M0 -13V19M-13 -6H13M-20 2Q-20 20 0 20Q20 20 20 2M-24 8L-20 0L-15 8M15 8L20 0L24 8\"/></svg>", "<svg viewBox=\"-40 -40 80 80\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle r=\"32\" stroke-width=\"1\"/><circle r=\"28\" stroke-width=\".6\"/><path d=\"M0 -37L3 -32L0 -27L-3 -32Z M0 37L3 32L0 27L-3 32Z\"/><path d=\"M5 -23A24 24 0 1 0 17 17A23 23 0 0 1 5 -23Z\"/><path d=\"M15 -17v12M9 -11h12\"/></svg>", "<svg viewBox=\"-40 -40 80 80\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle r=\"32\" stroke-width=\"1\"/><circle r=\"28\" stroke-width=\".6\"/><path d=\"M0 -37L3 -32L0 -27L-3 -32Z M0 37L3 32L0 27L-3 32Z\"/><path d=\"M-18 -5Q-22 -23 0 -23Q22 -23 18 -5L10 4V15H-10V4Z M-5 8v7M5 8v7M-19 17L19 25M19 17L-19 25\"/><circle cx=\"-7\" cy=\"-5\" r=\"4\"/><circle cx=\"7\" cy=\"-5\" r=\"4\"/></svg>"];

    function restoreVisitor(){try{const saved=JSON.parse(sessionStorage.getItem('shelf-visitor-layout')||'[]');for(const b of bookData){const v=saved.find(v=>v.slug===slug(b));if(v&&Number.isFinite(v.x)&&Number.isFinite(v.y)){b.x=v.x;b.y=v.y;}}normalizeBooks()}catch{}}
    function sealDialogue(message){
  let n=document.getElementById('seal-dialogue');
  if(!n){
    n=document.createElement('div');n.id='seal-dialogue';n.setAttribute('aria-hidden','true');
    n.style.cssText="position:fixed;left:50%;bottom:17%;transform:translate(-50%,8px);z-index:2147483000;width:min(760px,88vw);max-width:88vw;box-sizing:border-box;text-align:center;color:#f3e6ce;font:400 clamp(17px,1.65vw,26px)/1.7 'Nanum Myeongjo',serif;background:rgba(20,16,13,.91);border:1px solid #a58a56;border-radius:0;backdrop-filter:blur(3px);text-shadow:0 1px 2px #0005;box-shadow:none;padding:16px 30px;min-width:min(320px,88vw);pointer-events:none;opacity:0;transition:opacity .8s ease,transform .6s ease;overflow-wrap:break-word;white-space:pre-line";
    document.body.append(n);
    const live=document.createElement('div');live.id='seal-dialogue-live';live.setAttribute('role','status');live.style.cssText='position:fixed;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);pointer-events:none';document.body.append(live);
  }
  clearTimeout(n.startTimer);clearTimeout(n.hideTimer);clearInterval(n.typeTimer);
  n.style.opacity='0';n.style.transform='translate(-50%,8px)';
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const chars=Array.from(message.replace(/ /g,'\n'));
  n.startTimer=setTimeout(()=>{
    document.getElementById('seal-dialogue-live').textContent=message;
    n.textContent='';n.style.transition=reduced?'none':'opacity .8s ease,transform .6s ease';
    n.style.opacity='1';n.style.transform='translate(-50%,0)';
    const finish=()=>{n.hideTimer=setTimeout(()=>{n.style.opacity='0';n.style.transform='translate(-50%, -4px)'},4000)};
    if(reduced){n.textContent=chars.join('');finish();return;}
    let i=0;n.typeTimer=setInterval(()=>{n.textContent=chars.slice(0,++i).join('');if(i>=chars.length){clearInterval(n.typeTimer);finish()}},42);
  },400);
}
function updateAnchor(){const a=document.getElementById('hidden-anchor');if(!a)return;const r=a.getBoundingClientRect();const covered=[...booksContainer.querySelectorAll('.book')].some(e=>{const b=e.getBoundingClientRect();return r.left<b.right&&r.right>b.left&&r.top<b.bottom&&r.bottom>b.top});a.classList.toggle('covered',covered);a.disabled=covered;}
function installSeal(){if(document.getElementById('hidden-anchor'))return;const b=[...(serverLayout||bookData)].sort((a,b)=>Math.abs(a.y+a.h-b.y-b.h)<1?a.x-b.x:a.y+a.h-b.y-b.h)[0];if(!b)return;const seal=document.createElement('button');seal.id='hidden-anchor';seal.type='button';seal.setAttribute('aria-label','닻 문장');seal.style.left=(b.x+b.w/2)+'%';seal.style.top=(b.y+b.h/2)+'%';seal.style.width=Math.min(2.2,b.w*.65)+'%';seal.innerHTML=SEALS[0];stage.insertBefore(seal,booksContainer);seal.onclick=()=>{if(!unlocked()||!scene.classList.contains('is-night'))return;if(Number(sessionStorage.getItem('marine-seal-step')||0)<1)sessionStorage.setItem('marine-seal-step','1');seal.classList.add('seal-lit');sealDialogue('……책 뒤에 이런 게 숨겨져 있었다니.');};const clue=document.createElement('div');clue.className='shelf-seal-clue';clue.innerHTML=SEALS.map((v,i)=>`<span>${v}<small>${['I','II','III'][i]}</small></span>`).join('')+'<p>기억을 간직한 곳에 닻을, 바다를 바라보는 곳에 달을,<br>세상의 끝을 그린 곳에 해골을.</p>';stage.append(clue);function refresh(){scene.classList.toggle('cipher-unlocked',unlocked())}refresh();updateAnchor();new MutationObserver(updateAnchor).observe(booksContainer,{subtree:true,childList:true,attributes:true,attributeFilter:['style','class']});window.addEventListener('resize',updateAnchor);window.addEventListener('pageshow',refresh);}
    function unlocked(){return sessionStorage.getItem('captain-secret-clue')==='1'&&sessionStorage.getItem('captain-cipher')==='1'}

    normalizeBooks();
    drawBooks();
    syncShelf();
