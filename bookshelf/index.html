<!DOCTYPE html>

<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#1b140e">

  <title>선장의 서재 | 책장</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poor+Story&display=swap" rel="stylesheet">

  <style>

    :root { color-scheme: dark; font-family: Georgia, 'Noto Serif KR', serif; }

    * { box-sizing: border-box; }

    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#100e0b; }

    button { font:inherit; }

    .scene { position:fixed; inset:0; overflow:hidden; isolation:isolate; }

    .stage { position:absolute; width:1600px; height:960px; left:50%; top:50%; transform-origin:center; }

    .background { position:absolute; inset:0; width:100%; height:100%; object-fit:fill; pointer-events:none; user-select:none; }

    .background.night { opacity:0; transition:opacity .65s ease; }

    .scene.is-night .background.night { opacity:1; }

    .scene.is-night .background.day { opacity:0; }

    .background.day { opacity:1; transition:opacity .65s ease; }

    .book { position:absolute; border:0; background:transparent; padding:0; cursor:pointer; z-index:4; transform-origin:bottom center; transition:transform .28s ease,filter .28s ease; }

    .book img { display:block; width:100%; height:100%; object-fit:fill; filter:drop-shadow(2px 4px 4px rgba(0,0,0,.42)); pointer-events:none; }

    .book:hover { transform:translateY(-10px); filter:brightness(1.12); }

    .book.selected { transform:translateY(-26px) scale(1.035); filter:brightness(1.2) drop-shadow(0 0 12px rgba(255,205,107,.5)); z-index:6; }

    .lantern-hotspot { position:absolute; z-index:8; left:68%; top:11%; width:17%; height:29%; border:0; padding:0; background:transparent; cursor:pointer; }

    .lantern-hotspot:focus-visible, .book:focus-visible { outline:3px solid #f1d18b; outline-offset:4px; }

    .controls { position:absolute; left:50%; bottom:6%; z-index:12; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:10px; white-space:nowrap; }

    .selection-label { color:#f0dfb6; text-shadow:0 2px 9px #000; font-size:19px; letter-spacing:.08em; min-height:25px; }

    .open-button { border:1px solid rgba(248,216,145,.7); border-radius:6px; background:linear-gradient(180deg,#6a4725,#382317); box-shadow:0 4px 18px #0009, inset 0 1px #cda36d77; color:#f8e4b9; padding:14px 36px; font-size:22px; font-weight:bold; cursor:pointer; transition:filter .2s,transform .2s; }

    .open-button:hover:not(:disabled) { filter:brightness(1.2); transform:translateY(-2px); }

    .open-button:disabled { opacity:.65; cursor:default; }

    /* 종이가 둥근 원으로 잘리지 않고, 가장자리가 안개처럼 번져 나간다. */

    @property --mist-radius { syntax: '<length>'; inherits: false; initial-value: 0vmax; }

    .parchment-reveal {

      --mist-radius: 0vmax;

      position:fixed; inset:0; z-index:1000; pointer-events:none; visibility:hidden;

      background:#e8c99b url('/assets/images/parchment-bg.webp') center/cover no-repeat;

      -webkit-mask-image:radial-gradient(circle at 50% 50%,#000 0,#000 max(0px, calc(var(--mist-radius) - 19vmax)),transparent calc(var(--mist-radius) + 19vmax));

      mask-image:radial-gradient(circle at 50% 50%,#000 0,#000 max(0px, calc(var(--mist-radius) - 19vmax)),transparent calc(var(--mist-radius) + 19vmax));

      opacity:0;

    }

    .parchment-reveal.expanding {

      visibility:visible;

      animation:mist-expand 2.85s cubic-bezier(.42,0,.17,1) forwards;

    }

    .parchment-reveal.covered { visibility:visible; opacity:1; --mist-radius:180vmax; }

    @keyframes mist-expand {

      0% { --mist-radius:0vmax; opacity:0; filter:blur(3px); }

      12% { opacity:.9; }

      100% { --mist-radius:180vmax; opacity:1; filter:blur(0); }

    }

    /* 초록우산 어린이체 파일을 assets/fonts/green-umbrella.woff2 에 넣으면 적용된다. */

    @font-face {

      font-family:'Green Umbrella';

      src:url('/assets/fonts/green-umbrella.woff2') format('woff2');

      font-display:swap;

    }

    .writing-area {

      position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);

      width:min(94vw,950px); height:230px; opacity:0; transition:opacity .18s ease;

      display:flex; align-items:center; justify-content:center;

    }

    .parchment-reveal.writing .writing-area { opacity:1; }

    .writing-text {

      position:relative; flex:none;

      white-space:nowrap; font-family:'Green Umbrella','초록우산 어린이체','Poor Story',cursive;

      font-weight:400; font-size:clamp(30px,5.6vw,70px); line-height:1.2;

      letter-spacing:.01em; color:#56351f; text-shadow:0 1px 1px #fff6;

    }

    .quill {

      position:absolute; left:0; top:0; width:clamp(90px,15vw,174px); height:auto;

      pointer-events:none; opacity:0; z-index:3;

      transform:translate(-10%,-95%) rotate(-6deg);

      filter:drop-shadow(5px 7px 4px #51351c50);

      transition:left .18s linear,top .18s ease-in-out,opacity .5s ease;

      transform-origin:12% 96%;

    }

    .parchment-reveal.writing .quill { opacity:1; }

    /* 펜촉이 종이를 톡톡 누르는 듯한 미세한 상하 떨림 */

    .quill.scribing { animation:quill-strokes .17s ease-in-out infinite alternate; }

    @keyframes quill-strokes {

      from { transform:translate(-10%,-95%) rotate(-8deg) translateY(0); }

      to { transform:translate(-10%,-95%) rotate(-3deg) translateY(4px); }

    }

    .quill.bob { animation:quill-idle 1.15s ease-in-out infinite; }

    @keyframes quill-idle {

      0%,100% {transform:translate(-10%,-95%) rotate(-6deg)}

      50% {transform:translate(-10%,-95%) rotate(-3deg) translate(3px,-4px)}

    }

    .parchment-reveal.departing .writing-area {

      opacity:0; transform:translate(-50%,-50%) scale(1.025);

      transition:opacity .8s ease,transform .8s ease;

    }

    .parchment-reveal.departing { filter:brightness(1.045); transition:filter .8s ease; }

    @media (prefers-reduced-motion:reduce) { .book,.background {transition:none;} .parchment-reveal.expanding {animation-duration:.01s;} .quill.bob,.quill.scribing {animation:none;} .quill {transition:none;} }



/* === BOOKSHELF RETURN START === */

.desk-return {

  position: fixed;

  z-index: 95;

  left: max(15px, env(safe-area-inset-left));

  top: max(15px, env(safe-area-inset-top));

  display: inline-flex;

  align-items: center;

  gap: 7px;

  padding: 7px 12px;

  border: 1px solid rgba(202,165,103,.55);

  border-radius: 3px;

  background: rgba(26,19,13,.67);

  color: #ddbd86;

  font-family: 'Gowun Batang', Georgia, serif;

  font-size: 12px;

  letter-spacing: .08em;

  text-decoration: none;

  text-shadow: 0 1px 4px #000;

  backdrop-filter: blur(3px);

  cursor: url('/assets/images/antique-magnifier-cursor.svg') 16 16, pointer;

  transition: background .2s, border-color .2s, color .2s;

}

.desk-return:hover, .desk-return:focus-visible {

  background: rgba(56,37,22,.84);

  border-color: rgba(239,198,123,.8);

  color: #f2d6a2;

}

.desk-return:focus-visible { outline: 2px solid #ddbd86; outline-offset: 3px; }

/* === BOOKSHELF RETURN END === */




    [hidden] { display:none !important; }
    .editor-panel { position:fixed; right:16px; top:16px; z-index:100; max-width:min(390px,90vw); padding:10px; background:#21180ef0; color:#f0dfb6; border:1px solid #a58755; border-radius:5px; }
    .editor-panel button { background:#513820; color:inherit; border:1px solid #a58755; border-radius:4px; padding:7px; cursor:pointer; margin:2px; }

    .editor-panel:not(.is-editing) { background:none; border:0; padding:0; box-shadow:none; }
    .editor-panel:not(.is-editing) #editStatus:empty { display:none; }
    .editor-panel:not(.is-editing) #editStatus:not(:empty) { background:#21180ef0; padding:6px 10px; border-radius:4px; }
    .editor-panel #editShelf { position:relative; display:grid; place-items:center; margin:0 0 0 auto; width:44px; height:44px; padding:0; border-radius:50%; border:1px solid #ad8c55; color:#e4c78c; background:radial-gradient(circle at 32% 25%,#80603a,#49331f 65%,#2c2016); box-shadow:inset 0 0 0 2px #332619,0 3px 9px #0008; }
    #editShelf svg { width:25px; height:25px; transition:transform .4s ease; }
    #editShelf:hover,#editShelf:focus-visible { color:#ffe6ae; box-shadow:inset 0 0 0 2px #49351e,0 0 12px #cfa65d66; }
    #editShelf:hover svg,#editShelf:focus-visible svg { transform:rotate(35deg); }
    #editShelf::after { content:'서가 정리'; position:absolute; top:calc(100% + 8px); right:0; white-space:nowrap; color:#e4c78c; background:#21180ef5; border:1px solid #987b4f; border-radius:4px; padding:6px 10px; opacity:0; pointer-events:none; transition:opacity .2s; }
    #editShelf:hover::after,#editShelf:focus-visible::after { opacity:1; }
    @media (prefers-reduced-motion:reduce) { #editShelf svg,#editShelf::after { transition:none; } }
    .editor-panel p { margin:5px; font-size:13px; }
    .scene.editing .book { touch-action:none; cursor:move; transition:none; transform:none; }
    .scene.editing .book.selected { outline:2px dashed #ffdb92; filter:none; }
    .resize-handle { display:none; position:absolute; right:0; top:0; width:24px; height:24px; background:#e4c48c; border:2px solid #503a20; cursor:nesw-resize; touch-action:none; }
    .scene.editing .book.selected .resize-handle { display:block; }
    .book-spine { position:absolute; inset:8% 13%; display:flex; align-items:center; flex-direction:column; gap:8%; pointer-events:none; text-shadow:0 1px 3px #000; overflow:hidden; }
    .spine-name { writing-mode:vertical-rl; font-size:clamp(10px, 1.1vw,18px); overflow:hidden; }
    .spine-symbol { font-size:20px; }
    .scene.editing .controls { display:none; }
</style>

</head>

<body>

  <a class="desk-return" href="{{ '/cabin/' | relative_url }}" aria-label="책상으로 돌아가기">〈 &nbsp;책상으로 돌아가기</a>

  <aside class="editor-panel" id="editorPanel" hidden>
    <button id="editShelf" type="button" aria-label="서가 정리" aria-controls="editTools" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10 2h4l.6 3 2 .9 2.6-1.7 2.8 2.8-1.7 2.6.9 2 3 .6v4l-3 .6-.9 2 1.7 2.6-2.8 2.8-2.6-1.7-2 .9-.6 3h-4l-.6-3-2-.9-2.6 1.7L2 21l1.7-2.6-.9-2-3-.6v-4l3-.6.9-2L2 6.6l2.8-2.8 2.6 1.7 2-.9z" transform="translate(1 0) scale(.87)"/>
        <circle cx="11.5" cy="12" r="3.3"/>
      </svg>
    </button>
    <div id="editTools" hidden>
      <button id="saveShelf">저장</button>
      <button id="cancelShelf">취소</button>
      <button id="resetShelf">기본 배치 복원</button>
      <p>책을 좌우로 끌거나 다른 선반으로 옮기세요. 오른쪽 위 모서리로 크기를 조절합니다.</p>
    </div>
    <p id="editStatus" role="status"></p>
  </aside>
  <main class="scene" id="scene" aria-label="선장의 서재 책장">

    <div class="stage" id="stage">

      <img class="background day" src="/assets/images/bookshelf-day.png" alt="" draggable="false">

      <img class="background night" src="/assets/images/bookshelf-night.png" alt="" draggable="false">

      <div id="books"></div>

      <button class="lantern-hotspot" id="lantern" type="button" aria-label="랜턴으로 낮과 밤 전환" aria-pressed="false"></button>

      <div class="controls">

        <div class="selection-label" id="selectionLabel" aria-live="polite">책을 선택해 주세요</div>

        <button class="open-button" id="openButton" type="button" disabled>책을 선택해 주세요</button>

      </div>

    </div>

  </main>

  <div class="parchment-reveal" id="parchmentReveal" aria-hidden="true">

    <div class="writing-area" id="writingArea">

      <div class="writing-text" id="writingText"></div>

      <img class="quill" id="quill" src="/assets/images/quill-white.webp" alt="">

    </div>

  </div>

  <!-- Jekyll은 HTML 영역에서 책 데이터를 생성합니다. JS/CSS 안에 Liquid를 넣지 않습니다. -->
  <template id="book-data-template">
    {% for book in site.data.books %}
    <span data-book
      data-name="{{ book.name | escape }}"
      data-file="{{ book.file | escape }}"
      data-x="{{ book.x }}" data-y="{{ book.y }}"
      data-w="{{ book.w }}" data-h="{{ book.h }}"
      data-color="{{ book.color | escape }}"
      data-symbol="{{ book.symbol | escape }}"
      data-url="{{ book.url | relative_url }}"></span>
    {% endfor %}
  </template>

  <script src="/assets/js/supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>

    'use strict';

    // 책 정보는 아래 HTML 템플릿에서 읽습니다. 원본은 _data/books.yml입니다.
    let bookData = Array.from(document.getElementById('book-data-template').content.querySelectorAll('[data-book]'), el => ({
      name: el.dataset.name,
      file: el.dataset.file,
      x: Number(el.dataset.x),
      y: Number(el.dataset.y),
      w: Number(el.dataset.w),
      h: Number(el.dataset.h),
      color: el.dataset.color,
      symbol: el.dataset.symbol,
      url: el.dataset.url
    }));

    // Jekyll이 처리되지 않은 정적 배포에서도 책 여섯 권은 표시합니다.
  if (bookData.length === 0) {
    bookData = [
      {name:'파란 책',file:'book-blue.png',x:29.8,y:18.7,w:3.3,h:20.9,url:'/books/blue/'},
      {name:'초록 책',file:'book-green.png',x:33.0,y:18.3,w:3.3,h:21.3,url:'/books/green/'},
      {name:'보라 책',file:'book-purple.png',x:36.2,y:19.3,w:3.3,h:20.3,url:'/books/purple/'},
      {name:'갈색 책',file:'book-brown.png',x:39.4,y:18.1,w:3.3,h:21.5,url:'/books/brown/'},
      {name:'아쿠아 책',file:'book-aqua.png',x:42.6,y:19.1,w:3.3,h:20.5,url:'/books/aqua/'},
      {name:'검정 책',file:'book-black.png',x:45.8,y:17.7,w:3.3,h:21.9,url:'/books/black/'}
    ];
  }

  const scene=document.getElementById('scene');

    const stage=document.getElementById('stage');

    const booksContainer=document.getElementById('books');

    const lantern=document.getElementById('lantern');

    const label=document.getElementById('selectionLabel');

    const openButton=document.getElementById('openButton');

    const parchment=document.getElementById('parchmentReveal');

    let selectedIndex=-1;

    let transitioning=false;



    function resizeStage() {

      const scale=Math.max(scene.clientWidth/1600,scene.clientHeight/960);

      stage.style.transform=`translate(-50%, -50%) scale(${scale})`;

    }

    window.addEventListener('resize',resizeStage,{passive:true});

    resizeStage();



    const defaults = bookData.map(b => ({...b}));
    const slug = b => b.url.split('/').filter(Boolean).pop();
    const $ = id => document.getElementById(id);
    let client, editing=false, saving=false, snapshot=null, admin=false;
    const validColor = c => /^#[0-9a-f]{6}$/i.test(c || '');
    function drawBooks() {
      booksContainer.replaceChildren();
      bookData.forEach((book,index)=>{

      const button=document.createElement('button');

      button.type='button';

      button.className='book';

      button.setAttribute('aria-label',`${book.name} 선택`);

      button.setAttribute('aria-pressed','false');

      button.style.left=book.x+'%';

      button.style.top=book.y+'%';

      button.style.width=book.w+'%';

      button.style.height=book.h+'%';

      const img=document.createElement('img');

      img.src='/assets/images/books/'+book.file;

      img.alt='';

      img.draggable=false;

      button.appendChild(img);
      if (book.designColor && validColor(book.designColor)) {
        // Preserve the original texture using the PNG as an alpha mask.
        const tint=document.createElement('div');
        Object.assign(tint.style,{position:'absolute',inset:'0',background:book.designColor,opacity:'.62',pointerEvents:'none',maskImage:`url("${img.src}")`,maskSize:'100% 100%',maskRepeat:'no-repeat',mixBlendMode:'color'});
        button.append(tint);
      }
      const spine=document.createElement('div');
      spine.className='book-spine';
      spine.style.color=validColor(book.textColor)?book.textColor:'#e1cda4';
      const symbol=document.createElement('span');
      symbol.className='spine-symbol'; symbol.textContent=book.symbol||'';
      const name=document.createElement('span');
      name.className='spine-name'; name.textContent=book.name;
      spine.append(symbol,name); button.append(spine);
      const handle=document.createElement('span');
      handle.className='resize-handle'; button.append(handle);
      button.addEventListener('pointerdown',e=>beginDrag(e,index,button,handle));

      button.addEventListener('click',()=>{if(!editing)selectBook(index);});

      booksContainer.appendChild(button);

    });



    }
    drawBooks();
    function selectBook(index) {

      if(transitioning)return;

      selectedIndex=index;

      const book=bookData[index];

      booksContainer.querySelectorAll('.book').forEach((el,i)=>{

        const active=i===index;

        el.classList.toggle('selected',active);

        el.setAttribute('aria-pressed',String(active));

      });

      label.textContent=book.name;

      openButton.textContent=book.name+' 펼치기';

      openButton.disabled=false;

    }



    lantern.addEventListener('click',()=>{

      const isNight=scene.classList.toggle('is-night');

      lantern.setAttribute('aria-pressed',String(isNight));

    });



    const writingArea=document.getElementById('writingArea');

    const writingText=document.getElementById('writingText');

    const quill=document.getElementById('quill');

    const MESSAGE='기록을 불러오는 중...';

    const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));



    // 새 페이지 HTML을 미리 요청한다. 이는 실제 화면 렌더링 완료를 뜻하지 않는다.

    function warmDestination(url) {

      try {

        const target=new URL(url,location.href);

        if(target.origin!==location.origin) return Promise.resolve();

        return fetch(target.href,{credentials:'same-origin',cache:'default'})

          .then(()=>undefined).catch(()=>undefined);

      } catch(_) { return Promise.resolve(); }

    }



    function setPenAtTextEnd() {

      const area=writingArea.getBoundingClientRect();

      const text=writingText.getBoundingClientRect();

      // 펜촉이 마지막 글자 오른쪽 아래에 오도록 위치시킨다.

      quill.style.left=(text.right-area.left+3)+'px';

      quill.style.top=(text.bottom-area.top-7)+'px';

    }



    async function writeMessage() {

      writingText.textContent='';

      parchment.classList.add('writing');

      quill.classList.add('scribing');

      setPenAtTextEnd();

      for(const ch of Array.from(MESSAGE)) {

        writingText.textContent+=ch;

        setPenAtTextEnd();

        await wait(ch===' '?90:ch==='.'?135:155);

      }

      quill.classList.remove('scribing');

      quill.classList.add('bob');

    }



    async function openSelectedBook() {

      if(editing || transitioning || selectedIndex<0) return;

      transitioning=true;

      openButton.disabled=true;

      lantern.disabled=true;

      const destination=bookData[selectedIndex].url||'/blog/';

      let ready=false;

      const preload=warmDestination(destination).then(()=>{ready=true;});

      // 안개 같은 양피지가 약 2.85초 동안 번져 나온다.

      const expanded=new Promise(resolve=>{

        parchment.addEventListener('animationend',resolve,{once:true});

        setTimeout(resolve,3250);

      });

      parchment.classList.add('expanding');

      await expanded;

      parchment.classList.remove('expanding');

      parchment.classList.add('covered');

      // 로딩이 빨라도 펜이 문구를 끝까지 쓰도록 보장한다.

      await writeMessage();

      if(!ready) await Promise.race([preload,wait(2400)]);

      quill.classList.remove('bob');

      parchment.classList.add('departing');

      await wait(480);

      // 도착 페이지에 별도 오버레이를 설치하면 자연스럽게 이어진다.

      try {sessionStorage.setItem('parchmentArrival','1');} catch(_) {}

      window.location.assign(destination);

    }

    openButton.addEventListener('click',openSelectedBook);

    function clamp(n,min,max){return Math.max(min,Math.min(max,n));}
    function layout(b){return {x:b.x,y:b.y,w:b.w,h:b.h};}
    function place(el,b){
      Object.assign(el.style,{left:b.x+'%',top:b.y+'%',width:b.w+'%',height:b.h+'%'});
    }
    // Shelf coordinates are percentages of the original 1600 × 960 stage.
    const shelves = [
      {left:28, right:79, top:15, bottom:39.6},
      {left:28, right:79, top:43, bottom:66.5}
    ];
    function nearestShelf(bottom) {
      return shelves.reduce((a,b)=>Math.abs(a.bottom-bottom)<=Math.abs(b.bottom-bottom)?a:b);
    }
    function snapBook(b, shelf=nearestShelf(b.y+b.h)) {
      b.w=clamp(b.w,1,shelf.right-shelf.left);
      b.h=clamp(b.h,4,shelf.bottom-shelf.top);
      b.x=clamp(b.x,shelf.left,shelf.right-b.w);
      b.y=shelf.bottom-b.h;
    }
    // Keep a tiny gap between book rectangles, including during dragging.
    const gap = 0.08;
    function rowOf(b) { return nearestShelf(b.y+b.h); }
    function freeSlots(shelf, width, others) {
      const slots=[];
      let left=shelf.left;
      for(const book of others.filter(b=>rowOf(b)===shelf).sort((a,b)=>a.x-b.x)) {
        const right=book.x-gap-width;
        if(right>=left) slots.push([left,right]);
        left=Math.max(left,book.x+book.w+gap);
      }
      if(shelf.right-width>=left) slots.push([left,shelf.right-width]);
      return slots;
    }
    function normalizeBooks() {
      const placed=[];
      // Repair old overlapping layouts; fall back to a compact two-row layout.
      for(const b of bookData) {
        snapBook(b);
        const row=rowOf(b);
        const options=[row,...shelves.filter(s=>s!==row)];
        let found=false;
        for(const shelf of options) {
          const slots=freeSlots(shelf,b.w,placed);
          if(!slots.length)continue;
          const x=slots.map(([l,r])=>clamp(b.x,l,r)).sort((a,c)=>Math.abs(a-b.x)-Math.abs(c-b.x))[0];
          b.x=x;snapBook(b,shelf);found=true;break;
        }
        if(!found) {
          const perRow=Math.ceil(bookData.length/2);
          bookData.forEach((v,i)=>{
            const shelf=shelves[Math.min(1,Math.floor(i/perRow))];
            const step=(shelf.right-shelf.left)/perRow;
            v.w=Math.min(v.w,step-gap);v.x=shelf.left+(i%perRow)*step;
            snapBook(v,shelf);
          });
          return;
        }
        placed.push(b);
      }
    }
    function beginDrag(e,index,el,handle){
      if(!editing || saving || e.button!==0 || !e.isPrimary)return;
      e.preventDefault();
      selectBook(index);
      const b=bookData[index], start=layout(b), rect=stage.getBoundingClientRect();
      const resizing=e.target===handle, sx=e.clientX, sy=e.clientY;
      const originalShelf=rowOf(start);
      const others=bookData.filter(v=>v!==b);
      el.setPointerCapture(e.pointerId);
      const move=m=>{
        if(m.pointerId!==e.pointerId || !editing || saving)return;
        const dx=(m.clientX-sx)/rect.width*100,dy=(m.clientY-sy)/rect.height*100;
        if(resizing){
          const right=Math.min(originalShelf.right,...others.filter(v=>rowOf(v)===originalShelf && v.x>=start.x+start.w-1e-7).map(v=>v.x-gap));
          b.w=clamp(start.w+dx,1,Math.max(start.w,right-start.x));
          // The original width is valid; cap at the adjacent book.
          b.w=Math.min(b.w,right-start.x);
          b.h=clamp(start.h-dy,4,originalShelf.bottom-originalShelf.top);
          snapBook(b,originalShelf);
        }else{
          const target=nearestShelf(originalShelf.bottom+dy);
          const slots=freeSlots(target,b.w,others);
          const same=rowOf(b)===target;
          const available=same?slots.filter(([l,r])=>b.x>=l-1e-7&&b.x<=r+1e-7):slots;
          if(available.length){
            b.x=available.map(([l,r])=>clamp(start.x+dx,l,r)).sort((a,c)=>Math.abs(a-start.x-dx)-Math.abs(c-start.x-dx))[0];
            snapBook(b,target);
          }
        }
        place(el,b);
        $('editStatus').textContent='저장하지 않은 변경 사항';
      };
      const end=()=>{el.removeEventListener('pointermove',move);el.removeEventListener('lostpointercapture',end);};
      el.addEventListener('pointermove',move);
      el.addEventListener('lostpointercapture',end);
    }
    function setEditing(on){
      editing=on; scene.classList.toggle('editing',on);
      $('editorPanel').classList.toggle('is-editing',on);
      $('editShelf').setAttribute('aria-expanded',String(on));
      $('editShelf').hidden=on; $('editTools').hidden=!on;
      selectedIndex=-1;
      label.textContent='책을 선택해 주세요';openButton.textContent='책을 선택해 주세요';openButton.disabled=true;
      drawBooks();
    }
    $('editShelf').onclick=()=>{
      if(!admin||transitioning)return;
      snapshot=bookData.map(b=>({...b}));normalizeBooks();setEditing(true);
      $('editStatus').textContent='편집 모드';
    };
    $('cancelShelf').onclick=()=>{
      if(saving)return;bookData=snapshot.map(b=>({...b}));setEditing(false);
      $('editStatus').textContent='변경 취소';
    };
    $('resetShelf').onclick=()=>{
      if(saving)return;
      bookData.forEach(b=>Object.assign(b,layout(defaults.find(d=>slug(d)===slug(b)))));
      normalizeBooks();
      drawBooks();$('editStatus').textContent='기본 배치 복원 (저장 필요)';
    };
    $('saveShelf').onclick=async()=>{
      if(!admin||!editing||saving)return;
      // Final validation also rejects overlapping book rectangles.
      const overlaps=(a,b)=>Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x)>1e-7 && Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y)>1e-7;
      if(bookData.some((a,i)=>bookData.slice(i+1).some(b=>overlaps(a,b)))){
        $('editStatus').textContent='책이 겹쳐 있습니다. 위치를 조정해 주세요.';return;
      }
      saving=true;
      const buttons=[...$('editTools').querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);
      try{
        const {data,error}=await client.auth.getUser();
        if(error||data.user?.id!=='6e6288e5-3612-4d2f-8d8b-fb08007d86a9')throw new Error('관리자 인증이 필요합니다.');
        for(const b of bookData){
          const {error}=await client.from('books').update(layout(b)).eq('slug',slug(b)).select('slug').single();
          if(error)throw error;
        }
        setEditing(false);$('editStatus').textContent='배치 저장 완료';
      }catch(e){$('editStatus').textContent='저장 실패 (일부 저장 가능): '+e.message+' — 다시 저장해 주세요.';}
      finally{saving=false;buttons.forEach(b=>b.disabled=false);}
    };
    async function syncShelf(){
      try{
        client=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY);
        const {data,error}=await client.from('books').select('slug,name,color,text_color,symbol,x,y,w,h');
        if(error)throw error;
        bookData.forEach(b=>{
          const row=data.find(r=>r.slug===slug(b));if(!row)return;
          b.name=row.name;b.symbol=row.symbol;b.designColor=row.color;b.textColor=row.text_color;
          if(['x','y','w','h'].every(k=>row[k]!==null&&Number.isFinite(Number(row[k])))){
            b.w=clamp(Number(row.w),1,100);b.h=clamp(Number(row.h),4,100);
            b.x=clamp(Number(row.x),0,100-b.w);b.y=clamp(Number(row.y),0,100-b.h);
          }
        });
        normalizeBooks();
        drawBooks();if(selectedIndex>=0)selectBook(selectedIndex);
        const auth=await client.auth.getUser();
        admin=auth.data?.user?.id==='6e6288e5-3612-4d2f-8d8b-fb08007d86a9';
        $('editorPanel').hidden=!admin;
        client.auth.onAuthStateChange((event,session)=>{
          if(session?.user?.id!=='6e6288e5-3612-4d2f-8d8b-fb08007d86a9'){
            admin=false;if(editing){bookData=snapshot.map(b=>({...b}));setEditing(false);}$('editorPanel').hidden=true;
          }
        });
      }catch(e){console.warn('책장 데이터 연동 실패:',e.message);}
    }
    normalizeBooks();
    drawBooks();
    syncShelf();

  </script>
