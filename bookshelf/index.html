
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Grand Security Line | 책장</title>
  <link rel="icon" type="image/png" href="/assets/images/favicon.png">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #140e0a;
      color: #e8cf9e;
      font-family: Georgia, serif;
      overflow: hidden;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      isolation: isolate;
    }

    /*
      책장 배경과 책을 같은 좌표계에 배치
      기준 크기: 1600 × 960
    */
    .bookshelf-stage {
      position: absolute;
      width: 1600px;
      height: 960px;
      left: 50%;
      top: 50%;

      transform-origin: center center;
      transform:
        translate(-50%, -50%)
        scale(var(--scene-scale, 1));
    }

    /* 낮 배경 */
    .background {
      position: absolute;
      inset: 0;

      background-image: url("/assets/images/bookshelf-day.png");
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* 밤 배경 */
    .background.night {
      background-image: url("/assets/images/bookshelf-night.png");
      opacity: 0;
      transition: opacity 0.7s ease;
    }

    body.dark .background.night {
      opacity: 1;
    }

    /* 상단 메뉴 */
    .toolbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;

      display: flex;
      align-items: center;
      padding: 12px 24px;

      background: rgba(18, 12, 8, 0.75);
      border-bottom: 1px solid rgba(180, 139, 75, 0.4);
    }

    .toolbar a {
      color: #e8cf9e;
      background: rgba(20, 12, 7, 0.4);
      border: 1px solid rgba(180, 139, 75, 0.5);
      border-radius: 6px;

      padding: 9px 14px;
      text-decoration: none;
      cursor: pointer;

      font: inherit;
      font-size: 14px;

      transition: background 0.2s ease;
    }

    .toolbar a:hover {
      background: rgba(180, 139, 75, 0.22);
    }

    /* 책 이미지 배치 */
    .books {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }

    .book {
      position: absolute;

      left: var(--x);
      top: var(--y);
      width: var(--w);
      height: var(--h);

      padding: 0;
      border: none;
      background: transparent;

      cursor: pointer;
      pointer-events: auto;

      transform-origin: center bottom;
      transform: translate3d(0, 0, 0) scale(1);

      transition:
        transform 0.42s cubic-bezier(0.2, 0.8, 0.2, 1),
        filter 0.42s ease;
    }

    .book img {
      display: block;
      width: 100%;
      height: 100%;

      object-fit: fill;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* 책 위에 마우스를 올렸을 때 */
    .book:hover,
    .book:focus-visible {
      transform: translate3d(0, -9px, 0) scale(1.09);

      filter:
        brightness(1.1)
        drop-shadow(10px 14px 10px rgba(0, 0, 0, 0.7));

      z-index: 10;
      outline: none;
    }

    /* 책을 클릭했을 때 */
    .book.selected {
      transform: translate3d(0, -22px, 0) scale(1.2);

      filter:
        brightness(1.12)
        drop-shadow(14px 20px 14px rgba(0, 0, 0, 0.8));

      z-index: 11;
    }

    /*
      랜턴 투명 클릭 영역

      사진 속 랜턴 위에 투명 버튼을 배치한다.
      마우스를 올려도 시각적 효과는 없다.
    */
    .lantern-toggle {
      position: absolute;

      left: 70.5%;
      top: 70%;
      width: 8%;
      height: 24%;

      padding: 0;
      border: none;
      background: transparent;

      cursor: default;
      z-index: 15;

      appearance: none;
      -webkit-appearance: none;
      -webkit-tap-highlight-color: transparent;
    }

    .lantern-toggle:hover,
    .lantern-toggle:active {
      background: transparent;
      filter: none;
      transform: none;
    }

    /* 키보드 사용자에게만 포커스 표시 */
    .lantern-toggle:focus-visible {
      outline: 2px solid #e8cf9e;
      outline-offset: 2px;
      border-radius: 12px;
    }

    /* 책 선택 안내 */
    .info {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;

      min-width: 220px;
      padding: 13px 22px;

      background: rgba(20, 12, 7, 0.88);
      border: 1px solid rgba(180, 139, 75, 0.5);
      border-radius: 8px;

      color: #e8cf9e;
      text-align: center;
      font-size: 14px;

      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .background.night,
      .book {
        transition-duration: 0.01ms;
      }
    }
  </style>
</head>

<body>
  <main class="scene" id="scene">

    <!-- 배경과 책이 함께 확대·축소되는 영역 -->
    <div class="bookshelf-stage" id="bookshelfStage">

      <!-- 낮·밤 배경 -->
      <div class="background"></div>
      <div class="background night"></div>

      <!-- 책 6권 -->
      <div class="books" id="books"></div>

      <!-- 사진 속 랜턴 클릭 영역 -->
      <button
        id="lanternToggle"
        class="lantern-toggle"
        type="button"
        aria-label="랜턴을 눌러 밤으로 전환">
      </button>

    </div>

    <!-- 상단 메뉴: 선장실 버튼만 유지 -->
    <nav class="toolbar" aria-label="책장 메뉴">
      <a href="/cabin/">← 선장실</a>
    </nav>

    <!-- 책 선택 메시지 -->
    <div class="info" id="info" aria-live="polite">
      책을 선택해 보세요.
    </div>

  </main>

  <script>
    /*
      책 6권 배치 좌표

      기존에 완성한 위치, 높낮이, 두께, 간격을
      변경하지 않고 그대로 유지한다.
    */
    const bookData = [
      {
        name: "파란 책",
        file: "book-blue.png",
        x: 29.8,
        y: 18.7,
        w: 3.3,
        h: 20.9
      },
      {
        name: "초록 책",
        file: "book-green.png",
        x: 33.0,
        y: 18.3,
        w: 3.3,
        h: 21.3
      },
      {
        name: "보라 책",
        file: "book-purple.png",
        x: 36.2,
        y: 19.3,
        w: 3.3,
        h: 20.3
      },
      {
        name: "갈색 책",
        file: "book-brown.png",
        x: 39.4,
        y: 18.1,
        w: 3.3,
        h: 21.5
      },
      {
        name: "아쿠아 책",
        file: "book-aqua.png",
        x: 42.6,
        y: 19.1,
        w: 3.3,
        h: 20.5
      },
      {
        name: "검정 책",
        file: "book-black.png",
        x: 45.8,
        y: 17.7,
        w: 3.3,
        h: 21.9
      }
    ];

    const container = document.getElementById("books");
    const info = document.getElementById("info");
    const stage = document.getElementById("bookshelfStage");
    const lanternToggle = document.getElementById("lanternToggle");

    let selectedBook = null;

    /* 책 6권 생성 */
    bookData.forEach((book) => {
      const button = document.createElement("button");

      button.type = "button";
      button.className = "book";

      button.setAttribute("aria-label", book.name);
      button.setAttribute("aria-pressed", "false");

      button.style.setProperty("--x", book.x + "%");
      button.style.setProperty("--y", book.y + "%");
      button.style.setProperty("--w", book.w + "%");
      button.style.setProperty("--h", book.h + "%");

      const img = document.createElement("img");

      img.src = "/assets/images/books/" + book.file;
      img.alt = "";
      img.draggable = false;

      button.appendChild(img);

      button.addEventListener("click", () => {
        const isAlreadySelected = selectedBook === button;

        document.querySelectorAll(".book").forEach((element) => {
          element.classList.remove("selected");
          element.setAttribute("aria-pressed", "false");
        });

        if (isAlreadySelected) {
          selectedBook = null;
          info.textContent = "책을 선택해 보세요.";
          return;
        }

        button.classList.add("selected");
        button.setAttribute("aria-pressed", "true");

        selectedBook = button;
        info.textContent = book.name + " 선택됨";
      });

      container.appendChild(button);
    });

    /* 낮·밤 전환 */
    function applyTheme(dark) {
      document.body.classList.toggle("dark", dark);

      lanternToggle.setAttribute(
        "aria-label",
        dark
          ? "랜턴을 눌러 낮으로 전환"
          : "랜턴을 눌러 밤으로 전환"
      );

      localStorage.setItem(
        "bookshelf-theme",
        dark ? "night" : "day"
      );
    }

    /* 마지막 낮·밤 상태 복원 */
    applyTheme(
      localStorage.getItem("bookshelf-theme") === "night"
    );

    /* 랜턴을 클릭했을 때만 낮·밤 전환 */
    lanternToggle.addEventListener("click", () => {
      const isDark = document.body.classList.contains("dark");
      applyTheme(!isDark);
    });

    /*
      브라우저 크기에 따라 책장과 책을 함께 확대·축소
    */
    function resizeBookshelf() {
      const scene = document.getElementById("scene");

      const scale = Math.max(
        scene.clientWidth / 1600,
        scene.clientHeight / 960
      );

      stage.style.setProperty("--scene-scale", scale);
    }

    window.addEventListener("resize", resizeBookshelf);
    resizeBookshelf();
  </script>
</body>
</html>
