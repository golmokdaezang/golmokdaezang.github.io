
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grand Security Line</title>

  <link rel="stylesheet" href="/voyage/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script defer src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"></script>
  <script defer src="/voyage/community-auth.js?v=4"></script>
  <script defer src="/voyage/script.js?v=4"></script>

  <style>
    /* 방문 기록 동의 영역 */
    .consent-panel {
      width: min(390px, 90vw);
      padding: 17px 18px;
      border: 1px solid rgba(255,255,255,.5);
      border-radius: 14px;
      background: rgba(0, 35, 65, .65);
      backdrop-filter: blur(8px);
      text-align: left;
    }

    .consent-option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 10px 0;
      color: #fff;
      font-size: 14px;
      line-height: 1.7;
      cursor: pointer;
    }

    .consent-option input {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      margin-top: 3px;
      accent-color: #f3cf89;
      cursor: pointer;
    }

    .consent-option input:disabled {
      cursor: not-allowed;
    }

    .consent-option:has(input:disabled) {
      opacity: .55;
    }

    .consent-description {
      margin: 10px 0 0;
      color: rgba(255,255,255,.8);
      font-size: 12px;
      line-height: 1.7;
    }

    #name-form {
      gap: 12px;
    }

    #name-form .start-button {
      margin-top: 12px;
    }

    #save-status {
      margin: 0;
      min-height: 1.5em;
      color: #fff1cb;
      font-size: 13px;
      line-height: 1.6;
    }

    #name-screen {
      max-height: 85dvh;
      overflow-y: auto;
      padding: 12px;
    }

    #name-form .start-button:disabled {
      cursor: wait;
      opacity: .65;
    }
    .consent-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; width:min(860px, 100%); }
    .consent-grid .consent-panel { width:100%; box-sizing:border-box; padding:18px; font-family:system-ui,"Malgun Gothic",sans-serif; }
    .consent-panel h2 { font-size:19px; color:#ffe3a3; margin:0 0 12px; }
    .consent-option { font-size:16px; line-height:1.5; }
    .consent-description { font-size:14px; line-height:1.55; color:#e3edf9; }
    .consent-note,#save-status { font:14px/1.5 system-ui,"Malgun Gothic",sans-serif; margin:0; }
    #name-screen { width:min(900px,100%); box-sizing:border-box; }
    #name-form { margin-top:12px; }
    #community-captcha { max-width:100%; }
    @media(max-width:680px) { .consent-grid { grid-template-columns:1fr; } .consent-grid .consent-panel { padding:14px; } }
  </style>
</head>

<body>
  <!-- 기존 바다 배경 -->
  <div class="ocean-background" aria-hidden="true"></div>
  <div class="sunlight" aria-hidden="true"></div>
  <div class="wind-particles" aria-hidden="true"></div>

  <main class="welcome">
    <p class="subtitle">THE GRAND SECURITY LINE</p>

    <!-- 첫 화면 -->
    <section id="start-screen">
      <h1>항해할 준비가 되셨나요?</h1>

      <button class="start-button" type="button">
        항해 시작하기 →
      </button>
    </section>

    <!-- 닉네임 입력 화면 -->
    <section id="name-screen" hidden>
      <h1>항해자님의 이름은?</h1>

      <form id="name-form">
        <input
          id="visitor-name"
          type="text"
          placeholder="닉네임 (실명 제외)"
          maxlength="20"
          autocomplete="nickname"
          required
        >

        <div class="consent-grid">
        <div class="consent-panel">
          <h2>방문 기록</h2>
          <label class="consent-option">
            <input
              id="visit-consent"
              type="checkbox"
            >
            <span>
              방문 기록 저장 (선택)
            </span>
          </label>

          <label class="consent-option">
            <input
              id="leaderboard-consent"
              type="checkbox"
              disabled
            >
            <span>
              닉네임과 방문 횟수를 WANTED 순위표에
              공개하는 데 동의합니다. (선택)
            </span>
          </label>

          <p class="consent-description">
            방문 기록 저장에 동의하면 익명 인증 계정과 입력한 닉네임 및
            방문 기록을 서버에 저장합니다.
            순위표 공개에 동의한 경우에만
            닉네임과 방문 횟수를 공개합니다.
            동의하지 않아도 블로그에 입장할 수 있습니다.
          </p>
        </div>

        <div class="consent-panel"><h2>커뮤니티</h2><label class="consent-option"><input type="checkbox" id="community-consent">방명록 및 무전 이용 (선택)</label><label class="consent-option"><input type="checkbox" id="community-public" disabled>커뮤니티 닉네임 공개 (선택)</label><label class="consent-option"><input type="checkbox" id="community-welcome" disabled>환영 방송 공개 (선택)</label><p class="consent-description">이용 동의 시 익명 계정과 닉네임을 저장합니다. 공개에 동의하지 않으면 익명의 항해자로 표시됩니다.</p></div></div><div id="community-captcha" hidden></div>
        <p class="consent-note">모든 동의는 선택입니다. 실명이나 연락처는 입력하지 마세요.</p>
        <p id="save-status" role="status" aria-live="polite"></p>

        <button
          id="enter-button"
          class="start-button"
          type="submit"
        >
          항해 시작 →
        </button>
      </form>
    </section>

    <!-- 환영 화면 -->
    <section id="greeting-screen" hidden>
      <h1 id="greeting-message"></h1>
    </section>
  </main>
</body>
</html>
