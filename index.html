
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grand Security Line</title>

  <link rel="stylesheet" href="/voyage/style.css">
  <script defer src="/voyage/script.js"></script>

  <style>
    /* 방문 기록 동의 영역 */
    .consent-panel {
      width: min(390px, 90vw);
      padding: 17px 18px;
      border: 1px solid rgba(255,255,255,.5);
      border-radius: 14px;
      background: rgba(0, 35, 65, .65);
      backdrop-filter: blur(8px);
      text-align: left;
    }

    .consent-option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 10px 0;
      color: #fff;
      font-size: 14px;
      line-height: 1.7;
      cursor: pointer;
    }

    .consent-option input {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      margin-top: 3px;
      accent-color: #f3cf89;
      cursor: pointer;
    }

    .consent-option input:disabled {
      cursor: not-allowed;
    }

    .consent-option:has(input:disabled) {
      opacity: .55;
    }

    .consent-description {
      margin: 10px 0 0;
      color: rgba(255,255,255,.8);
      font-size: 12px;
      line-height: 1.7;
    }

    #name-form {
      gap: 12px;
    }

    #name-form .start-button {
      margin-top: 12px;
    }

    #save-status {
      margin: 0;
      min-height: 1.5em;
      color: #fff1cb;
      font-size: 13px;
      line-height: 1.6;
    }

    #name-screen {
      max-height: 85dvh;
      overflow-y: auto;
      padding: 12px;
    }

    #name-form .start-button:disabled {
      cursor: wait;
      opacity: .65;
    }
  </style>
</head>

<body>
  <!-- 기존 바다 배경 -->
  <div class="ocean-background" aria-hidden="true"></div>
  <div class="sunlight" aria-hidden="true"></div>
  <div class="wind-particles" aria-hidden="true"></div>

  <main class="welcome">
    <p class="subtitle">THE GRAND SECURITY LINE</p>

    <!-- 첫 화면 -->
    <section id="start-screen">
      <h1>항해할 준비가 되셨나요?</h1>

      <button class="start-button" type="button">
        항해 시작하기 →
      </button>
    </section>

    <!-- 닉네임 입력 화면 -->
    <section id="name-screen" hidden>
      <h1>항해자님의 이름은?</h1>

      <form id="name-form">
        <input
          id="visitor-name"
          type="text"
          placeholder="이름 또는 닉네임"
          maxlength="20"
          autocomplete="nickname"
          required
        >

        <div class="consent-panel">
          <label class="consent-option">
            <input
              id="visit-consent"
              type="checkbox"
            >
            <span>
              방문 기록 저장에 동의합니다. (선택)
            </span>
          </label>

          <label class="consent-option">
            <input
              id="leaderboard-consent"
              type="checkbox"
              disabled
            >
            <span>
              닉네임과 방문 횟수를 WANTED 순위표에
              공개하는 데 동의합니다. (선택)
            </span>
          </label>

          <p class="consent-description">
            방문 기록 저장에 동의하면 입력한 닉네임과
            방문 기록을 서버에 저장합니다.
            순위표 공개에 동의한 경우에만
            닉네임과 방문 횟수를 공개합니다.
            동의하지 않아도 블로그에 입장할 수 있습니다.
          </p>
        </div>

        <p id="save-status" role="status" aria-live="polite"></p>

        <button
          id="enter-button"
          class="start-button"
          type="submit"
        >
          항해 시작 →
        </button>
      </form>
    </section>

    <!-- 환영 화면 -->
    <section id="greeting-screen" hidden>
      <h1 id="greeting-message"></h1>
    </section>
  </main>
</body>
</html>
