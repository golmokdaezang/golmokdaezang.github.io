<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grand Security Line | 선장실</title>
<style>
@font-face {
  font-family: "YoonChoWooSan";
  src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2408@1.0/YoonChildfundkoreaManSeh.woff2")
    format("woff2");
  font-weight: normal;
  font-display: swap;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #100b08;
}
body { overflow: hidden; }
.cabin {
  position: relative;
  width: 100vw;
  height: 100dvh;
  overflow: hidden;
  isolation: isolate;
}
/* 낮과 밤 이미지 */
.scene-image {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  pointer-events: none;
  user-select: none;
}
.day { z-index: 0; }
.night {
  z-index: 1;
  opacity: 0;
  transition: opacity 1.5s ease-in-out;
}
.cabin.dark .night { opacity: 1; }
.darkness {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background: rgba(3, 8, 20, 0);
  transition: background 1.5s ease-in-out;
}
.cabin.dark .darkness {
  background: rgba(3, 8, 20, 0.08);
}
/* 랜턴 빛 */
.lantern-glow {
  position: absolute;
  z-index: 3;
  left: 48%;
  top: -14%;
  width: 40%;
  height: 70%;
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(
    ellipse at 50% 40%,
    rgba(255,195,105,0.28),
    rgba(255,165,65,0.12) 30%,
    rgba(255,130,30,0.03) 60%,
    transparent 75%
  );
  opacity: 0;
  mix-blend-mode: screen;
  transition: opacity 1.5s ease-in-out;
}
.cabin.dark .lantern-glow {
  opacity: 1;
  animation: lanternFlicker 4s ease-in-out infinite;
}
@keyframes lanternFlicker {
  0%, 100% { opacity: 0.85; }
  35% { opacity: 1; }
  65% { opacity: 0.9; }
}
/* 공기 중 먼지 */
.dust-container {
  position: absolute;
  inset: 0;
  z-index: 5;
  overflow: hidden;
  pointer-events: none;
}
.dust-particle {
  position: absolute;
  left: var(--x);
  top: var(--y);
  width: var(--size);
  height: var(--size);
  border-radius: 50%;
  background: rgba(255,235,185,0.9);
  box-shadow: 0 0 7px rgba(255,216,143,0.6);
  opacity: 0;
  animation: dustFloat var(--duration) ease-in-out infinite;
  animation-delay: var(--delay);
}
@keyframes dustFloat {
  0% {
    transform: translate3d(0,25px,0);
    opacity: 0;
  }
  20% { opacity: 0.7; }
  50% {
    transform: translate3d(35px,-25px,0);
    opacity: 0.85;
  }
  80% { opacity: 0.5; }
  100% {
    transform: translate3d(-15px,-75px,0);
    opacity: 0;
  }
}
.cabin.dark .dust-particle {
  background: rgba(255,195,110,0.8);
  box-shadow: 0 0 9px rgba(255,160,60,0.5);
}
/* 마우스 후광 */
.cursor-glow {
  position: absolute;
  left: 0;
  top: 0;
  width: 190px;
  height: 190px;
  border-radius: 50%;
  pointer-events: none;
  z-index: 6;
  background: radial-gradient(
    circle,
    rgba(255,217,125,0.23),
    rgba(255,177,64,0.11) 30%,
    rgba(255,153,50,0.04) 55%,
    transparent 75%
  );
  opacity: 0;
  transform: translate(-50%, -50%);
  transition: opacity 0.5s ease;
  will-change: transform;
}
.cabin.dark .cursor-glow.active {
  opacity: 1;
}
/* 랜턴 클릭 영역 */
.lantern {
  position: absolute;
  z-index: 10;
  left: 61.8%;
  top: 0.2%;
  width: 8.2%;
  height: 25%;
  padding: 0;
  border: none;
  border-radius: 45%;
  background: transparent;
  cursor: pointer;
}
/* 갑판으로 나가는 오른쪽 문 */
.cabin-door {
  position: absolute;
  z-index: 11;
  left: 89%;
  top: 18%;
  width: 11%;
  height: 75%;
  display: block;
  background: transparent;
  text-decoration: none;
  cursor: pointer;
}
/*
  지도 클릭 영역
  현재는 임시 위치입니다.
  실제 선장실 이미지의 지도 위치에 맞춰
  아래 숫자 네 개를 조정하세요.
*/
.cabin-map {
  position: absolute;
  z-index: 12;
  left: 32%;
  top: 57%;
  width: 18%;
  height: 19%;
  display: block;
  background: transparent;
  text-decoration: none;
  cursor: pointer;
}
/* 평소에는 클릭 영역이 보이지 않음 */
.lantern:focus-visible,
.cabin-door:focus-visible,
.cabin-map:focus-visible {
  outline: 2px solid #f3d18b;
  outline-offset: 3px;
}
/* 입장 및 전환 공통 글씨 */
.entrance,
.deck-transition,
.map-transition {
  position: fixed;
  inset: 0;
  background: #100e0b;
}
.entrance {
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  animation: entranceFade 3.4s ease-in-out forwards;
}
.entrance-title,
.deck-title,
.map-title {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
  font-family: "YoonChoWooSan", sans-serif;
  font-size: clamp(28px, 3vw, 42px);
  font-weight: normal;
  color: #f3d18b;
  letter-spacing: 0.45em;
  padding-left: 0.45em;
  text-shadow:
    0 0 10px rgba(255,199,91,0.45),
    0 0 25px rgba(220,145,40,0.2);
}
.entrance-title::before,
.entrance-title::after,
.deck-title::before,
.deck-title::after,
.map-title::before,
.map-title::after {
  content: "";
  display: block;
  width: clamp(230px,30vw,380px);
  height: 1px;
  background: linear-gradient(
    90deg,
    transparent,
    #d8ae62 20%,
    #f3d18b 50%,
    #d8ae62 80%,
    transparent
  );
  box-shadow: 0 0 8px rgba(255,195,90,0.35);
}
.entrance-title {
  animation: titleAppear 2.5s ease-in-out forwards;
}
@keyframes titleAppear {
  0% {
    opacity: 0;
    transform: translateY(10px);
    filter: blur(4px);
  }
  12%, 85% {
    opacity: 1;
    transform: translateY(0);
    filter: blur(0);
  }
  100% {
    opacity: 0;
    transform: translateY(-6px);
    filter: blur(2px);
  }
}
@keyframes entranceFade {
  0%, 65% { opacity: 1; }
  100% {
    opacity: 0;
    visibility: hidden;
  }
}
/* 갑판 전환 */
.deck-transition {
  z-index: 200;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.deck-transition.active {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}
.deck-intro {
  position: absolute;
  inset: 0;
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #100e0b;
  opacity: 1;
  transition: opacity 0.2s ease;
}
.deck-title { opacity: 0; }
.deck-transition.active .deck-title {
  animation: titleAppear 2.5s ease-in-out forwards;
}
.deck-transition.show-images .deck-intro {
  opacity: 0;
  pointer-events: none;
}
.deck-images {
  position: absolute;
  inset: 0;
  overflow: hidden;
}
.deck-image {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transform: scale(1);
  transition:
    opacity 0.2s ease-in-out,
    transform 0.6s ease-out;
}
.deck-image.visible {
  opacity: 1;
  transform: scale(1.06);
}
.deck-image.past {
  opacity: 0;
  transform: scale(1.12);
}
.deck-blackout {
  position: absolute;
  inset: 0;
  z-index: 5;
  background: #100e0b;
  opacity: 0;
  transition: opacity 0.35s ease-in-out;
}
.deck-transition.blackout .deck-blackout {
  opacity: 1;
}
/* 지도 전환: 글씨가 나온 뒤 지도 페이지 이동 */
.map-transition {
  z-index: 210;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.map-transition.active {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}
.map-title { opacity: 0; }
.map-transition.active .map-title {
  animation: titleAppear 2.5s ease-in-out forwards;
}
@media (hover: none) {
  .cursor-glow { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .entrance,
  .dust-particle,
  .cursor-glow {
    display: none;
  }
  .night,
  .darkness,
  .lantern-glow,
  .deck-image {
    transition: none;
  }
  .lantern-glow { animation: none; }
}

/* 선장실 UI: 기존 배경 및 클릭 영역은 유지 */
.captain-ui { position:absolute; inset:0; z-index:30; pointer-events:none; font-family:"YoonChoWooSan", "Malgun Gothic", sans-serif; color:#f4dfb3; }
.captain-ui button, .captain-ui a, .captain-profile { pointer-events:auto; }
.captain-ui [hidden] { display:none !important; }
.captain-topbar { position:absolute; top:10px; left:18px; right:18px; min-height:43px; display:flex; align-items:center; justify-content:flex-end; gap:12px; padding:4px 8px; border:1px solid rgba(214,176,110,.38); border-radius:8px; background:rgba(24,16,12,.23); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); box-shadow:0 2px 14px rgba(0,0,0,.12); }
.captain-auth { padding:8px 16px; border:1px solid rgba(218,179,105,.75); border-radius:6px; background:rgba(31,20,13,.4); color:#f2d69c; text-decoration:none; cursor:pointer; font:inherit; font-size:14px; }
.captain-auth:hover, .captain-edit:hover { background:rgba(105,70,30,.55); }
.captain-profile { position:absolute; top:64px; left:20px; width:min(310px,calc(100vw - 40px)); border:1px solid rgba(221,178,99,.68); border-radius:12px; background:rgba(27,18,12,.47); box-shadow:0 8px 28px rgba(0,0,0,.22); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); overflow:hidden; }
.captain-profile-toggle { display:flex; align-items:center; justify-content:space-between; width:100%; padding:13px 16px; border:0; background:rgba(130,88,37,.15); color:#f5d99c; font:inherit; font-size:16px; cursor:pointer; }
.captain-profile-toggle:hover { background:rgba(170,119,50,.22); }
.captain-profile-arrow { display:inline-block; transition:transform .35s ease; transform:rotate(0deg); }
.captain-profile.is-collapsed .captain-profile-arrow { transform:rotate(180deg); }
.captain-profile-content { display:grid; grid-template-rows:1fr; opacity:1; visibility:visible; transition:grid-template-rows .38s ease, opacity .3s ease, visibility .38s; border-top:1px solid rgba(205,161,90,.25); }
.captain-profile-content-inner { min-height:0; overflow:hidden; text-align:center; padding:15px 18px 18px; transition:padding .38s ease; }
.captain-profile.is-collapsed .captain-profile-content { grid-template-rows:0fr; opacity:0; visibility:hidden; }
.captain-profile.is-collapsed .captain-profile-content-inner { padding-top:0; padding-bottom:0; }
.captain-avatar { display:block; width:94px; height:94px; margin:2px auto 12px; border:2px solid #d6b270; border-radius:50%; object-fit:cover; background:#3b2818; }
.captain-nickname { margin:0; font-size:22px; color:#f8dfa9; }
.captain-major { margin:7px 0 0; font-size:14px; color:#d6b986; }
.captain-bio { margin:14px 0; font-size:14px; line-height:1.75; color:#f0d7b0; white-space:pre-wrap; overflow-wrap:anywhere; }
.captain-profile-links { display:flex; flex-wrap:wrap; justify-content:center; gap:9px; }
.captain-edit { display:inline-block; padding:7px 12px; border:1px solid rgba(211,169,98,.7); border-radius:6px; color:#f1d59d; text-decoration:none; font:inherit; font-size:13px; background:rgba(92,62,32,.35); }
.captain-status { margin:10px 0 0; font-size:12px; color:#e4c28c; }
@media (max-width:600px) { .captain-topbar { left:10px; right:10px; } .captain-profile { top:62px; left:12px; width:min(270px,calc(100vw - 24px)); } .captain-profile-content-inner { padding:12px; } .captain-avatar { width:72px; height:72px; } }
@media (prefers-reduced-motion:reduce) { .captain-profile-content, .captain-profile-content-inner, .captain-profile-arrow { transition:none; } }

/* 입장 타이틀이 사라진 직후, 프로필이 왼쪽에서 부드럽게 등장 */
@keyframes captainProfileEnter {
  0% { opacity:0; transform:translate3d(-115%, 0, 0); }
  65% { opacity:1; }
  100% { opacity:1; transform:translate3d(0, 0, 0); }
}
.captain-profile {
  animation: captainProfileEnter 0.9s cubic-bezier(.22, 1, .36, 1) 3.35s both;
}
@media (prefers-reduced-motion:reduce) {
  .captain-profile { animation:none; }
}
</style>
</head>
<body>
<!-- 선장실 입장 -->
<div class="entrance" aria-hidden="true">
  <div class="entrance-title">선장실</div>
</div>
<main class="cabin" id="cabin">
  <img
    class="scene-image day"
    src="./captain-day.webp"
    alt="낮의 선장실"
  >
  <img
    class="scene-image night"
    src="./captain-night.webp"
    alt="밤의 선장실"
  >
  <div class="darkness" aria-hidden="true"></div>
  <div class="lantern-glow" aria-hidden="true"></div>
  <div class="dust-container" id="dust-container" aria-hidden="true"></div>
  <div class="cursor-glow" id="cursor-glow" aria-hidden="true"></div>
  <button
    class="lantern"
    id="lantern"
    type="button"
    aria-label="랜턴 켜기 또는 끄기"
    aria-pressed="false"
  ></button>
  <!-- 기존 갑판 이동 -->
  <a
    class="cabin-door"
    href="/crew.html"
    aria-label="갑판으로 나가기"
  ></a>
  <!-- 새 지도 이동 -->
  <a
    class="cabin-map"
    href="/map/"
    aria-label="지도 펼치기"
  ></a>

  <!-- 선장 프로필 및 관리자 로그인 UI -->
  <div class="captain-ui">
    <nav class="captain-topbar" aria-label="관리자 메뉴">
      <a class="captain-auth" id="captain-login" href="/login/">로그인</a>
      <button class="captain-auth" id="captain-logout" type="button" hidden>로그아웃</button>
    </nav>
    <section class="captain-profile" id="captain-profile" aria-label="선장 프로필">
      <button class="captain-profile-toggle" id="captain-profile-toggle" type="button" aria-expanded="true" aria-controls="captain-profile-content">
        <span>⚜ 선장의 기록</span><span id="captain-profile-arrow" class="captain-profile-arrow" aria-hidden="true">⌃</span>
      </button>
      <div class="captain-profile-content" id="captain-profile-content">
        <div class="captain-profile-content-inner">
        <img class="captain-avatar" id="captain-avatar" src="/assets/images/default-avatar.png" alt="선장 프로필 사진">
        <h2 class="captain-nickname" id="captain-nickname">골목대장</h2>
        <p class="captain-major" id="captain-major" hidden></p>
        <p class="captain-bio" id="captain-bio">선장의 항해 기록을 준비하고 있습니다.</p>
        <div class="captain-profile-links">
          <a class="captain-edit" id="captain-edit" href="/profile/settings/" hidden>프로필 수정</a>
        </div>
        <p class="captain-status" id="captain-status" hidden></p>
        </div>
      </div>
    </section>
  </div>
</main>
<!-- 갑판 전환 -->
<div class="deck-transition" id="deck-transition" aria-hidden="true">
  <div class="deck-images">
    <img class="deck-image" src="./deck-01.png" alt="">
    <img class="deck-image" src="./deck-02.png" alt="">
  </div>
  <div class="deck-intro">
    <div class="deck-title">갑판</div>
  </div>
  <div class="deck-blackout"></div>
</div>
<!-- 지도 전환 -->
<div class="map-transition" id="map-transition" aria-hidden="true">
  <div class="map-title">지도</div>
</div>
<script>
"use strict";
/* 랜턴 */
const cabin = document.getElementById("cabin");
const lantern = document.getElementById("lantern");
const reducedMotion = window.matchMedia(
  "(prefers-reduced-motion: reduce)"
);
let isDark = false;
lantern.addEventListener("click", () => {
  isDark = !isDark;
  cabin.classList.toggle("dark", isDark);
  lantern.setAttribute("aria-pressed", String(isDark));
});
/* 먼지 */
function createDust() {
  if (reducedMotion.matches) return;
  const container = document.getElementById("dust-container");
  for (let i = 0; i < 75; i++) {
    const dust = document.createElement("span");
    dust.className = "dust-particle";
    dust.style.setProperty("--x", Math.random() * 100 + "%");
    dust.style.setProperty("--y", Math.random() * 100 + "%");
    dust.style.setProperty("--size", (Math.random() * 2.5 + 1) + "px");
    dust.style.setProperty("--duration", (Math.random() * 10 + 9) + "s");
    dust.style.setProperty("--delay", (-Math.random() * 20) + "s");
    container.appendChild(dust);
  }
}
/* 마우스 후광 */
const cursorGlow = document.getElementById("cursor-glow");
let mouseX = 0;
let mouseY = 0;
let glowX = 0;
let glowY = 0;
let glowStarted = false;
cabin.addEventListener("pointermove", (event) => {
  if (event.pointerType !== "mouse") return;
  const rect = cabin.getBoundingClientRect();
  mouseX = event.clientX - rect.left;
  mouseY = event.clientY - rect.top;
  if (!glowStarted) {
    glowX = mouseX;
    glowY = mouseY;
    glowStarted = true;
  }
  cursorGlow.classList.add("active");
});
cabin.addEventListener("pointerleave", () => {
  cursorGlow.classList.remove("active");
});
function animateGlow() {
  if (glowStarted) {
    glowX += (mouseX - glowX) * 0.45;
    glowY += (mouseY - glowY) * 0.45;
    cursorGlow.style.transform =
      `translate(${glowX - 95}px, ${glowY - 95}px)`;
  }
  requestAnimationFrame(animateGlow);
}
/* 갑판 이동 */
const cabinDoor = document.querySelector(".cabin-door");
const deckTransition = document.getElementById("deck-transition");
const deckImages = document.querySelectorAll(".deck-image");
/* 지도 이동 */
const cabinMap = document.querySelector(".cabin-map");
const mapTransition = document.getElementById("map-transition");
let isLeaving = false;
cabinDoor.addEventListener("click", (event) => {
  event.preventDefault();
  if (isLeaving) return;
  isLeaving = true;
  const destination = cabinDoor.href;
  if (reducedMotion.matches) {
    window.location.href = destination;
    return;
  }
  deckTransition.classList.add("active");
  deckTransition.setAttribute("aria-hidden", "false");
  deckImages[0].classList.add("visible");
  setTimeout(() => {
    deckTransition.classList.add("show-images");
  }, 2500);
  setTimeout(() => {
    deckImages[0].classList.remove("visible");
    deckImages[0].classList.add("past");
    deckImages[1].classList.add("visible");
  }, 2900);
  setTimeout(() => {
    deckTransition.classList.add("blackout");
  }, 3400);
  setTimeout(() => {
    window.location.href = destination;
  }, 3800);
});
cabinMap.addEventListener("click", (event) => {
  event.preventDefault();
  if (isLeaving) return;
  isLeaving = true;
  const destination = cabinMap.href;
  if (reducedMotion.matches) {
    window.location.href = destination;
    return;
  }
  mapTransition.classList.add("active");
  mapTransition.setAttribute("aria-hidden", "false");
  setTimeout(() => {
    window.location.href = destination;
  }, 2500);
});
createDust();
if (window.matchMedia(
  "(hover: hover) and (prefers-reduced-motion: no-preference)"
).matches) {
  animateGlow();
}
</script>

<!-- Supabase 라이브러리와 기존 프로젝트 설정 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/assets/js/supabase-config.js"></script>
<script>
(async function initCaptainProfile() {
  const $ = (id) => document.getElementById(id);
  const panel = $("captain-profile");
  const toggle = $("captain-profile-toggle");
  const fallbackAvatar = "/assets/images/default-avatar.png";
  toggle.addEventListener("click", () => {
    const collapsed = panel.classList.toggle("is-collapsed");
    toggle.setAttribute("aria-expanded", String(!collapsed));
  });
  $("captain-avatar").addEventListener("error", function () {
    if (!this.dataset.fallbackTried) {
      this.dataset.fallbackTried = "1";
      this.src = fallbackAvatar;
    }
  });
  function showStatus(message) {
    $("captain-status").hidden = false;
    $("captain-status").textContent = message;
  }
  if (!window.supabase || !window.SUPABASE_URL || !window.SUPABASE_PUBLISHABLE_KEY) {
    showStatus("프로필 연결 설정을 확인해 주세요.");
    return;
  }
  const client = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_PUBLISHABLE_KEY);
  $("captain-logout").addEventListener("click", async () => {
    const { error } = await client.auth.signOut();
    if (error) { alert("로그아웃에 실패했습니다: " + error.message); return; }
    window.location.reload();
  });
  try {
    const { data: userData, error: authError } = await client.auth.getUser();
    if (authError) console.warn("로그인 상태 확인:", authError.message);
    const loggedIn = !authError && !!userData?.user;
    $("captain-login").hidden = loggedIn;
    $("captain-logout").hidden = !loggedIn;
    $("captain-edit").hidden = !loggedIn;
  } catch (error) {
    console.warn("로그인 상태 확인 실패:", error);
  }
  // 공개 프로필은 로그인 여부와 관계없이 조회합니다.
  try {
    const { data: profile, error: profileError } = await client
      .from("profiles")
      .select("nickname, major, bio, avatar_url")
      .limit(1)
      .maybeSingle();
    if (profileError) throw profileError;
    if (!profile) {
      showStatus("저장된 프로필이 없습니다. 로그인 후 프로필 설정에서 저장해 주세요.");
      return;
    }
    $("captain-nickname").textContent = profile.nickname || "골목대장";
    $("captain-bio").textContent = profile.bio || "선장의 항해 기록을 준비하고 있습니다.";
    if (profile.major) {
      $("captain-major").textContent = profile.major;
      $("captain-major").hidden = false;
    }
    if (profile.avatar_url && /^https:\/\//i.test(profile.avatar_url)) {
      $("captain-avatar").src = profile.avatar_url;
    }
  } catch (error) {
    console.error("선장 프로필 로딩 오류:", error);
    showStatus("프로필 조회 오류: " + (error.message || "알 수 없는 오류"));
  }
})();
</script>
</body>
</html>
