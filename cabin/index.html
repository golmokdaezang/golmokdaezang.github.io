
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Grand Security Line | 선장실</title>

  <style>
    /* =========================
       1. 한국어 손글씨 폰트
    ========================= */

    @font-face {
      font-family: 'YoonChoWooSan';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408@1.0/YoonChildfundkoreaManSeh.woff2') format('woff2');
      font-weight: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #100b08;
    }

    body {
      overflow: hidden;
    }

    /* =========================
       2. 선장실 배경
    ========================= */

    .cabin {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      isolation: isolate;
    }

    .scene-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      user-select: none;
    }

    .day {
      z-index: 0;
    }

    .night {
      z-index: 1;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }

    .cabin.dark .night {
      opacity: 1;
    }

    /* =========================
       3. 밤 화면
    ========================= */

    .darkness {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;

      background: rgba(3, 8, 20, 0);
      transition: background 1.5s ease-in-out;
    }

    .cabin.dark .darkness {
      background: rgba(3, 8, 20, 0.08);
    }

    /* =========================
       4. 랜턴 불빛
    ========================= */

    .lantern-glow {
      position: absolute;
      z-index: 3;

      left: 48%;
      top: -14%;
      width: 40%;
      height: 70%;

      border-radius: 50%;
      pointer-events: none;

      background: radial-gradient(
        ellipse at 50% 40%,
        rgba(255, 195, 105, 0.28) 0%,
        rgba(255, 165, 65, 0.12) 30%,
        rgba(255, 130, 30, 0.03) 60%,
        transparent 75%
      );

      opacity: 0;
      mix-blend-mode: screen;
      transition: opacity 1.5s ease-in-out;
    }

    .cabin.dark .lantern-glow {
      opacity: 1;
      animation: lanternFlicker 4s ease-in-out infinite;
    }

    @keyframes lanternFlicker {
      0%, 100% {
        opacity: 0.85;
      }

      35% {
        opacity: 1;
      }

      65% {
        opacity: 0.9;
      }
    }

    /* =========================
       5. 떠다니는 먼지
    ========================= */

    .dust-container {
      position: absolute;
      inset: 0;
      z-index: 5;
      overflow: hidden;
      pointer-events: none;
    }

    .dust-particle {
      position: absolute;

      left: var(--x);
      top: var(--y);

      width: var(--size);
      height: var(--size);

      border-radius: 50%;

      background: rgba(255, 235, 185, 0.9);
      box-shadow: 0 0 7px rgba(255, 216, 143, 0.6);

      opacity: 0;

      animation: dustFloat var(--duration) ease-in-out infinite;
      animation-delay: var(--delay);
    }

    @keyframes dustFloat {
      0% {
        transform: translate3d(0, 25px, 0);
        opacity: 0;
      }

      20% {
        opacity: 0.7;
      }

      50% {
        transform: translate3d(35px, -25px, 0);
        opacity: 0.85;
      }

      80% {
        opacity: 0.5;
      }

      100% {
        transform: translate3d(-15px, -75px, 0);
        opacity: 0;
      }
    }

    .cabin.dark .dust-particle {
      background: rgba(255, 195, 110, 0.8);
      box-shadow: 0 0 9px rgba(255, 160, 60, 0.5);
    }

    /* =========================
       6. 마우스 후광
    ========================= */

    .cursor-glow {
      position: absolute;
      left: 0;
      top: 0;

      width: 190px;
      height: 190px;

      border-radius: 50%;
      pointer-events: none;
      z-index: 6;

      background: radial-gradient(
        circle,
        rgba(255, 217, 125, 0.23) 0%,
        rgba(255, 177, 64, 0.11) 30%,
        rgba(255, 153, 50, 0.04) 55%,
        transparent 75%
      );

      opacity: 0;
      transform: translate(-50%, -50%);
      transition: opacity 0.5s ease;
      will-change: transform;
    }

    .cabin.dark .cursor-glow.active {
      opacity: 1;
    }

    /* =========================
       7. 랜턴 클릭 영역
    ========================= */

    .lantern {
      position: absolute;
      z-index: 10;

      left: 61.8%;
      top: 0.2%;
      width: 8.2%;
      height: 25%;

      padding: 0;
      border: none;
      border-radius: 45%;
      background: transparent;

      cursor: pointer;
    }

    .lantern:focus-visible {
      outline: 2px solid #f6d28b;
      outline-offset: 3px;
    }

    /* =========================
       8. 문 클릭 영역
    ========================= */

    .cabin-door {
      position: absolute;
      z-index: 11;

      /*
        임시 좌표!
        실제 이미지 속 문 위치에 맞춰 수정
      */
      left: 8%;
      top: 25%;
      width: 18%;
      height: 65%;

      display: flex;
      align-items: center;
      justify-content: center;

      text-decoration: none;
      cursor: pointer;
    }

    /* 문 위에 마우스를 올렸을 때 나타나는 글씨 */
    .door-tooltip {
      padding: 10px 18px;

      border: 1px solid rgba(243, 209, 139, 0.6);
      border-radius: 8px;

      background: rgba(18, 12, 8, 0.85);
      color: #f3d18b;

      font-family: 'YoonChoWooSan', sans-serif;
      font-size: clamp(17px, 2vw, 24px);
      white-space: nowrap;

      box-shadow: 0 0 18px rgba(255, 190, 85, 0.18);

      opacity: 0;
      transform: translateY(10px);

      transition:
        opacity 0.3s ease,
        transform 0.3s ease;

      pointer-events: none;
    }

    .cabin-door:hover .door-tooltip,
    .cabin-door:focus-visible .door-tooltip {
      opacity: 1;
      transform: translateY(0);
    }

    .cabin-door:focus-visible {
      outline: 2px solid #f3d18b;
      outline-offset: 3px;
    }

    /* =========================
       9. 선장실 입장 애니메이션
    ========================= */

    .entrance {
      position: fixed;
      inset: 0;
      z-index: 100;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #100e0b;
      pointer-events: none;

      animation: entranceFade 3.4s ease-in-out forwards;
    }

    .entrance-title {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;

      font-family: 'YoonChoWooSan', sans-serif;
      font-size: clamp(28px, 3vw, 42px);
      font-weight: normal;

      color: #f3d18b;
      letter-spacing: 0.45em;
      padding-left: 0.45em;

      text-shadow:
        0 0 10px rgba(255, 199, 91, 0.45),
        0 0 25px rgba(220, 145, 40, 0.2);

      opacity: 0;
      animation: titleAppear 2.5s ease-in-out forwards;
    }

    /* 위아래 금색 가로선 */
    .entrance-title::before,
    .entrance-title::after {
      content: "";
      display: block;

      width: clamp(230px, 30vw, 380px);
      height: 1px;

      background: linear-gradient(
        90deg,
        transparent,
        #d8ae62 20%,
        #f3d18b 50%,
        #d8ae62 80%,
        transparent
      );

      box-shadow: 0 0 8px rgba(255, 195, 90, 0.35);
    }

    @keyframes titleAppear {
      0% {
        opacity: 0;
        transform: translateY(15px);
        filter: blur(5px);
      }

      35%, 70% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }

      100% {
        opacity: 0;
        transform: translateY(-8px);
        filter: blur(3px);
      }
    }

    @keyframes entranceFade {
      0%, 65% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        visibility: hidden;
      }
    }

    /* =========================
       10. 모바일 / 접근성
    ========================= */

    @media (hover: none) {
      .cursor-glow {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .night,
      .darkness,
      .lantern-glow {
        transition: none;
      }

      .lantern-glow,
      .dust-particle {
        animation: none;
      }

      .dust-particle,
      .cursor-glow,
      .entrance {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       선장실 입장 화면
  ========================= -->

  <div class="entrance" aria-hidden="true">
    <div class="entrance-title">
      선장실
    </div>
  </div>

  <!-- =========================
       선장실 본 화면
  ========================= -->

  <main class="cabin" id="cabin">

    <!-- 낮 이미지 -->
    <img
      class="scene-image day"
      src="./captain-day.webp"
      alt="햇빛이 들어오는 낮의 선장실"
    >

    <!-- 밤 이미지 -->
    <img
      class="scene-image night"
      src="./captain-night.webp"
      alt="랜턴 불빛이 비치는 밤의 선장실"
    >

    <!-- 밤 조명 -->
    <div class="darkness" aria-hidden="true"></div>

    <!-- 랜턴 불빛 -->
    <div class="lantern-glow" aria-hidden="true"></div>

    <!-- 먼지 -->
    <div
      class="dust-container"
      id="dust-container"
      aria-hidden="true"
    ></div>

    <!-- 마우스 후광 -->
    <div
      class="cursor-glow"
      id="cursor-glow"
      aria-hidden="true"
    ></div>

    <!-- 랜턴 자체를 클릭 -->
    <button
      class="lantern"
      id="lantern"
      type="button"
      aria-label="랜턴 켜기 또는 끄기"
      aria-pressed="false"
    ></button>

    <!-- 문 자체를 클릭하면 갑판(방명록)으로 이동 -->
    <a
      class="cabin-door"
      href="/crew.html"
      aria-label="갑판으로 나가기"
    >
      <span class="door-tooltip">
        갑판으로 나가기
      </span>
    </a>

  </main>

  <script>
    /* =========================
       1. 랜턴 클릭
    ========================= */

    const cabin = document.getElementById("cabin");
    const lantern = document.getElementById("lantern");

    let isDark = false;

    lantern.addEventListener("click", () => {
      isDark = !isDark;

      cabin.classList.toggle("dark", isDark);

      lantern.setAttribute(
        "aria-pressed",
        String(isDark)
      );
    });

    /* =========================
       2. 먼지 생성
    ========================= */

    function createDust() {
      const container =
        document.getElementById("dust-container");

      if (!container) return;

      if (
        window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches
      ) {
        return;
      }

      const dustCount = 75;

      for (let i = 0; i < dustCount; i++) {
        const dust = document.createElement("span");

        dust.className = "dust-particle";

        dust.style.setProperty(
          "--x",
          Math.random() * 100 + "%"
        );

        dust.style.setProperty(
          "--y",
          Math.random() * 100 + "%"
        );

        dust.style.setProperty(
          "--size",
          (Math.random() * 2.5 + 1) + "px"
        );

        dust.style.setProperty(
          "--duration",
          (Math.random() * 10 + 9) + "s"
        );

        dust.style.setProperty(
          "--delay",
          (-Math.random() * 20) + "s"
        );

        container.appendChild(dust);
      }
    }

    /* =========================
       3. 마우스 후광
    ========================= */

    const cursorGlow =
      document.getElementById("cursor-glow");

    let mouseX = 0;
    let mouseY = 0;

    let glowX = 0;
    let glowY = 0;

    let glowStarted = false;

    cabin.addEventListener("pointermove", (event) => {
      if (event.pointerType !== "mouse") return;

      const rect = cabin.getBoundingClientRect();

      mouseX = event.clientX - rect.left;
      mouseY = event.clientY - rect.top;

      if (!glowStarted) {
        glowX = mouseX;
        glowY = mouseY;
        glowStarted = true;
      }

      cursorGlow.classList.add("active");
    });

    cabin.addEventListener("pointerleave", () => {
      cursorGlow.classList.remove("active");
    });

    function animateGlow() {
      if (glowStarted) {
        glowX += (mouseX - glowX) * 0.45;
        glowY += (mouseY - glowY) * 0.45;

        cursorGlow.style.transform =
          `translate(${glowX - 95}px, ${glowY - 95}px)`;
      }

      requestAnimationFrame(animateGlow);
    }

    /* =========================
       4. 실행
    ========================= */

    createDust();

    if (
      window.matchMedia(
        "(hover: hover) and (prefers-reduced-motion: no-preference)"
      ).matches
    ) {
      animateGlow();
    }
  </script>

</body>
</html>
