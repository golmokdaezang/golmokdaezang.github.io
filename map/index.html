
<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" type="image/png" href="/assets/images/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Grand Security Line | 해적 지도</title>

  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>

<body>
  <main class="map-page">

    <!-- 지도 -->
    <div class="map-viewport" id="mapViewport">
      <div class="map-track">
        <div class="map-content" id="mapContent">
          <img
            id="mapImage"
            class="map-image"
            src="./security-map.png"
            alt="보안 분야별 해적 지도"
            draggable="false"
          >
        </div>
      </div>
    </div>

    <!-- 돋보기 -->
    <div class="magnifier" id="magnifier" aria-hidden="true">

      <!-- 확대된 지도 -->
      <div class="magnifier-lens" id="magnifierLens">
        <img
          id="magnifierMap"
          src="./security-map.png"
          alt=""
          draggable="false"
        >
      </div>

      <!-- 돋보기 이미지 -->
      <img
        class="magnifier-frame"
        src="./magnifier.png"
        alt=""
        draggable="false"
      >

      <!-- 섬 이름 -->
      <div class="magnifier-label" id="magnifierLabel"></div>

    </div>

    <!-- 선장실 복귀 -->
    <a
      href="/cabin/"
      class="back-link"
      aria-label="선장실로 돌아가기"
      title="선장실로 돌아가기"
    >←</a>

  </main>
</body>
</html>
