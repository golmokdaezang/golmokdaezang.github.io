
<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" type="image/png" href="/assets/images/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Grand Line · World Map</title>

  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>

<body>
  <main class="map-page">
    <div class="desk-title">GRAND LINE · WORLD MAP</div>

    <!-- 지도 -->
    <div class="map-viewport" id="mapViewport">
      <div class="map-track">
        <div class="map-content" id="mapContent">
          <img
            id="mapImage"
            class="map-image"
            src="./security-chart.svg"
            alt="보안 분야별 해적 지도"
            draggable="false"
          >
        </div>
      </div>
    </div>

    <!-- 돋보기 -->
    <div class="magnifier" id="magnifier" aria-hidden="true">

      <!-- 확대된 지도 -->
      <div class="magnifier-lens" id="magnifierLens">
        <img
          id="magnifierMap"
          src="./security-chart.svg"
          alt=""
          draggable="false"
        >
      </div>

      <!-- 돋보기 이미지 -->
      <div class="magnifier-frame"><span class="lens-needle"></span></div>

      <!-- 섬 이름 -->
      <div class="magnifier-label" id="magnifierLabel"></div>

    </div>

    <div class="chart-mini"><div class="mini-track"><span id="marker"></span></div><input id="mini" type="range" min="0" max="100" step="0.1" aria-label="지도 위치"><div class="mini-label"><span>W</span><span>← 좌우로 드래그 →</span><span>E</span></div></div>
    <!-- 선장실 복귀 -->
    <a
      href="/cabin/"
      class="back-link"
      aria-label="선장실로 돌아가기"
      title="선장실로 돌아가기"
    ><span aria-hidden="true">←</span><span>선장실</span></a>

  </main>
</body>
</html>
