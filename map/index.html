
<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" type="image/png" href="/assets/images/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Grand Line · World Map</title>

  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>

<body>
  <main class="map-page">
    <div class="desk-title">GRAND LINE · WORLD MAP</div>

    <!-- 지도 -->
    <div class="map-viewport" id="mapViewport">
      <div class="map-track">
        <div class="map-content" id="mapContent">
          <img
            id="mapImage"
            class="map-image"
            src="./security-chart.svg"
            alt="보안 분야별 해적 지도"
            draggable="false"
          >
        </div>
      </div>
    </div>

    <!-- 돋보기 -->
    <div class="magnifier" id="magnifier" aria-hidden="true">

      <!-- 확대된 지도 -->
      <div class="magnifier-lens" id="magnifierLens">
        <img
          id="magnifierMap"
          src="./security-chart.svg"
          alt=""
          draggable="false"
        >
      </div>

      <!-- 돋보기 이미지 -->
      <div class="magnifier-frame"><span class="lens-needle"></span></div>

      <!-- 섬 이름 -->
      <div class="magnifier-label" id="magnifierLabel"></div>

    </div>

    <div class="chart-mini"><div class="mini-track"><span id="marker"></span></div><input id="mini" type="range" min="0" max="100" step="0.1" aria-label="지도 위치"><div class="mini-label"><span>W</span><span>← 좌우로 드래그 →</span><span>E</span></div></div>
    <!-- 선장실 복귀 -->
    <a
      href="/cabin/"
      class="back-link"
      aria-label="선장실로 돌아가기"
      title="선장실로 돌아가기"
    ><span aria-hidden="true">←</span><span>선장실</span></a>

  </main>
<script>(()=>{if(sessionStorage.getItem('marine-seal-step')!=='2')return;const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','해골 문장');b.style.cssText='position:fixed;right:7%;bottom:13%;width:48px;z-index:50;background:none;border:0;color:#c3dbef;cursor:pointer;filter:drop-shadow(0 0 5px #a9d5ff)';b.innerHTML="<svg viewBox=\"-40 -40 80 80\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle r=\"32\" stroke-width=\"1\"/><circle r=\"28\" stroke-width=\".6\"/><path d=\"M0 -37L3 -32L0 -27L-3 -32Z M0 37L3 32L0 27L-3 32Z\"/><path d=\"M-18 -5Q-22 -23 0 -23Q22 -23 18 -5L10 4V15H-10V4Z M-5 8v7M5 8v7M-19 17L19 25M19 17L-19 25\"/><circle cx=\"-7\" cy=\"-5\" r=\"4\"/><circle cx=\"7\" cy=\"-5\" r=\"4\"/></svg>";document.body.append(b);if(!matchMedia("(prefers-reduced-motion: reduce)").matches)b.animate([{opacity:0},{opacity:1}],{duration:2000,easing:"ease",fill:"both"});b.onclick=()=>{sessionStorage.setItem('marine-seal-step','3');b.style.filter='drop-shadow(0 0 12px white)';};})();</script></body>
</html>
