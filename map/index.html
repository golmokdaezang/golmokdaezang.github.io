
<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" type="image/png" href="/assets/images/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Grand Line · World Map</title>

  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700&display=swap" rel="stylesheet">
</head>

<body>
  <main class="map-page">
    <div class="desk-title">GRAND LINE · WORLD MAP</div>

    <!-- 지도 -->
    <div class="map-viewport" id="mapViewport">
      <div class="map-track">
        <div class="map-content" id="mapContent">
          <img
            id="mapImage"
            class="map-image"
            src="./security-chart.svg"
            alt="보안 분야별 해적 지도"
            draggable="false"
          >
        </div>
      </div>
    </div>

    <!-- 돋보기 -->
    <div class="magnifier" id="magnifier" aria-hidden="true">

      <!-- 확대된 지도 -->
      <div class="magnifier-lens" id="magnifierLens">
        <img
          id="magnifierMap"
          src="./security-chart.svg"
          alt=""
          draggable="false"
        >
      </div>

      <!-- 돋보기 이미지 -->
      <div class="magnifier-frame"><span class="lens-needle"></span></div>

      <!-- 섬 이름 -->
      <div class="magnifier-label" id="magnifierLabel"></div>

    </div>

    <div class="chart-mini"><div class="mini-track"><span id="marker"></span></div><input id="mini" type="range" min="0" max="100" step="0.1" aria-label="지도 위치"><div class="mini-label"><span>W</span><span>← 좌우로 드래그 →</span><span>E</span></div></div>
    <!-- 선장실 복귀 -->
    <a
      href="/cabin/"
      class="back-link"
      aria-label="선장실로 돌아가기"
      title="선장실로 돌아가기"
    ><span aria-hidden="true">←</span><span>선장실</span></a>

  </main>
<script>(()=>{function sealDialogue(message){
  let n=document.getElementById('seal-dialogue');
  if(!n){
    n=document.createElement('div');n.id='seal-dialogue';n.setAttribute('aria-hidden','true');
    n.style.cssText="position:fixed;left:50%;bottom:17%;transform:translate(-50%,8px);z-index:2147483000;width:min(760px,88vw);max-width:88vw;box-sizing:border-box;text-align:center;color:#f3e6ce;font:700 clamp(17px,1.65vw,26px)/1.7 'Nanum Myeongjo',serif;background:transparent url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20600%20100%22%20preserveAspectRatio%3D%22none%22%3E%3Cpath%20d%3D%22M12%201H588Q589%2010%20599%2012V88Q589%2090%20588%2099H12Q11%2090%201%2088V12Q11%2010%2012%201Z%22%20fill%3D%22%2314100d%22%20fill-opacity%3D%22.91%22%20stroke%3D%22%23a58a56%22%20stroke-width%3D%221%22%20vector-effect%3D%22non-scaling-stroke%22%2F%3E%3C%2Fsvg%3E') center/100% 100% no-repeat;border:0;border-radius:0;backdrop-filter:blur(3px);text-shadow:0 1px 3px #0009;box-shadow:none;padding:16px 30px;min-width:min(320px,88vw);pointer-events:none;opacity:0;transition:opacity .8s ease,transform .6s ease;overflow-wrap:break-word;white-space:pre-line";
    document.body.append(n);
    const live=document.createElement('div');live.id='seal-dialogue-live';live.setAttribute('role','status');live.style.cssText='position:fixed;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);pointer-events:none';document.body.append(live);
  }
  clearTimeout(n.startTimer);clearTimeout(n.hideTimer);clearInterval(n.typeTimer);
  n.style.opacity='0';n.style.transform='translate(-50%,8px)';
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const chars=Array.from(message.replace(/ /g,'\n'));
  n.startTimer=setTimeout(()=>{
    document.getElementById('seal-dialogue-live').textContent=message;
    n.textContent='';n.style.transition=reduced?'none':'opacity .8s ease,transform .6s ease';
    n.style.opacity='1';n.style.transform='translate(-50%,0)';
    const finish=()=>{n.hideTimer=setTimeout(()=>{n.style.opacity='0';n.style.transform='translate(-50%, -4px)'},4000)};
    if(reduced){n.textContent=chars.join('');finish();return;}
    let i=0;n.typeTimer=setInterval(()=>{n.textContent=chars.slice(0,++i).join('');if(i>=chars.length){clearInterval(n.typeTimer);finish()}},42);
  },400);
};if(sessionStorage.getItem('marine-seal-step')!=='2')return;const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','해골 문장');b.style.cssText='position:fixed;right:7%;bottom:13%;width:48px;z-index:50;background:none;border:0;color:#c3dbef;cursor:pointer;filter:drop-shadow(0 0 5px #a9d5ff)';b.innerHTML="<svg viewBox=\"-40 -40 80 80\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle r=\"32\" stroke-width=\"1\"/><circle r=\"28\" stroke-width=\".6\"/><path d=\"M0 -37L3 -32L0 -27L-3 -32Z M0 37L3 32L0 27L-3 32Z\"/><path d=\"M-18 -5Q-22 -23 0 -23Q22 -23 18 -5L10 4V15H-10V4Z M-5 8v7M5 8v7M-19 17L19 25M19 17L-19 25\"/><circle cx=\"-7\" cy=\"-5\" r=\"4\"/><circle cx=\"7\" cy=\"-5\" r=\"4\"/></svg>";document.body.append(b);if(!matchMedia("(prefers-reduced-motion: reduce)").matches)b.animate([{opacity:0},{opacity:1}],{duration:2000,easing:"ease",fill:"both"});b.onclick=()=>{sessionStorage.setItem('marine-seal-step','3');b.style.filter='drop-shadow(0 0 12px white)';sealDialogue('쿠르르륵…… 선장실 쪽에서 무언가 움직이는 소리가 들린다.');};})();</script></body>
</html>
