
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Grand Security Line | 지도</title>

  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>

  <main class="map-page">

    <div class="map-viewport" id="mapViewport">

      <div class="map-track">

        <div class="map-content" id="mapContent">

          <img
            id="mapImage"
            class="map-image"
            src="./security-map.png"
            alt="Grand Security Line 해적 지도"
            draggable="false"
          >

          <!-- 섬 클릭 영역은 JavaScript에서 생성 -->

        </div>

      </div>

    </div>

    <a
      href="/cabin/"
      class="back-link"
      aria-label="선장실로 돌아가기"
      title="선장실로 돌아가기"
    >←</a>

  </main>

</body>
</html>
