<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>비밀 공간</title><link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#080b0d;color:#f3e6ce;font-family:'Nanum Myeongjo',serif}main{height:100dvh;display:grid;place-items:center;position:relative;overflow:hidden;animation:appear 1.4s both}.room-art{position:relative;width:min(100vw,177.577045696068dvh);aspect-ratio:1671/941}.scene{width:100%;height:100%;display:block}.terminal{position:absolute;left:40.5%;top:30%;width:20%;height:27%;border-radius:8%;background:transparent;cursor:pointer;transition:box-shadow .3s}.terminal:hover,.terminal:focus-visible{box-shadow:0 0 22px #6ef8af88,inset 0 0 18px #6ef8af66;outline:1px solid #a0f5c7}.reveal{position:fixed;bottom:17%;left:50%;transform:translateX(-50%);width:min(760px,88vw);text-align:center;padding:18px 30px;background:rgba(20,16,13,.91);border:1px solid #a58a56;border-radius:0; font:400 clamp(17px,1.65vw,26px)/1.7 'Nanum Myeongjo',serif;opacity:0;transition:opacity .8s;pointer-events:none;min-height:65px;backdrop-filter:blur(3px)}.back{position:fixed;left:20px;top:20px;color:#e6d8b9;text-decoration:none;font-size:14px;z-index:2;background:#17120dcc;padding:9px 14px;border:1px solid #8b7454}@keyframes appear{from{opacity:0}to{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.room-art{transform-origin:50.5% 43.5%;transition:transform 1.25s cubic-bezier(.45,.02,.85,1),filter 1.25s ease}.entering .room-art{transform:scale(8);filter:brightness(1.25) hue-rotate(85deg)}.entering .back,.entering .reveal{opacity:0!important;pointer-events:none}.portal-fade{position:fixed;inset:0;background:#10243e;opacity:0;pointer-events:none;z-index:10;transition:opacity .45s ease}.portal-fade.active{opacity:1;pointer-events:auto;animation:portal-color .45s linear both}@keyframes portal-color{from{background:#092d28}to{background:#10243e}}
</style><script>if(sessionStorage.getItem('marine-room-discovered')!=='1'||sessionStorage.getItem('marine-seal-step')!=='3')location.replace('../cabin/');</script></head><body><main><a class="back" href="../cabin/">〈 선장실로 돌아가기</a><div class="room-art"><img class="scene" src="room.webp" alt="해군 비밀 정보실과 구형 컴퓨터"><a class="terminal" href="../blog/" aria-label="MARINE OS 블로그 열기"></a></div><div class="reveal" role="status"></div></main><script>const n=document.querySelector('.reveal');const message='선장의 비밀은…… 사실 잠입 수사 중인 해군이었다!';if(sessionStorage.getItem('marine-room-reveal-shown')!=='1')setTimeout(()=>{sessionStorage.setItem('marine-room-reveal-shown','1');n.style.opacity='1';const chars=Array.from(message);let i=0;function finish(){setTimeout(()=>n.style.opacity='0',5000)}if(matchMedia('(prefers-reduced-motion: reduce)').matches){n.textContent=message;finish();return}const t=setInterval(()=>{n.textContent=chars.slice(0,++i).join('');if(i>=chars.length){clearInterval(t);finish()}},55)},1600);
const terminal=document.querySelector('.terminal');let entering=false;terminal.addEventListener('click',e=>{if(e.ctrlKey||e.metaKey||e.shiftKey||e.altKey)return;e.preventDefault();if(entering)return;entering=true;if(matchMedia('(prefers-reduced-motion: reduce)').matches){location.assign(terminal.href);return;}document.querySelector('main').classList.add('entering');const fade=document.createElement('div');fade.className='portal-fade';document.body.append(fade);setTimeout(()=>fade.classList.add('active'),900);setTimeout(()=>location.assign(terminal.href),1350);});window.addEventListener('pageshow',e=>{if(e.persisted){entering=false;document.querySelector('main').classList.remove('entering');document.querySelector('.portal-fade')?.remove();}});</script></body></html>
