
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WANTED | Grand Security Line</title>

  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Noto+Serif+KR:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 55px 32px;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(0,0,0,.2) 0px,
          transparent 3px,
          transparent 110px,
          rgba(0,0,0,.3) 114px
        ),
        repeating-linear-gradient(
          90deg,
          #2b1b13 0px,
          #493020 130px,
          #302016 260px
        );
      color: #3d2416;
      font-family: 'Noto Serif KR', serif;
    }

    .poster {
      position: relative;
      max-width: 950px;
      min-height: 670px;
      margin: 0 auto;
      padding: 65px 65px 55px;
      text-align: center;
      background:
        radial-gradient(
          ellipse at 50% 40%,
          #f1d6a0 0%,
          #dfb77e 68%,
          #a97442 100%
        );
      box-shadow:
        0 18px 45px rgba(0,0,0,.6),
        inset 0 0 45px rgba(94,48,18,.3);
      clip-path: polygon(
        0% 2%, 8% 0%, 18% 1%,
        30% 0%, 42% 1%, 55% 0%,
        70% 1%, 85% 0%, 100% 2%,
        99% 20%, 100% 45%,
        99% 70%, 100% 98%,
        90% 100%, 75% 99%,
        60% 100%, 45% 99%,
        30% 100%, 15% 99%,
        0% 98%, 1% 70%,
        0% 40%
      );
    }

    .poster::before {
      content: "";
      position: absolute;
      inset: 16px;
      border: 2px solid rgba(77,42,19,.4);
      pointer-events: none;
    }

    .wanted {
      margin: 0;
      font-family: 'Pirata One', serif;
      font-size: clamp(65px, 12vw, 115px);
      line-height: 1;
      color: #672719;
      text-shadow: 2px 3px rgba(70,31,17,.12);
    }

    .brand {
      margin: 14px 0 30px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 4px;
    }

    .description {
      margin: 30px 0 35px;
      font-size: 19px;
      font-weight: 700;
    }

    .table-wrap {
      width: 100%;
      border: 2px solid #654025;
      background: rgba(255,237,197,.2);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 18px 12px;
      border-bottom: 1px solid rgba(82,46,23,.45);
    }

    th {
      background: rgba(100,55,25,.13);
      font-size: 17px;
    }

    td {
      font-size: 16px;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    th:first-child,
    td:first-child {
      width: 90px;
    }

    th:last-child,
    td:last-child {
      width: 150px;
    }

    .footer-note {
      margin-top: 27px;
      font-size: 13px;
      opacity: .8;
    }

    .back-button {
      display: inline-block;
      margin-top: 35px;
      padding: 12px 28px;
      border: 2px solid #5b351f;
      color: #482818;
      text-decoration: none;
      font-weight: 700;
      transition: .2s;
    }

    .back-button:hover {
      background: #5b351f;
      color: #f4d9a6;
    }

    /* 오른쪽에서 날아오는 칼 */
    .sword {
      position: absolute;
      top: 185px;
      right: -300px;
      width: 260px;
      height: 55px;
      z-index: 5;
      pointer-events: none;
      transform: rotate(-25deg);
      animation: swordFly 1.1s ease-out forwards;
      animation-delay: .5s;
    }

    .blade {
      position: absolute;
      left: 0;
      top: 18px;
      width: 190px;
      height: 17px;
      background: linear-gradient(
        #a4a4a4,
        #f1f1f1 45%,
        #777
      );
      clip-path: polygon(
        0 50%,
        20% 0,
        100% 0,
        100% 100%,
        20% 100%
      );
      border-radius: 2px;
    }

    .handle {
      position: absolute;
      right: 0;
      top: 10px;
      width: 75px;
      height: 32px;
      background: #442819;
      border: 5px solid #ad7b35;
      border-radius: 20px;
    }

    @keyframes swordFly {
      0% {
        right: -300px;
        opacity: 0;
        transform: rotate(-25deg);
      }

      75% {
        right: 5px;
        opacity: 1;
        transform: rotate(-25deg);
      }

      88% {
        right: 15px;
        transform: rotate(-22deg);
      }

      100% {
        right: 10px;
        opacity: 1;
        transform: rotate(-25deg);
      }
    }

    @media (max-width: 650px) {
      body {
        padding: 25px 12px;
      }

      .poster {
        padding: 55px 18px 40px;
      }

      .description {
        font-size: 15px;
      }

      th, td {
        padding: 13px 6px;
        font-size: 13px;
      }

      .sword {
        top: 140px;
        transform: scale(.6) rotate(-25deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .sword {
        animation: none;
        right: 10px;
      }
    }
  </style>
</head>

<body>
  <main class="poster">

    <div class="sword" aria-hidden="true">
      <div class="blade"></div>
      <div class="handle"></div>
    </div>

    <h1 class="wanted">WANTED</h1>

    <p class="brand">GRAND SECURITY LINE</p>

    <p class="description">
      가장 많이 항해한 방문자들의 기록입니다.
    </p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>순위</th>
            <th>닉네임</th>
            <th>방문 횟수</th>
          </tr>
        </thead>
        <tbody id="crew-ranking">
          <tr>
            <td colspan="3">
              항해자 명부를 불러오는 중...
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <p class="footer-note" id="crew-status" role="status">
      방문 횟수 기준 · 동점 시 최근 방문자 우선
    </p>

    <a class="back-button" href="/blog/">
      ← 블로그로 돌아가기
    </a>

  </main>

  <script>
    (async function loadCrewLeaderboard() {
      const tbody = document.getElementById("crew-ranking");
      const status = document.getElementById("crew-status");

      const url =
        "https://zdgopdrehbphshdptjjr.supabase.co/functions/v1/quick-responder";

      try {
        const response = await fetch(url, {
          method: "GET",
          headers: {
            "Accept": "application/json"
          }
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const result = await response.json();
        const leaderboard = result.leaderboard;

        if (!Array.isArray(leaderboard)) {
          throw new Error("잘못된 응답 형식");
        }

        tbody.replaceChildren();

        if (leaderboard.length === 0) {
          const row = tbody.insertRow();
          const cell = row.insertCell();

          cell.colSpan = 3;
          cell.textContent =
            "아직 등록된 항해자가 없습니다.";
          return;
        }

        leaderboard.slice(0, 10).forEach((visitor, index) => {
          const row = tbody.insertRow();

          const rank = row.insertCell();
          const nickname = row.insertCell();
          const count = row.insertCell();

          rank.textContent =
            String(index + 1).padStart(2, "0");

          nickname.textContent = visitor.nickname;

          count.textContent =
            `${visitor.visit_count}회`;
        });

        status.textContent =
          "방문 횟수 기준 · 동점 시 최근 방문자 우선";

      } catch (error) {
        console.error("TOP 10 조회 실패:", error);

        tbody.replaceChildren();

        const row = tbody.insertRow();
        const cell = row.insertCell();

        cell.colSpan = 3;
        cell.textContent =
          "항해자 명부를 불러오지 못했습니다.";

        status.textContent =
          "잠시 후 다시 시도해 주세요.";
      }
    })();
  </script>
</body>
</html>
