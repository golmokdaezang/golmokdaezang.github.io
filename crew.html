
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WANTED | Grand Security Line</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 12px;
      overflow-x: hidden;

      background-color: #392519;
      background-image: url("/voyage/background.png");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;

      font-family: "Noto Serif KR", serif;
      color: #402719;
    }

    /* =========================
       양피지 전체 영역
    ========================= */

    .scene {
      position: relative;
      width: min(100%, 1120px);
      margin: 0 auto;
      isolation: isolate;
    }

    .poster {
      position: relative;
      width: 92%;
      min-height: 730px;
      margin: 0 auto;
      padding: 105px 12% 130px;
      text-align: center;
      filter: drop-shadow(5px 12px 8px rgba(0,0,0,.25));
    }

    /*
       양피지 위쪽은 고정.
       못도 원본 이미지에 포함되어 있으므로 움직이지 않음.
    */

    .paper-top,
    .paper-bottom {
      position: absolute;
      inset: 0;

      background-image: url("/voyage/parchment.png");
      background-position: center;
      background-size: 100% 100%;
      background-repeat: no-repeat;

      pointer-events: none;
    }

    .paper-top {
      z-index: 0;
      clip-path: inset(0 0 24.5% 0);
    }

    /*
       아래쪽 25%만 강하게 펄럭임.
    */

    .paper-bottom {
      z-index: 1;
      clip-path: inset(75% 0 0 0);

      transform-origin: center 75%;
      animation: strongFlutter 2.2s ease-in-out infinite;

      will-change: transform;
    }

    @keyframes strongFlutter {
      0%, 100% {
        transform:
          perspective(650px)
          rotateX(0deg)
          rotateZ(0deg)
          translateX(0);
      }

      20% {
        transform:
          perspective(650px)
          rotateX(22deg)
          rotateZ(2deg)
          translateX(14px);
      }

      40% {
        transform:
          perspective(650px)
          rotateX(-13deg)
          rotateZ(-1.5deg)
          translateX(-12px);
      }

      60% {
        transform:
          perspective(650px)
          rotateX(27deg)
          rotateZ(2.5deg)
          translateX(18px);
      }

      80% {
        transform:
          perspective(650px)
          rotateX(-10deg)
          rotateZ(-1deg)
          translateX(-8px);
      }
    }

    /* =========================
       양피지 안쪽 내용
    ========================= */

    .content {
      position: relative;
      z-index: 2;
    }

    .wanted {
      margin: 0;
      font-family: "Pirata One", Georgia, serif;
      font-size: clamp(55px, 8vw, 92px);
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: 2px;
      color: #642d1d;
    }

    .brand {
      margin: 10px 0 26px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
    }

    .description {
      margin: 0 0 27px;
      font-size: clamp(14px, 1.8vw, 18px);
      font-weight: 700;
    }

    /* =========================
       방문자 순위표
    ========================= */

    .ranking {
      width: 100%;
      border: 1px solid rgba(91,52,28,.65);
      background: rgba(235,201,151,.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      padding: 13px 7px;
      border-bottom: 1px solid rgba(83,48,26,.3);
      overflow-wrap: anywhere;
    }

    th {
      background: rgba(102,59,30,.12);
      font-size: 15px;
      font-weight: 700;
    }

    td {
      font-size: 15px;
    }

    th:first-child {
      width: 19%;
    }

    th:last-child {
      width: 27%;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:first-child:not(:only-child) {
      font-weight: 700;
    }

    .note {
      margin: 23px 0 0;
      font-size: 12px;
      opacity: .8;
    }

    /* =========================
       돌아가기 버튼
    ========================= */

    .back {
      display: inline-block;
      margin-top: 28px;
      padding: 11px 25px;

      border: 1px solid #654028;
      background: rgba(225,185,132,.25);

      color: #422817;
      text-decoration: none;
      font-weight: 700;

      transition: background .2s;
    }

    .back:hover {
      background: rgba(130,80,42,.2);
    }

    /* =========================
       화면 전체 먼지 효과
    ========================= */

    .dust {
      position: fixed;
      inset: 0;

      width: 100vw;
      height: 100vh;

      overflow: hidden;
      pointer-events: none;

      z-index: 9999;
    }

    .particle {
      position: absolute;

      left: var(--x);
      top: var(--y);

      width: var(--size);
      height: var(--size);

      border-radius: 50%;

      background: rgba(255,231,180,.95);
      box-shadow: 0 0 6px rgba(255,220,150,.6);

      opacity: 0;

      animation: dustFloat var(--duration) linear infinite;
      animation-delay: var(--delay);
    }

    @keyframes dustFloat {
      0% {
        opacity: 0;
        transform: translate3d(0,30px,0);
      }

      15% {
        opacity: .9;
      }

      50% {
        opacity: .75;
        transform: translate3d(70px,-60px,0);
      }

      85% {
        opacity: .8;
      }

      100% {
        opacity: 0;
        transform: translate3d(140px,-160px,0);
      }
    }

    /* =========================
       모바일 화면
    ========================= */

    @media (max-width: 650px) {
      body {
        padding: 10px 4px;
        background-attachment: scroll;
      }

      .poster {
        width: 98%;
        min-height: 620px;
        padding: 85px 9% 110px;
      }

      .wanted {
        font-size: clamp(45px,12vw,68px);
      }

      .brand {
        font-size: 9px;
        letter-spacing: 2px;
      }

      .description {
        font-size: 13px;
      }

      th,
      td {
        padding: 10px 4px;
        font-size: 12px;
      }

      .note {
        font-size: 11px;
      }

      .back {
        font-size: 12px;
        padding: 9px 15px;
      }
    }

    /* 움직임 최소화 설정 */

    @media (prefers-reduced-motion: reduce) {
      .paper-bottom,
      .particle {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <!-- WANTED 순위표 -->

  <main class="scene">

    <section class="poster" aria-label="항해자 순위표">

      <!-- 고정된 양피지 위쪽 -->
      <div class="paper-top" aria-hidden="true"></div>

      <!-- 강하게 펄럭이는 양피지 아래쪽 -->
      <div class="paper-bottom" aria-hidden="true"></div>

      <div class="content">

        <h1 class="wanted">WANTED</h1>

        <p class="brand">
          GRAND SECURITY LINE
        </p>

        <p class="description">
          가장 많이 항해한 방문자들의 기록입니다.
        </p>

        <div class="ranking">

          <table>

            <thead>
              <tr>
                <th scope="col">순위</th>
                <th scope="col">닉네임</th>
                <th scope="col">방문 횟수</th>
              </tr>
            </thead>

            <tbody id="crew-ranking">
              <tr>
                <td colspan="3">
                  항해자 명부를 불러오는 중...
                </td>
              </tr>
            </tbody>

          </table>

        </div>

        <p
          class="note"
          id="crew-status"
          role="status"
        >
          방문 횟수 기준 · 동점 시 최근 방문자 우선
        </p>

        <a class="back" href="/blog/">
          ← 블로그로 돌아가기
        </a>

      </div>

    </section>

  </main>

  <!-- 화면 전체 먼지 -->
  <div
    class="dust"
    id="dust"
    aria-hidden="true"
  ></div>

  <script>

    /* =========================
       Supabase 방문자 순위표
    ========================= */

    async function loadCrew() {

      const tbody =
        document.getElementById("crew-ranking");

      const status =
        document.getElementById("crew-status");

      const url =
        "https://zdgopdrehbphshdptjjr.supabase.co/functions/v1/quick-responder";

      function showMessage(message) {

        tbody.replaceChildren();

        const row = tbody.insertRow();
        const cell = row.insertCell();

        cell.colSpan = 3;
        cell.textContent = message;
      }

      try {

        const response = await fetch(url, {
          method: "GET",
          headers: {
            "Accept": "application/json"
          }
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        if (!Array.isArray(data.leaderboard)) {
          throw new Error("잘못된 순위표 응답");
        }

        const visitors =
          data.leaderboard.slice(0, 10);

        if (visitors.length === 0) {

          showMessage(
            "아직 등록된 항해자가 없습니다."
          );

          return;
        }

        tbody.replaceChildren();

        visitors.forEach((visitor, index) => {

          const row = tbody.insertRow();

          row.insertCell().textContent =
            String(index + 1).padStart(2, "0");

          row.insertCell().textContent =
            String(visitor.nickname ?? "");

          row.insertCell().textContent =
            String(visitor.visit_count ?? 0) + "회";

        });

      } catch (error) {

        console.error("Leaderboard error:", error);

        showMessage(
          "항해자 명부를 불러오지 못했습니다."
        );

        status.textContent =
          "잠시 후 다시 시도해 주세요.";
      }
    }

    /* =========================
       먼지 90개 생성
    ========================= */

    function createDust() {

      const dustContainer =
        document.getElementById("dust");

      if (!dustContainer) {
        return;
      }

      dustContainer.replaceChildren();

      const dustCount = 90;

      const reduceMotion =
        window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;

      if (reduceMotion) {
        return;
      }

      for (let i = 0; i < dustCount; i++) {

        const particle =
          document.createElement("span");

        particle.className = "particle";

        /* 화면 전체에 무작위 배치 */
        particle.style.setProperty(
          "--x",
          Math.random() * 100 + "%"
        );

        particle.style.setProperty(
          "--y",
          Math.random() * 100 + "%"
        );

        /* 먼지 크기: 2~5px */
        particle.style.setProperty(
          "--size",
          (Math.random() * 3 + 2) + "px"
        );

        /* 이동 시간: 6~13초 */
        particle.style.setProperty(
          "--duration",
          (Math.random() * 7 + 6) + "s"
        );

        /* 처음부터 먼지가 흩날리도록 설정 */
        particle.style.setProperty(
          "--delay",
          (-Math.random() * 13) + "s"
        );

        dustContainer.appendChild(particle);
      }
    }

    /* =========================
       페이지 시작
    ========================= */

    loadCrew();
    createDust();

  </script>

</body>
</html>
