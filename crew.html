
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WANTED | Grand Security Line</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 12px;
      background: #392519 url("/voyage/background.png")
        center / cover fixed no-repeat;
      font-family: "Noto Serif KR", serif;
      color: #402719;
      overflow-x: hidden;
    }

    /* ===== 양피지 ===== */

    .scene {
      position: relative;
      width: min(100%, 1120px);
      margin: 0 auto;
      isolation: isolate;
    }

    .poster {
      position: relative;
      width: 92%;
      min-height: 730px;
      margin: 0 auto;
      padding: 105px 12% 130px;
      text-align: center;
      filter: drop-shadow(5px 12px 8px rgba(0,0,0,.25));
    }

    /*
      양피지 이미지를 위쪽/아래쪽으로 분리.
      위쪽 75%는 고정하고 아래쪽 25%만 움직임.
    */
    .paper-top,
    .paper-bottom {
      position: absolute;
      inset: 0;
      background: url("/voyage/parchment.png")
        center / 100% 100% no-repeat;
      pointer-events: none;
    }

    .paper-top {
      z-index: 0;
      clip-path: inset(0 0 24.5% 0);
    }

    .paper-bottom {
      z-index: 1;
      clip-path: inset(75% 0 0 0);
      transform-origin: center 75%;
      animation: strongFlutter 3.8s ease-in-out infinite;
      will-change: transform;
    }

    /*
      종이 아래쪽 펄럭임을 이전보다 강하게.
      rotateX + 좌우 이동을 섞어 바람 효과 표현.
    */
    @keyframes strongFlutter {
      0%, 100% {
        transform:
          perspective(900px)
          rotateX(0deg)
          translateX(0);
      }

      22% {
        transform:
          perspective(900px)
          rotateX(7deg)
          translateX(5px);
      }

      43% {
        transform:
          perspective(900px)
          rotateX(-4deg)
          translateX(-4px);
      }

      65% {
        transform:
          perspective(900px)
          rotateX(9deg)
          translateX(7px);
      }

      82% {
        transform:
          perspective(900px)
          rotateX(-2deg)
          translateX(-2px);
      }
    }

    .content {
      position: relative;
      z-index: 2;
    }

    /* ===== 제목 ===== */

    .wanted {
      margin: 0;
      font-family: "Pirata One", Georgia, serif;
      font-size: clamp(55px, 8vw, 92px);
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: 2px;
      color: #642d1d;
    }

    .brand {
      margin: 10px 0 26px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
    }

    .description {
      margin: 0 0 27px;
      font-size: clamp(14px, 1.8vw, 18px);
      font-weight: 700;
    }

    /* ===== 순위표 ===== */

    .ranking {
      width: 100%;
      border: 1px solid rgba(91,52,28,.65);
      background: rgba(235,201,151,.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th, td {
      padding: 13px 7px;
      border-bottom: 1px solid rgba(83,48,26,.3);
      overflow-wrap: anywhere;
    }

    th {
      background: rgba(102,59,30,.12);
      font-size: 15px;
      font-weight: 700;
    }

    td {
      font-size: 15px;
    }

    th:first-child {
      width: 19%;
    }

    th:last-child {
      width: 27%;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:first-child:not(:only-child) {
      font-weight: 700;
    }

    /* ===== 안내 문구 ===== */

    .note {
      margin: 23px 0 0;
      font-size: 12px;
      opacity: .8;
    }

    /* ===== 돌아가기 ===== */

    .back {
      display: inline-block;
      margin-top: 28px;
      padding: 11px 25px;
      border: 1px solid #654028;
      background: rgba(225,185,132,.25);
      color: #422817;
      text-decoration: none;
      font-weight: 700;
      transition: background .2s;
    }

    .back:hover {
      background: rgba(130,80,42,.2);
    }

    /* ===== 화면 전체 먼지 ===== */

    .dust {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: rgba(219,197,160,.65);
      filter: blur(.6px);
      opacity: 0;
      animation: dustFloat var(--duration) linear infinite;
      animation-delay: var(--delay);
    }

    @keyframes dustFloat {
      0% {
        opacity: 0;
        transform: translate3d(0,25px,0);
      }

      15% {
        opacity: .45;
      }

      70% {
        opacity: .3;
      }

      100% {
        opacity: 0;
        transform: translate3d(75px,-100px,0);
      }
    }

    /* ===== 모바일 ===== */

    @media (max-width: 650px) {
      body {
        padding: 10px 4px;
        background-attachment: scroll;
      }

      .poster {
        width: 98%;
        min-height: 620px;
        padding: 85px 9% 110px;
      }

      .wanted {
        font-size: clamp(45px,12vw,68px);
      }

      .brand {
        font-size: 9px;
        letter-spacing: 2px;
      }

      .description {
        font-size: 13px;
      }

      th, td {
        padding: 10px 4px;
        font-size: 12px;
      }

      .note {
        font-size: 11px;
      }

      .back {
        font-size: 12px;
        padding: 9px 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .paper-bottom,
      .particle {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <main class="scene">

    <section class="poster" aria-label="항해자 순위표">

      <!-- 위쪽 75%는 고정 -->
      <div class="paper-top" aria-hidden="true"></div>

      <!-- 아래쪽 25%는 바람에 펄럭임 -->
      <div class="paper-bottom" aria-hidden="true"></div>

      <div class="content">

        <h1 class="wanted">WANTED</h1>

        <p class="brand">GRAND SECURITY LINE</p>

        <p class="description">
          가장 많이 항해한 방문자들의 기록입니다.
        </p>

        <div class="ranking">
          <table>
            <thead>
              <tr>
                <th scope="col">순위</th>
                <th scope="col">닉네임</th>
                <th scope="col">방문 횟수</th>
              </tr>
            </thead>

            <tbody id="crew-ranking">
              <tr>
                <td colspan="3">
                  항해자 명부를 불러오는 중...
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <p class="note" id="crew-status" role="status">
          방문 횟수 기준 · 동점 시 최근 방문자 우선
        </p>

        <a class="back" href="/blog/">
          ← 블로그로 돌아가기
        </a>

      </div>

    </section>

  </main>

  <!-- 화면 전체 먼지 -->
  <div class="dust" id="dust" aria-hidden="true"></div>

  <script>
    /* ===== Supabase 순위표 ===== */

    async function loadCrew() {
      const tbody = document.getElementById("crew-ranking");
      const status = document.getElementById("crew-status");

      const url =
        "https://zdgopdrehbphshdptjjr.supabase.co/functions/v1/quick-responder";

      function showMessage(message) {
        tbody.replaceChildren();
        const row = tbody.insertRow();
        const cell = row.insertCell();
        cell.colSpan = 3;
        cell.textContent = message;
      }

      try {
        const response = await fetch(url, {
          method: "GET",
          headers: {
            "Accept": "application/json"
          }
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        if (!Array.isArray(data.leaderboard)) {
          throw new Error("잘못된 순위표 응답");
        }

        const visitors = data.leaderboard.slice(0, 10);

        if (visitors.length === 0) {
          showMessage("아직 등록된 항해자가 없습니다.");
          return;
        }

        tbody.replaceChildren();

        visitors.forEach((visitor, index) => {
          const row = tbody.insertRow();

          row.insertCell().textContent =
            String(index + 1).padStart(2, "0");

          row.insertCell().textContent =
            String(visitor.nickname ?? "");

          row.insertCell().textContent =
            String(visitor.visit_count ?? 0) + "회";
        });

      } catch (error) {
        console.error("Leaderboard error:", error);
        showMessage("항해자 명부를 불러오지 못했습니다.");
        status.textContent = "잠시 후 다시 시도해 주세요.";
      }
    }

    /* ===== 화면 전체 먼지 생성 ===== */

    function createDust() {
      const dustContainer = document.getElementById("dust");
      const dustCount = 45;

      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        return;
      }

      for (let i = 0; i < dustCount; i++) {
        const particle = document.createElement("span");
        particle.className = "particle";

        particle.style.setProperty(
          "--x", Math.random() * 100 + "%"
        );

        particle.style.setProperty(
          "--y", Math.random() * 100 + "%"
        );

        particle.style.setProperty(
          "--size", (Math.random() * 2.5 + 1) + "px"
        );

        particle.style.setProperty(
          "--duration", (Math.random() * 9 + 9) + "s"
        );

        particle.style.setProperty(
          "--delay", (-Math.random() * 18) + "s"
        );

        dustContainer.appendChild(particle);
      }
    }

    loadCrew();
    createDust();
  </script>

</body>
</html>
