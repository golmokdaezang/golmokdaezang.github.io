
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WANTED | Grand Security Line</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap"
    rel="stylesheet"
  >

  <style>
    /* =========================
       시작 화면과 동일한 손글씨 폰트
    ========================= */

    @font-face {
      font-family: "YoonChoWooSan";
      src: url(
        "https://cdn.jsdelivr.net/gh/projectnoonnu/2408@1.0/YoonChildfundkoreaManSeh.woff2"
      ) format("woff2");
      font-weight: normal;
      font-display: swap;
    }

    /* =========================
       기본 설정
    ========================= */

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 12px;
      overflow-x: hidden;

      background-color: #392519;
      background-image: url("/voyage/background.png");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;

      font-family: "YoonChoWooSan", sans-serif;
      color: #402719;
    }

    /* =========================
       양피지 전체 영역
    ========================= */

    .scene {
      position: relative;
      width: min(100%, 1120px);
      margin: 0 auto;
      isolation: isolate;
    }

    .poster {
      position: relative;
      width: 92%;
      min-height: 730px;
      margin: 0 auto;
      padding: 105px 12% 130px;
      text-align: center;

      filter: drop-shadow(
        5px 12px 8px rgba(0, 0, 0, 0.25)
      );
    }

    /* =========================
       양피지 이미지
    ========================= */

    .paper-top,
    .paper-bottom {
      position: absolute;
      inset: 0;

      background-image: url("/voyage/parchment.png");
      background-position: center;
      background-size: 100% 100%;
      background-repeat: no-repeat;

      pointer-events: none;
    }

    /*
       윗부분은 고정.
       못도 움직이지 않음.
    */

    .paper-top {
      z-index: 0;
      clip-path: inset(0 0 24.5% 0);
    }

    /*
       아래쪽 25%만 펄럭임.
       최대 10도 / 4초 주기
    */

    .paper-bottom {
      z-index: 1;
      clip-path: inset(75% 0 0 0);

      transform-origin: center 75%;
      animation: strongFlutter 4s ease-in-out infinite;

      will-change: transform;
    }

    @keyframes strongFlutter {
      0%, 100% {
        transform:
          perspective(750px)
          rotateX(0deg)
          rotateZ(0deg)
          translateX(0);
      }

      20% {
        transform:
          perspective(750px)
          rotateX(8deg)
          rotateZ(0.5deg)
          translateX(4px);
      }

      40% {
        transform:
          perspective(750px)
          rotateX(-4deg)
          rotateZ(-0.3deg)
          translateX(-3px);
      }

      60% {
        transform:
          perspective(750px)
          rotateX(10deg)
          rotateZ(0.6deg)
          translateX(5px);
      }

      80% {
        transform:
          perspective(750px)
          rotateX(-3deg)
          rotateZ(-0.2deg)
          translateX(-2px);
      }
    }

    /* =========================
       양피지 내용
    ========================= */

    .content {
      position: relative;
      z-index: 2;
    }

    /* WANTED는 기존 해적 폰트 */

    .wanted {
      margin: 0;

      font-family: "Pirata One", Georgia, serif;
      font-size: clamp(55px, 8vw, 92px);
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: 2px;

      color: #642d1d;
    }

    .brand {
      margin: 10px 0 26px;

      font-size: 19px;
      letter-spacing: 2px;
    }

    .description {
      margin: 0 0 27px;
      font-size: clamp(20px, 2.3vw, 27px);
    }

    /* =========================
       방문자 순위표
    ========================= */

    .ranking {
      width: 100%;

      border: 1px solid rgba(91, 52, 28, 0.65);
      background: rgba(235, 201, 151, 0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      padding: 13px 7px;

      border-bottom:
        1px solid rgba(83, 48, 26, 0.3);

      overflow-wrap: anywhere;
    }

    th {
      background: rgba(102, 59, 30, 0.12);
      font-size: 23px;
      font-weight: normal;
    }

    td {
      font-size: 23px;
    }

    th:first-child {
      width: 19%;
    }

    th:last-child {
      width: 27%;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    /* =========================
       안내 문구
    ========================= */

    .note {
      margin: 23px 0 0;
      font-size: 18px;
      opacity: 0.8;
    }

    /* =========================
       블로그 돌아가기
    ========================= */

    .back {
      display: inline-block;
      margin-top: 28px;
      padding: 11px 25px;

      border: 1px solid #654028;
      background: rgba(225, 185, 132, 0.25);

      color: #422817;
      text-decoration: none;
      font-size: 21px;

      transition: background 0.2s;
    }

    .back:hover {
      background: rgba(130, 80, 42, 0.2);
    }

    /* =========================
       화면 전체 먼지 효과
    ========================= */

    .dust {
      position: fixed;
      inset: 0;

      width: 100vw;
      height: 100vh;

      overflow: hidden;
      pointer-events: none;

      z-index: 9999;
    }

    .particle {
      position: absolute;

      left: var(--x);
      top: var(--y);

      width: var(--size);
      height: var(--size);

      border-radius: 50%;

      background: rgba(255, 231, 180, 0.95);

      box-shadow:
        0 0 6px rgba(255, 220, 150, 0.6);

      opacity: 0;

      animation:
        dustFloat var(--duration) linear infinite;

      animation-delay: var(--delay);
    }

    @keyframes dustFloat {
      0% {
        opacity: 0;
        transform: translate3d(0, 30px, 0);
      }

      15% {
        opacity: 0.9;
      }

      50% {
        opacity: 0.75;
        transform: translate3d(70px, -60px, 0);
      }

      85% {
        opacity: 0.8;
      }

      100% {
        opacity: 0;
        transform: translate3d(140px, -160px, 0);
      }
    }

    /* =========================
       모바일 화면
    ========================= */

    @media (max-width: 650px) {
      body {
        padding: 10px 4px;
        background-attachment: scroll;
      }

      .poster {
        width: 98%;
        min-height: 620px;
        padding: 85px 9% 110px;
      }

      .wanted {
        font-size: clamp(45px, 12vw, 68px);
      }

      .brand {
        font-size: 14px;
        letter-spacing: 1px;
      }

      .description {
        font-size: 19px;
      }

      th,
      td {
        padding: 10px 4px;
        font-size: 18px;
      }

      .note {
        font-size: 15px;
      }

      .back {
        font-size: 18px;
        padding: 9px 15px;
      }
    }

    /* 움직임 최소화 설정 */

    @media (prefers-reduced-motion: reduce) {
      .paper-bottom,
      .particle {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       WANTED 순위표
  ========================= -->

  <main class="scene">

    <section
      class="poster"
      aria-label="항해자 순위표"
    >

      <!-- 고정된 양피지 위쪽 -->
      <div
        class="paper-top"
        aria-hidden="true"
      ></div>

      <!-- 아래쪽만 펄럭이는 양피지 -->
      <div
        class="paper-bottom"
        aria-hidden="true"
      ></div>

      <div class="content">

        <h1 class="wanted">
          WANTED
        </h1>

        <p class="brand">
          GRAND SECURITY LINE
        </p>

        <p class="description">
          가장 많이 항해한 방문자들의 기록입니다.
        </p>

        <div class="ranking">

          <table>
            <thead>
              <tr>
                <th scope="col">순위</th>
                <th scope="col">닉네임</th>
                <th scope="col">방문 횟수</th>
              </tr>
            </thead>

            <tbody id="crew-ranking">
              <tr>
                <td colspan="3">
                  항해자 명부를 불러오는 중...
                </td>
              </tr>
            </tbody>
          </table>

        </div>

        <p
          class="note"
          id="crew-status"
          role="status"
        >
          방문 횟수 기준 · 동점 시 최근 방문자 우선
        </p>

        <a
          class="back"
          href="/blog/"
        >
          ← 블로그로 돌아가기
        </a>

      </div>

    </section>

  </main>

  <!-- 화면 전체 먼지 -->
  <div
    class="dust"
    id="dust"
    aria-hidden="true"
  ></div>

  <script>
    /* =========================
       Supabase 방문자 순위표
    ========================= */

    async function loadCrew() {
      const tbody =
        document.getElementById("crew-ranking");

      const status =
        document.getElementById("crew-status");

      const url =
        "https://zdgopdrehbphshdptjjr.supabase.co/functions/v1/quick-responder";

      function showMessage(message) {
        tbody.replaceChildren();

        const row = tbody.insertRow();
        const cell = row.insertCell();

        cell.colSpan = 3;
        cell.textContent = message;
      }

      try {
        const response = await fetch(url, {
          method: "GET",
          headers: {
            "Accept": "application/json"
          }
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        if (!Array.isArray(data.leaderboard)) {
          throw new Error("잘못된 순위표 응답");
        }

        const visitors =
          data.leaderboard.slice(0, 10);

        if (visitors.length === 0) {
          showMessage(
            "아직 등록된 항해자가 없습니다."
          );
          return;
        }

        tbody.replaceChildren();

        visitors.forEach((visitor, index) => {
          const row = tbody.insertRow();

          row.insertCell().textContent =
            String(index + 1).padStart(2, "0");

          row.insertCell().textContent =
            String(visitor.nickname ?? "");

          row.insertCell().textContent =
            String(visitor.visit_count ?? 0) + "회";
        });

      } catch (error) {
        console.error(
          "Leaderboard error:",
          error
        );

        showMessage(
          "항해자 명부를 불러오지 못했습니다."
        );

        status.textContent =
          "잠시 후 다시 시도해 주세요.";
      }
    }

    /* =========================
       화면 전체 먼지 90개
    ========================= */

    function createDust() {
      const dustContainer =
        document.getElementById("dust");

      if (!dustContainer) return;

      dustContainer.replaceChildren();

      const dustCount = 90;

      if (
        window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches
      ) {
        return;
      }

      for (let i = 0; i < dustCount; i++) {
        const particle =
          document.createElement("span");

        particle.className = "particle";

        particle.style.setProperty(
          "--x",
          Math.random() * 100 + "%"
        );

        particle.style.setProperty(
          "--y",
          Math.random() * 100 + "%"
        );

        particle.style.setProperty(
          "--size",
          (Math.random() * 3 + 2) + "px"
        );

        particle.style.setProperty(
          "--duration",
          (Math.random() * 7 + 6) + "s"
        );

        particle.style.setProperty(
          "--delay",
          (-Math.random() * 13) + "s"
        );

        dustContainer.appendChild(particle);
      }
    }

    /* 페이지 시작 */

    loadCrew();
    createDust();
  </script>

</body>
</html>
