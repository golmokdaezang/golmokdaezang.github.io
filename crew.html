
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WANTED | Grand Security Line</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 12px;
      background: #24170f;
      font-family: "Noto Serif KR", serif;
      color: #382015;
    }

    .poster {
      position: relative;
      isolation: isolate;
      width: min(100%, 1150px);
      min-height: 720px;
      margin: auto;
      padding: 155px 13% 125px;
      background-image: url("/voyage/wanted-bg.png");
      background-position: center;
      background-repeat: no-repeat;
      background-size: 100% 100%;
      text-align: center;
    }

    .poster-content {
      position: relative;
      z-index: 2;
    }

    .wanted {
      margin: 0;
      color: #68291c;
      font-family: "Pirata One", serif;
      font-size: clamp(58px, 9vw, 100px);
      line-height: 1.1;
      letter-spacing: 3px;
    }

    .brand {
      margin: 8px 0 28px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
    }

    .description {
      margin: 0 0 28px;
      font-size: clamp(14px, 2vw, 19px);
      font-weight: 700;
    }

    .ranking {
      width: 100%;
      border: 2px solid #704a2e;
      border-radius: 4px;
      overflow: hidden;
      background: rgba(238, 213, 174, .13);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th, td {
      padding: 15px 8px;
      border-bottom: 1px solid rgba(85, 51, 27, .35);
      overflow-wrap: anywhere;
    }

    th {
      background: rgba(100, 62, 32, .12);
      font-weight: 700;
    }

    th:first-child { width: 20%; }
    th:last-child { width: 25%; }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .note {
      margin: 25px 0 0;
      font-size: 12px;
      color: #65482f;
    }

    .back {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 26px;
      border: 2px solid #68452c;
      color: #422817;
      background: rgba(224, 190, 142, .55);
      text-decoration: none;
      font-weight: 700;
      transition: background .2s;
    }

    .back:hover {
      background: #d0a876;
    }

    /* 오른쪽에서 날아와 꽂히는 칼 */
    .sword {
      position: absolute;
      z-index: 3;
      top: 25%;
      right: 4%;
      width: clamp(130px, 22vw, 245px);
      height: auto;
      pointer-events: none;
      filter: drop-shadow(5px 8px 4px rgba(0,0,0,.35));
      transform-origin: center;
      animation: sword-arrive 1.15s cubic-bezier(.2,.7,.25,1) both;
      animation-delay: .3s;
    }

    @keyframes sword-arrive {
      0% {
        opacity: 0;
        transform: translate(125vw, -90px) rotate(22deg);
      }
      70% {
        opacity: 1;
        transform: translate(-15px, 6px) rotate(-5deg);
      }
      84% {
        transform: translate(5px, -3px) rotate(3deg);
      }
      100% {
        opacity: 1;
        transform: translate(0, 0) rotate(0);
      }
    }

    @media (max-width: 650px) {
      body { padding: 10px 4px; }

      .poster {
        min-height: 620px;
        padding: 115px 9% 110px;
      }

      .wanted {
        font-size: clamp(48px, 13vw, 72px);
      }

      .brand {
        font-size: 10px;
        letter-spacing: 2px;
      }

      th, td {
        padding: 11px 4px;
        font-size: 12px;
      }

      .sword {
        top: 19%;
        right: 0;
        width: 115px;
      }

      .note { font-size: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .sword {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="poster">

    <img
      class="sword"
      src="/voyage/sword.png"
      alt=""
      aria-hidden="true"
    >

    <div class="poster-content">
      <h1 class="wanted">WANTED</h1>
      <p class="brand">GRAND SECURITY LINE</p>

      <p class="description">
        가장 많이 항해한 방문자들의 기록입니다.
      </p>

      <div class="ranking">
        <table>
          <thead>
            <tr>
              <th scope="col">순위</th>
              <th scope="col">닉네임</th>
              <th scope="col">방문 횟수</th>
            </tr>
          </thead>
          <tbody id="crew-ranking">
            <tr>
              <td colspan="3">
                항해자 명부를 불러오는 중...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <p class="note" id="crew-status" role="status">
        방문 횟수 기준 · 동점 시 최근 방문자 우선
      </p>

      <a class="back" href="/blog/">
        ← 블로그로 돌아가기
      </a>
    </div>
  </main>

  <script>
    async function loadCrew() {
      const tbody = document.getElementById("crew-ranking");
      const status = document.getElementById("crew-status");

      const url =
        "https://zdgopdrehbphshdptjjr.supabase.co/functions/v1/quick-responder";

      function showMessage(message) {
        tbody.replaceChildren();
        const row = tbody.insertRow();
        const cell = row.insertCell();
        cell.colSpan = 3;
        cell.textContent = message;
      }

      try {
        const response = await fetch(url, {
          headers: { "Accept": "application/json" }
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        if (!Array.isArray(data.leaderboard)) {
          throw new Error("Invalid leaderboard");
        }

        const visitors = data.leaderboard.slice(0, 10);

        if (visitors.length === 0) {
          showMessage("아직 등록된 항해자가 없습니다.");
          return;
        }

        tbody.replaceChildren();

        visitors.forEach((visitor, index) => {
          const row = tbody.insertRow();

          row.insertCell().textContent =
            String(index + 1).padStart(2, "0");

          row.insertCell().textContent =
            String(visitor.nickname ?? "");

          row.insertCell().textContent =
            String(visitor.visit_count ?? 0) + "회";
        });

      } catch (error) {
        console.error("Leaderboard error:", error);
        showMessage("항해자 명부를 불러오지 못했습니다.");
        status.textContent = "잠시 후 다시 시도해 주세요.";
      }
    }

    loadCrew();
  </script>
</body>
</html>
