
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WANTED | Grand Security Line</title>

  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 25px 12px;
      background: #24170f;
      font-family: "Noto Serif KR", serif;
      color: #3e2618;
    }

    .poster {
      position: relative;
      width: min(100%, 1150px);
      min-height: 750px;
      margin: auto;
      padding: 125px 13% 130px;
      background: url("/voyage/wanted-bg.png")
                  center / 100% 100% no-repeat;
      text-align: center;
      isolation: isolate;
    }

    .content {
      position: relative;
      z-index: 2;
      animation: appear 1.2s ease-out both;
    }

    .wanted {
      margin: 0;
      font-family: "Pirata One", Georgia, serif;
      font-size: clamp(54px, 8vw, 92px);
      font-weight: 400;
      letter-spacing: 3px;
      line-height: 1.1;
      color: #632f20;
    }

    .brand {
      margin: 10px 0 25px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
    }

    .description {
      margin: 0 0 28px;
      font-size: clamp(14px, 2vw, 18px);
      font-weight: 700;
    }

    .ranking {
      border: 1px solid rgba(85, 49, 27, .6);
      background: rgba(238, 210, 166, .08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th, td {
      padding: 15px 8px;
      border-bottom: 1px solid rgba(85, 49, 27, .28);
      overflow-wrap: anywhere;
    }

    th {
      background: rgba(99, 58, 30, .13);
      font-size: 15px;
    }

    td { font-size: 15px; }

    th:first-child { width: 19%; }
    th:last-child { width: 26%; }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:first-child:not(:only-child) {
      font-weight: 700;
    }

    .note {
      margin: 25px 0 0;
      font-size: 12px;
      opacity: .8;
    }

    .back {
      display: inline-block;
      margin-top: 30px;
      padding: 11px 25px;
      border: 1px solid #68452c;
      background: rgba(230, 196, 148, .3);
      color: #422817;
      text-decoration: none;
      font-weight: 700;
      transition: background .2s;
    }

    .back:hover {
      background: rgba(113, 69, 38, .2);
    }

    /* 종이 아래쪽의 미세한 바람 그림자 */
    .paper-shadow {
      position: absolute;
      z-index: 1;
      left: 12%;
      right: 12%;
      bottom: 3%;
      height: 18px;
      border-radius: 50%;
      background: rgba(0, 0, 0, .3);
      filter: blur(16px);
      pointer-events: none;
      animation: paper-breeze 7s ease-in-out infinite;
    }

    @keyframes paper-breeze {
      0%, 35%, 100% {
        transform: scaleY(.7) translateY(0);
        opacity: .3;
      }
      50% {
        transform: scaleY(1.15) translateY(-3px);
        opacity: .5;
      }
      65% {
        transform: scaleY(.8) translateY(0);
        opacity: .3;
      }
    }

    /* 먼지 입자 */
    .dust {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 3;
    }

    .particle {
      position: absolute;
      bottom: 5%;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #f5e0b5;
      box-shadow: 0 0 5px rgba(255, 223, 165, .6);
      opacity: 0;
      animation: float-dust 9s ease-in-out infinite;
    }

    .particle:nth-child(1) {
      left: 16%;
      animation-delay: 0s;
    }

    .particle:nth-child(2) {
      left: 30%;
      animation-delay: 2s;
      width: 2px;
      height: 2px;
    }

    .particle:nth-child(3) {
      left: 57%;
      animation-delay: 4s;
    }

    .particle:nth-child(4) {
      left: 76%;
      animation-delay: 1.5s;
      width: 2px;
      height: 2px;
    }

    .particle:nth-child(5) {
      left: 87%;
      animation-delay: 5s;
    }

    @keyframes float-dust {
      0%, 20%, 100% {
        opacity: 0;
        transform: translate(0, 0);
      }
      35% {
        opacity: .55;
      }
      70% {
        opacity: .25;
        transform: translate(22px, -90px);
      }
      85% {
        opacity: 0;
        transform: translate(35px, -120px);
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 650px) {
      body { padding: 8px 3px; }

      .poster {
        min-height: 620px;
        padding: 100px 9% 100px;
      }

      .wanted {
        font-size: clamp(46px, 12vw, 68px);
      }

      .brand {
        font-size: 9px;
        letter-spacing: 2px;
      }

      th, td {
        padding: 11px 4px;
        font-size: 12px;
      }

      .note { font-size: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .content,
      .paper-shadow,
      .particle {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="poster">

    <div class="paper-shadow" aria-hidden="true"></div>

    <div class="dust" aria-hidden="true">
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
    </div>

    <div class="content">
      <h1 class="wanted">WANTED</h1>

      <p class="brand">GRAND SECURITY LINE</p>

      <p class="description">
        가장 많이 항해한 방문자들의 기록입니다.
      </p>

      <div class="ranking">
        <table>
          <thead>
            <tr>
              <th scope="col">순위</th>
              <th scope="col">닉네임</th>
              <th scope="col">방문 횟수</th>
            </tr>
          </thead>
          <tbody id="crew-ranking">
            <tr>
              <td colspan="3">항해자 명부를 불러오는 중...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <p class="note" id="crew-status" role="status">
        방문 횟수 기준 · 동점 시 최근 방문자 우선
      </p>

      <a class="back" href="/blog/">
        ← 블로그로 돌아가기
      </a>
    </div>
  </main>

  <script>
    async function loadCrew() {
      const tbody = document.getElementById("crew-ranking");
      const status = document.getElementById("crew-status");

      const url =
        "https://zdgopdrehbphshdptjjr.supabase.co/functions/v1/quick-responder";

      function showMessage(message) {
        tbody.replaceChildren();

        const row = tbody.insertRow();
        const cell = row.insertCell();

        cell.colSpan = 3;
        cell.textContent = message;
      }

      try {
        const response = await fetch(url, {
          method: "GET",
          headers: {
            "Accept": "application/json"
          }
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        if (!Array.isArray(data.leaderboard)) {
          throw new Error("Invalid leaderboard response");
        }

        const visitors = data.leaderboard.slice(0, 10);

        if (visitors.length === 0) {
          showMessage("아직 등록된 항해자가 없습니다.");
          return;
        }

        tbody.replaceChildren();

        visitors.forEach((visitor, index) => {
          const row = tbody.insertRow();

          row.insertCell().textContent =
            String(index + 1).padStart(2, "0");

          row.insertCell().textContent =
            String(visitor.nickname ?? "");

          row.insertCell().textContent =
            String(visitor.visit_count ?? 0) + "회";
        });

      } catch (error) {
        console.error("Leaderboard error:", error);

        showMessage("항해자 명부를 불러오지 못했습니다.");
        status.textContent = "잠시 후 다시 시도해 주세요.";
      }
    }

    loadCrew();
  </script>
</body>
</html>
